---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: infra
  labels:
    app: redis
spec:
  ports:
  - port: 6379
    targetPort: 6379
  selector:
    app: redis
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: infra
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
      annotations:
        swirl-cloud.io/application-data: disabled
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 10001
      containers:
      - name: redis
        command: ["sh", "-ec"]
        args:
        - |
          if [ "${BM_REDIS_AUTH_ENABLED:-false}" = true ]; then
            exec redis-server --aclfile /etc/redis-acl/users.acl
          fi
          exec redis-server
        envFrom:
        - configMapRef:
            name: application-data-access
            optional: true
        image: docker.io/library/redis:8.10.0-alpine@sha256:978f0e01593e65eed801f2402944efcd936d43b5027e4908a7897baf88ed6241
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          readOnlyRootFilesystem: true
        ports:
        - containerPort: 6379
        readinessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 15
          periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
        volumeMounts:
        - name: redis-data
          mountPath: /data
        - name: redis-acl
          mountPath: /etc/redis-acl
          readOnly: true
      - name: redis-exporter
        image: quay.io/oliver006/redis_exporter:v1.92.0-alpine@sha256:b07ce24af20faeb4033a91dd30c2639dba6fc059cdfec97ecc7d320dab4f43cb
        # The ACL Secret can exist before Redis enforces it; an unexpected
        # password makes every scrape fail authentication.
        command: ["sh", "-ec"]
        args:
        - |
          [ "${BM_REDIS_AUTH_ENABLED:-false}" = true ] || unset REDIS_PASSWORD
          exec /redis_exporter
        envFrom:
        - configMapRef:
            name: application-data-access
            optional: true
        env:
        - name: REDIS_ADDR
          value: redis://127.0.0.1:6379
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: application-redis-auth
              key: auth
              optional: true
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          readOnlyRootFilesystem: true
        ports:
        - name: metrics
          containerPort: 9121
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
      volumes:
      - name: redis-acl
        secret:
          secretName: application-redis-auth
          optional: true
      - name: redis-data
        emptyDir:
          sizeLimit: 256Mi
