---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: infra
  labels:
    app: postgres
data:
  POSTGRES_DB: appdb
  POSTGRES_USER: admin


---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-script
  namespace: infra
  labels:
    app: postgres
data:
  init.sql: |
    CREATE DATABASE keycloak;

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-v18-pvc
  namespace: infra
spec:
  storageClassName: longhorn
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi


---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: infra
spec:
  ports:
  - port: 5432
    targetPort: 5432
  selector:
    app: postgres
  type: ClusterIP


---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: infra
  labels:
    app: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: postgres
        image: docker.io/library/postgres:18.6-bookworm@sha256:bbf83594798e144bff365a9c191c5d779f181fb3135902064ab8ff11918020fc
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          readOnlyRootFilesystem: true
        env:
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: postgres-config
              key: POSTGRES_DB
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
        - name: PGDATA
          value: /var/lib/postgresql/18/docker
        ports:
        - containerPort: 5432
        volumeMounts:
        - mountPath: /var/lib/postgresql
          name: postgres-storage
        - mountPath: /docker-entrypoint-initdb.d/init.sql
          subPath: init.sql
          name: postgres-init
        - name: tmp
          mountPath: /tmp
        - name: postgres-run
          mountPath: /var/run/postgresql
        # pg_isready needs no user or database; probes cannot expand $(VAR) from Secrets anyway.
        # Restarting a slow database drops every client and replays WAL, so liveness allows two
        # minutes of failures and the startup probe gives crash recovery ten minutes.
        startupProbe:
          exec:
            command: ["pg_isready", "-q"]
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 60
        livenessProbe:
          exec:
            command: ["pg_isready", "-q"]
          periodSeconds: 20
          timeoutSeconds: 10
          failureThreshold: 6
        readinessProbe:
          exec:
            command: ["pg_isready", "-q"]
          periodSeconds: 5
          timeoutSeconds: 5
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 1Gi
      - name: postgres-exporter
        image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          readOnlyRootFilesystem: true
        env:
        - name: DATA_SOURCE_URI
          value: 127.0.0.1:5432/postgres?sslmode=disable
        - name: DATA_SOURCE_USER
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_USER
        - name: DATA_SOURCE_PASS
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
        ports:
        - name: metrics
          containerPort: 9187
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-v18-pvc
      - name: postgres-init
        configMap:
          name: postgres-init-script
      - name: tmp
        emptyDir:
          sizeLimit: 256Mi
      - name: postgres-run
        emptyDir:
          sizeLimit: 256Mi
