apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: odoo-secret
  namespace: corp
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: odoo-secret
    creationPolicy: Owner
  data:
    - secretKey: ODOO_DB_USER
      remoteRef:
        key: infra/odoo
        property: database_username
    - secretKey: ODOO_DB_PASSWORD
      remoteRef:
        key: infra/odoo
        property: database_password
    - secretKey: ODOO_ADMIN_PASSWORD
      remoteRef:
        key: infra/odoo
        property: admin_password
    - secretKey: ODOO_DATABASE_MASTER_PASSWORD
      remoteRef:
        key: infra/odoo
        property: database_master_password
    - secretKey: POSTGRES_ADMIN_USER
      remoteRef:
        key: infra/postgres
        property: username
    - secretKey: POSTGRES_ADMIN_PASSWORD
      remoteRef:
        key: infra/postgres
        property: password
    - secretKey: SSO_PRIMARY_EMAIL
      remoteRef:
        key: infra/keycloak
        property: sso_primary_email

---
# Platform mail relay (ADR 0029); the bootstrap below keeps Odoo's
# "Platform mail" outgoing server in line with it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: platform-mail
  namespace: corp
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: platform-mail
    creationPolicy: Owner
  data:
    - secretKey: PLATFORM_MAIL_ENABLED
      remoteRef: {key: infra/smtp, property: enabled}
    - secretKey: PLATFORM_MAIL_HOST
      remoteRef: {key: infra/smtp, property: host}
    - secretKey: PLATFORM_MAIL_PORT
      remoteRef: {key: infra/smtp, property: port}
    - secretKey: PLATFORM_MAIL_TLS
      remoteRef: {key: infra/smtp, property: tls}
    - secretKey: PLATFORM_MAIL_USERNAME
      remoteRef: {key: infra/smtp, property: username}
    - secretKey: PLATFORM_MAIL_PASSWORD
      remoteRef: {key: infra/smtp, property: password}
    - secretKey: PLATFORM_MAIL_FROM
      remoteRef: {key: infra/smtp, property: from_address}

---
# Odoo add-ons from k8s/files/odoo-addons/, generated by
# templates/_odoo_addons.tpl.
# swirl-cloud:odoo-addon-configmaps

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: odoo-data-pvc
  namespace: corp
  labels:
    app: odoo
spec:
  storageClassName: longhorn
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---
apiVersion: v1
kind: Service
metadata:
  name: odoo
  namespace: corp
  labels:
    app: odoo
spec:
  type: ClusterIP
  selector:
    app: odoo
  ports:
    - name: http
      port: 8069
      targetPort: http
    - name: websocket
      port: 8072
      targetPort: websocket

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: odoo
  namespace: corp
  labels:
    app: odoo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: odoo
  template:
    metadata:
      labels:
        app: odoo
      annotations:
        swirl-cloud.io/odoo-addons: pending
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: render-config
          image: docker.io/library/odoo:19.0-20260908@sha256:144175ec0039d52daff1d79f7e51c9281ca3c98b96c830feb49d09764a9f5d7c
          command: ["/bin/bash", "-ec"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          args:
            - |
              umask 077
              {
                printf '[options]\n'
                printf 'admin_passwd = %s\n' "$ODOO_DATABASE_MASTER_PASSWORD"
                printf 'data_dir = /var/lib/odoo\n'
                printf 'addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons\n'
                printf 'db_host = postgres.__INTERNAL_DNS_ZONE__\n'
                printf 'db_port = 5432\n'
                printf 'db_user = %s\n' "$ODOO_DB_USER"
                printf 'db_password = %s\n' "$ODOO_DB_PASSWORD"
                printf 'db_name = odoo\n'
                printf 'dbfilter = ^odoo$\n'
                printf 'list_db = False\n'
                printf 'proxy_mode = True\n'
                printf 'without_demo = True\n'
                printf 'http_interface = 0.0.0.0\n'
                printf 'workers = 2\n'
                printf 'max_cron_threads = 1\n'
                printf 'limit_memory_soft = 536870912\n'
                printf 'limit_memory_hard = 671088640\n'
                printf 'limit_time_cpu = 120\n'
                printf 'limit_time_real = 240\n'
              } > /etc/odoo-generated/odoo.conf
          env:
            - name: ODOO_DATABASE_MASTER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: odoo-secret
                  key: ODOO_DATABASE_MASTER_PASSWORD
            - name: ODOO_DB_USER
              valueFrom:
                secretKeyRef:
                  name: odoo-secret
                  key: ODOO_DB_USER
            - name: ODOO_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: odoo-secret
                  key: ODOO_DB_PASSWORD
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: odoo-config
              mountPath: /etc/odoo-generated
            - name: tmp
              mountPath: /tmp
        - name: bootstrap-database
          image: docker.io/library/odoo:19.0-20260908@sha256:144175ec0039d52daff1d79f7e51c9281ca3c98b96c830feb49d09764a9f5d7c
          command: ["/bin/bash", "-ec"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          args:
            - |
              until PGPASSWORD="$POSTGRES_ADMIN_PASSWORD" psql \
                --host="$ODOO_DB_HOST" \
                --port="$ODOO_DB_PORT" \
                --username="$POSTGRES_ADMIN_USER" \
                --dbname=postgres \
                --no-password \
                --tuples-only \
                --command='SELECT 1' >/dev/null 2>&1; do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done

              PGPASSWORD="$POSTGRES_ADMIN_PASSWORD" psql \
                --host="$ODOO_DB_HOST" \
                --port="$ODOO_DB_PORT" \
                --username="$POSTGRES_ADMIN_USER" \
                --dbname=postgres \
                --no-password \
                --set=db_user="$ODOO_DB_USER" \
                --set=db_password="$ODOO_DB_PASSWORD" <<'SQL'
              SELECT format(
                'CREATE ROLE %I WITH LOGIN PASSWORD %L NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION',
                :'db_user', :'db_password'
              )
              WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = :'db_user')
              \gexec
              SELECT format(
                'ALTER ROLE %I WITH LOGIN PASSWORD %L NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION',
                :'db_user', :'db_password'
              )
              \gexec
              SELECT format('CREATE DATABASE %I OWNER %I', 'odoo', :'db_user')
              WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'odoo')
              \gexec
              SELECT format('ALTER DATABASE %I OWNER TO %I', 'odoo', :'db_user')
              \gexec
              SQL

              schema_ready="$(PGPASSWORD="$ODOO_DB_PASSWORD" psql \
                --host="$ODOO_DB_HOST" \
                --port="$ODOO_DB_PORT" \
                --username="$ODOO_DB_USER" \
                --dbname=odoo \
                --no-password \
                --tuples-only \
                --no-align \
                --command="SELECT to_regclass('public.ir_config_parameter') IS NOT NULL")"

              if [[ "$schema_ready" != "t" ]]; then
                echo "Initializing the Odoo database without demo data..."
                odoo \
                  --config=/etc/odoo-generated/odoo.conf \
                  --database=odoo \
                  --init=base \
                  --without-demo \
                  --stop-after-init
              fi

              echo "Installing the managed Keycloak OAuth integration, dark theme, CRM and Live Chat..."
              odoo \
                --config=/etc/odoo-generated/odoo.conf \
                --database=odoo \
                --init=auth_oauth,odoo_keycloak_sso,web_dark_mode,crm,im_livechat,platform_crm_intake \
                --update=platform_crm_intake \
                --without-demo \
                --stop-after-init

              # Reconcile from the managed Secret on every start, so a rotation
              # never leaves Odoo with stale credentials.
              echo "Reconciling the Odoo administrator and base URL configuration..."
              cat <<'PY' | odoo shell --config=/etc/odoo-generated/odoo.conf --database=odoo
              import os

              env.ref('base.main_company').write({'name': os.environ['ORGANIZATION_NAME']})
              admin = env.ref('base.user_admin')
              # Write only what differs: Odoo emails a security notice for every
              # login or password write, which would repeat on each restart.
              from odoo.exceptions import AccessDenied
              credentials = {}
              if admin.login != os.environ['SSO_PRIMARY_EMAIL']:
                  credentials['login'] = os.environ['SSO_PRIMARY_EMAIL']
              if admin.email != os.environ['SSO_PRIMARY_EMAIL']:
                  credentials['email'] = os.environ['SSO_PRIMARY_EMAIL']
              try:
                  admin.with_user(admin)._check_credentials(
                      {'type': 'password', 'login': admin.login, 'password': os.environ['ODOO_ADMIN_PASSWORD']},
                      {'interactive': False})
              except AccessDenied:
                  credentials['password'] = os.environ['ODOO_ADMIN_PASSWORD']
              if credentials:
                  admin.write(credentials)
              params = env['ir.config_parameter'].sudo()
              # Seed the requested preference once; later user choices survive restarts.
              if not params.get_param('swirl_cloud.dark_mode_initialized'):
                  admin.write({'dark_mode': True, 'dark_mode_device_dependent': False})
                  params.set_param('swirl_cloud.dark_mode_initialized', 'true')
              # Seed CRM and Live Chat once; later staff changes survive restarts.
              if not params.get_param('swirl_cloud.crm_initialized'):
                  # Website inquiries arrive as leads to qualify, not opportunities.
                  env['res.config.settings'].create({'group_use_lead': True}).execute()
                  params.set_param('swirl_cloud.crm_initialized', 'true')
              if not params.get_param('swirl_cloud.livechat_initialized'):
                  # active_test=False: the installing system user is archived,
                  # and set() would otherwise keep it as an agent.
                  channel = env.ref('im_livechat.im_livechat_channel_data').with_context(active_test=False)
                  channel.write({
                      'name': os.environ['ORGANIZATION_NAME'],
                      'user_ids': [(6, 0, [admin.id])],
                  })
                  organization = os.environ['ORGANIZATION_NAME']
                  team = env['crm.team'].search([('company_id', 'in', [env.company.id, False])], order='sequence, id', limit=1)
                  # English source text with French translations; the add-on
                  # answers each visitor in their browser language.
                  steps = [
                      ('text', "Hello, and thank you for visiting %s." % organization,
                       "Bonjour et merci de votre visite chez %s." % organization),
                      ('question_email', "So we can answer you even if you leave this page, what is your email address?",
                       "Pour pouvoir vous répondre même si vous quittez la page, quelle est votre adresse e-mail ?"),
                      ('free_input_multi', "Thank you! How can we help you?", "Merci ! Comment pouvons-nous vous aider ?"),
                      ('create_lead', "Noted. We'll get back to you as soon as we can.",
                       "C'est noté. Nous revenons vers vous au plus vite."),
                  ]
                  script = env['chatbot.script'].create({
                      'title': organization,
                      'script_step_ids': [(0, 0, {'step_type': kind, 'message': english, 'sequence': index,
                                                  **({'crm_team_id': team.id} if kind == 'create_lead' else {})})
                                          for index, (kind, english, _french) in enumerate(steps)],
                  })
                  script.source_id.name = organization + ' Live Chat'
                  if env['res.lang']._lang_get('fr_FR'):
                      for step, (_kind, english, french) in zip(script.script_step_ids.sorted('sequence'), steps):
                          step.update_field_translations('message', {'fr_FR': {english: french}})
                  # Open the chat as soon as a wide page loads it (the website's frame
                  # opens it itself). The bot answers only while no agent is online.
                  channel.rule_ids = [(0, 0, {'action': 'auto_popup', 'auto_popup_timer': 0, 'chatbot_script_id': script.id,
                                               'chatbot_enabled_condition': 'only_if_no_operator'})]
                  params.set_param('swirl_cloud.livechat_initialized', 'true')
              # Platform mail relay (ADR 0029): an outgoing server for the
              # sender's domain, after more specific servers such as a website's.
              # A bad setting is reported and never stops Odoo from starting.
              Servers = env['ir.mail_server'].sudo().with_context(active_test=False)
              platform_server = Servers.search([('name', '=', 'Platform mail')], limit=1)
              if os.environ.get('PLATFORM_MAIL_ENABLED') == 'true':
                  try:
                      mail_domain = os.environ['PLATFORM_MAIL_FROM'].partition('@')[2]
                      if not mail_domain or not os.environ['PLATFORM_MAIL_HOST']:
                          raise ValueError('sender address or host missing')
                      server_values = {
                          'name': 'Platform mail', 'active': True, 'sequence': 20,
                          'smtp_host': os.environ['PLATFORM_MAIL_HOST'],
                          'smtp_port': int(os.environ['PLATFORM_MAIL_PORT']),
                          'smtp_encryption': 'ssl' if os.environ.get('PLATFORM_MAIL_TLS') == 'ssl' else 'starttls',
                          'smtp_authentication': 'login',
                          'smtp_user': os.environ['PLATFORM_MAIL_USERNAME'],
                          'smtp_pass': os.environ['PLATFORM_MAIL_PASSWORD'],
                          'from_filter': mail_domain,
                      }
                      if not platform_server:
                          Servers.create(server_values)
                      else:
                          changed = {key: value for key, value in server_values.items() if platform_server[key] != value}
                          if changed:
                              platform_server.write(changed)
                      company = env.ref('base.main_company')
                      if not company.alias_domain_id:
                          Domains = env['mail.alias.domain'].sudo()
                          company.alias_domain_id = (Domains.search([('name', '=', mail_domain)], limit=1)
                                                     or Domains.create({'name': mail_domain}))
                  except (KeyError, ValueError) as error:
                      print('Platform mail was not applied to Odoo: %s' % error)
              elif platform_server.active or platform_server.smtp_pass:
                  platform_server.write({'active': False, 'smtp_pass': False})
              params.set_param('web.base.url', 'https://odoo.__PUBLIC_DOMAIN__')
              params.set_param('web.base.url.freeze', 'True')
              params.set_param('auth_oauth.authorization_header', 'True')
              params.set_param('swirl_cloud.bootstrap_complete', 'true')
              provider_values = {
                  'name': 'Keycloak',
                  'client_id': 'odoo',
                  'auth_endpoint': 'https://keycloak.__PUBLIC_DOMAIN__/auth/realms/__KEYCLOAK_REALM__/protocol/openid-connect/auth',
                  'validation_endpoint': 'https://keycloak.__PUBLIC_DOMAIN__/auth/realms/__KEYCLOAK_REALM__/protocol/openid-connect/userinfo',
                  'data_endpoint': '',
                  'scope': 'openid profile email',
                  'enabled': True,
                  'body': 'Sign in with Keycloak',
                  'css_class': 'fa fa-fw fa-sign-in text-primary',
                  'sequence': 1,
              }
              provider = env['auth.oauth.provider'].sudo().search([('name', '=', 'Keycloak')], limit=1)
              if provider:
                  provider.write(provider_values)
              else:
                  env['auth.oauth.provider'].sudo().create(provider_values)
              # The publisher-warranty cron reports the database UUID, user
              # counts and installed apps to Odoo SA daily; keep it off.
              update_notification = env.ref('mail.ir_cron_module_update_notification', raise_if_not_found=False)
              if update_notification and update_notification.active:
                  update_notification.sudo().active = False
              env.cr.commit()
              PY
          env:
            - name: ODOO_DB_HOST
              value: postgres.__INTERNAL_DNS_ZONE__
            - name: ODOO_DB_PORT
              value: "5432"
            - name: POSTGRES_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: odoo-secret
                  key: POSTGRES_ADMIN_USER
            - name: POSTGRES_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: odoo-secret
                  key: POSTGRES_ADMIN_PASSWORD
            - name: ODOO_DB_USER
              valueFrom:
                secretKeyRef:
                  name: odoo-secret
                  key: ODOO_DB_USER
            - name: ODOO_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: odoo-secret
                  key: ODOO_DB_PASSWORD
            - name: ODOO_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: odoo-secret
                  key: ODOO_ADMIN_PASSWORD
            - name: ORGANIZATION_NAME
              value: __ORGANIZATION_NAME_JSON__
            - name: SSO_PRIMARY_EMAIL
              valueFrom:
                secretKeyRef:
                  name: odoo-secret
                  key: SSO_PRIMARY_EMAIL
          # Required like odoo-secret: the ExternalSecret is created with this
          # Deployment, and the bootstrap must not start before it syncs.
          envFrom:
            - secretRef:
                name: platform-mail
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: odoo-config
              mountPath: /etc/odoo-generated
            - name: odoo-data
              mountPath: /var/lib/odoo
            # swirl-cloud:odoo-addon-mounts
            - name: tmp
              mountPath: /tmp
      containers:
        - name: odoo
          image: docker.io/library/odoo:19.0-20260908@sha256:144175ec0039d52daff1d79f7e51c9281ca3c98b96c830feb49d09764a9f5d7c
          env:
            - name: SSO_PRIMARY_EMAIL
              valueFrom:
                secretKeyRef:
                  name: odoo-secret
                  key: SSO_PRIMARY_EMAIL
          ports:
            - name: http
              containerPort: 8069
            - name: websocket
              containerPort: 8072
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          startupProbe:
            httpGet:
              path: /web/login?local=1
              port: http
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /web/login?local=1
              port: http
            periodSeconds: 10
            failureThreshold: 6
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /web/login?local=1
              port: http
            periodSeconds: 20
            failureThreshold: 6
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 3Gi
          volumeMounts:
            - name: odoo-config
              mountPath: /etc/odoo
            - name: odoo-data
              mountPath: /var/lib/odoo
            # swirl-cloud:odoo-addon-mounts
            - name: tmp
              mountPath: /tmp
      terminationGracePeriodSeconds: 60
      volumes:
        - name: odoo-config
          emptyDir: {}
        - name: odoo-data
          persistentVolumeClaim:
            claimName: odoo-data-pvc
        # swirl-cloud:odoo-addon-volumes
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-odoo-ingress
  namespace: corp
spec:
  podSelector:
    matchLabels:
      app: odoo
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: infra
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8069
        - protocol: TCP
          port: 8072
    # The website's server calls the lead intake API in-cluster
    # (docs/guides/odoo-website.md): opted-in pods only, HTTP port only.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: apps
          podSelector:
            matchLabels:
              swirl-cloud.io/odoo-crm-intake: "true"
      ports:
        - protocol: TCP
          port: 8069

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: odoo
  namespace: corp
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: corp-odoo-body-limit@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - odoo.__PUBLIC_DOMAIN__
      secretName: __TLS_SECRET_NAME__
  rules:
    - host: odoo.__PUBLIC_DOMAIN__
      http:
        paths:
          - path: /websocket
            pathType: Prefix
            backend:
              service:
                name: odoo
                port:
                  number: 8072
          - path: /
            pathType: Prefix
            backend:
              service:
                name: odoo
                port:
                  number: 8069

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: odoo-body-limit
  namespace: corp
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  buffering:
    maxRequestBodyBytes: 1048576
    memRequestBodyBytes: 1048576
