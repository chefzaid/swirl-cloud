{{- if or .Values.platformMigrationRequired (hasKey .Values "securityImagesEnabled") -}}
{{- fail "Legacy ingress/image settings require explicit migration; follow docs/guides/platform-migration.md and replace the root Application Helm settings." -}}
{{- end -}}
{{- define "swirl-cloud.render" -}}
{{- $root := index . 0 -}}
{{- $path := index . 1 -}}
{{- $content := $root.Files.Get $path -}}
{{- /* A block scalar holding only "# swirl-cloud:file <path>" takes files/<path>, indented to the marker; images are base64 for binaryData. */ -}}
{{- range $marker := regexFindAll "(?m)^ *# swirl-cloud:file \\S+$" $content -1 -}}
{{- $file := printf "files/%s" (regexReplaceAll "^ *# swirl-cloud:file " $marker "") -}}
{{- $body := $root.Files.Get $file -}}
{{- if not $body -}}
{{- fail (printf "%s: missing %s" $path $file) -}}
{{- end -}}
{{- if regexMatch "\\.(png|ico|jpe?g|gif|webp)$" $file -}}
{{- $body = b64enc $body -}}
{{- end -}}
{{- $indent := regexReplaceAll "^( *).*$" $marker "${1}" | len -}}
{{- $content = replace $marker ($body | trimSuffix "\n" | indent $indent) $content -}}
{{- end -}}
{{- range $annotation, $source := dict "swirl-cloud.io/application-observability" "platform/application-observability.yaml" "swirl-cloud.io/logging-agent" "platform/logging-agent.yaml" "swirl-cloud.io/prometheus-config" "files/prometheus/*" -}}
{{- $files := "" -}}
{{- range $file, $_ := $root.Files.Glob $source -}}
{{- $files = printf "%s%s" $files ($root.Files.Get $file) -}}
{{- end -}}
{{- $extra := eq $annotation "swirl-cloud.io/prometheus-config" | ternary ($root.Files.Get "files/compliance-controls.yaml") "" -}}
{{- $checksum := printf "%s\n%s%s" $files (include "swirl-cloud.identity" $root) $extra | sha256sum -}}
{{- $content = replace (printf "%s: pending" $annotation) (printf "%s: %s" $annotation $checksum) $content -}}
{{- end -}}
{{- if eq $path "platform/monitoring.yaml" -}}
{{- $content = replace "      # swirl-cloud:compliance-evidence-rules" (include "swirl-cloud.compliance-rule-groups" $root | indent 6) $content -}}
{{- end -}}
{{- if eq $path "corp/odoo.yaml" -}}
{{- $content = replace "# swirl-cloud:odoo-addon-configmaps" (include "swirl-cloud.odoo-addon-configmaps" $root) $content -}}
{{- $content = replace "            # swirl-cloud:odoo-addon-mounts" (include "swirl-cloud.odoo-addon-mounts" $root | trim | indent 12) $content -}}
{{- $content = replace "        # swirl-cloud:odoo-addon-volumes" (include "swirl-cloud.odoo-addon-volumes" $root | trim | indent 8) $content -}}
{{- $content = replace "swirl-cloud.io/odoo-addons: pending" (printf "swirl-cloud.io/odoo-addons: %s" (include "swirl-cloud.odoo-addon-checksum" $root)) $content -}}
{{- end -}}
{{- $content = replace "swirl-cloud.io/application-data: disabled" (printf "swirl-cloud.io/application-data: %s" (toJson ($root.Values.applicationData | default dict) | sha256sum)) $content -}}
{{- range $token, $value := (include "swirl-cloud.identity" $root | fromJson) -}}
{{- $content = replace $token $value $content -}}
{{- end -}}
{{- $content = replace "__PUBLIC_DOMAIN__" (required "publicDomain is required" $root.Values.publicDomain) $content -}}
{{- $content = replace "__INTERNAL_DNS_ZONE__" (required "internalDnsZone is required" $root.Values.internalDnsZone) $content -}}
{{- $content = replace "__GITOPS_REPOSITORY_URL__" (required "gitopsRepositoryURL is required" $root.Values.gitopsRepositoryURL) $content -}}
{{- $content = replace "__CLOUDFLARE_ACCESS_TEAM_NAME__" (required "cloudflareAccessTeamName is required" $root.Values.cloudflareAccessTeamName) $content -}}
{{- $content = replace "__APPS_ENABLED__" (toString $root.Values.appsEnabled) $content -}}
{{- $content = replace "__DESCHEDULER_ENABLED__" (toString $root.Values.deschedulerEnabled) $content -}}
{{- $ha := dict "highAvailabilityEnabled" $root.Values.highAvailabilityEnabled -}}
{{- if $root.Values.postgresHa -}}
{{- $_ := set $ha "postgresHa" $root.Values.postgresHa -}}
{{- end -}}
{{- range $key := list "kafkaHa" "nodeFencing" "applicationData" -}}
{{- if hasKey $root.Values $key -}}
{{- $_ := set $ha $key (index $root.Values $key) -}}
{{- end -}}
{{- end -}}
{{- if ($root.Values.applicationData | default dict).enabled -}}
{{- $redis := index $root.Values "redis-ha" -}}
{{- $_ := set $ha "redis-ha" (dict "auth" $redis.auth "existingSecret" $redis.existingSecret "authKey" $redis.authKey
    "redis" (dict "config" (dict "aclfile" $redis.redis.config.aclfile) "extraVolumeMounts" $redis.redis.extraVolumeMounts)
    "extraVolumes" $redis.extraVolumes) -}}
{{- end -}}
{{- $content = replace "__HA_VALUES_OBJECT__" (toJson $ha) $content -}}
{{ $content }}
---
{{- end -}}

{{- range $path, $_ := .Files.Glob "base/*.yaml" }}
{{- if or $.Values.appsEnabled (ne $path "base/corp-namespace.yaml") }}
{{ include "swirl-cloud.render" (list $ $path) }}
{{- end }}
{{- end }}
{{- range $path, $_ := .Files.Glob "datastores/*.yaml" }}
{{- $pg := $.Values.postgresHa | default dict }}
{{- if and (eq $path "datastores/postgres.yaml") $pg.enabled $pg.active }}
{{- range $document := splitList "\n---" (include "swirl-cloud.render" (list $ $path)) }}
{{- $resource := $document | fromYaml }}
{{- if $resource.kind }}
{{- if eq $resource.kind "Deployment" }}
{{- $_ := set $resource.spec "replicas" 0 }}
{{- else if eq $resource.kind "Service" }}
{{- $_ := set $resource.spec "selector" (dict "cnpg.io/cluster" "postgres-ha" "cnpg.io/instanceRole" "primary") }}
{{- end }}
{{ toYaml $resource }}
---
{{- end }}
{{- end }}
{{- else }}
{{- if and (eq $path "datastores/redis.yaml") $.Values.highAvailabilityEnabled }}
{{- range $document := splitList "\n---" (include "swirl-cloud.render" (list $ $path)) }}
{{- $resource := $document | fromYaml }}
{{- if $resource.kind }}
{{- if eq $resource.kind "Deployment" }}
{{- $_ := set $resource.spec "replicas" 0 }}
{{- else if eq $resource.kind "Service" }}
{{- $_ := set $resource.spec "selector" (dict "app" "redis-ha-haproxy" "release" "swirl-cloud" "component" "haproxy") }}
{{- end }}
{{ toYaml $resource }}
---
{{- end }}
{{- end }}
{{- else }}
{{- $kafka := $.Values.kafkaHa | default dict }}
{{- if and (eq $path "datastores/kafka.yaml") $kafka.enabled }}
{{ include "swirl-cloud.kafka-ha" (list $ $path) }}
{{- else }}
{{ include "swirl-cloud.render" (list $ $path) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- range $path, $_ := .Files.Glob "platform/*.yaml" }}
{{- if and (eq $path "platform/keycloak.yaml") $.Values.highAvailabilityEnabled }}
{{- range $document := splitList "\n---" (include "swirl-cloud.render" (list $ $path)) }}
{{- $resource := $document | fromYaml }}
{{- if $resource.kind }}
{{- if eq $resource.kind "Deployment" }}
{{- $_ := set $resource.spec "replicas" 2 }}
{{- $selector := dict "matchLabels" (dict "app" "keycloak") }}
{{- $term := dict "topologyKey" "kubernetes.io/hostname" "labelSelector" $selector }}
{{- $_ := set $resource.spec.template.spec "affinity" (dict "podAntiAffinity" (dict "requiredDuringSchedulingIgnoredDuringExecution" (list $term))) }}
{{- $_ := set $resource.spec "strategy" (dict "type" "RollingUpdate" "rollingUpdate" (dict "maxUnavailable" 0 "maxSurge" 1)) }}
{{- $container := index $resource.spec.template.spec.containers 0 }}
{{- $_ := set $container "env" (concat $container.env (list (dict "name" "KC_CACHE_STACK" "value" "jdbc-ping"))) }}
{{- end }}
{{ toYaml $resource }}
---
{{- end }}
{{- end }}
{{- else }}
{{ include "swirl-cloud.render" (list $ $path) }}
{{- end }}
{{- end }}
{{- if .Values.appsEnabled }}
{{- range $path, $_ := .Files.Glob "corp/*.yaml" }}
{{ include "swirl-cloud.render" (list $ $path) }}
{{- end }}
{{- end }}
{{- if .Values.deschedulerEnabled }}
{{ include "swirl-cloud.render" (list $ "addons/descheduler.yaml") }}
{{- end }}
{{ include "swirl-cloud.render" (list $ "addons/swirl-cloud-application.yaml") }}
