{{- /* Longhorn snapshot class for VolumeSnapshot objects (platform/volume-snapshots.yaml).
     GitOps only: the installer applies the snapshot API in the same step, before
     Kubernetes serves it. type: snap keeps the snapshot on the volume's replicas;
     a backup class (type: bak) follows once the off-site target exists. */ -}}
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshotClass
metadata:
  name: longhorn-snapshot
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
driver: driver.longhorn.io
deletionPolicy: Delete
parameters:
  type: snap
