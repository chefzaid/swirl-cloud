# Workload priorities. Under memory pressure the kubelet evicts lower classes
# first, and the scheduler may preempt them to place a higher one. A pod with
# no class has priority 0, the same as platform-standard, so nothing unclassified
# drops below where it was. CI jobs sit lowest (ci-jobs, platform/gitlab-runner.yaml).
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: platform-critical
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
value: 1000000
globalDefault: false
description: "What everything else needs to run: data stores, sign-in, secrets and ingress."

---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: production
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
value: 500000
globalDefault: false
description: "Production applications and the company's business applications."

---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: platform-standard
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
value: 0
globalDefault: false
description: "Platform services: delivery, monitoring, logs and their agents."

---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: preproduction
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
value: -20
globalDefault: false
description: "Applications in uat."

---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: integration
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
value: -30
globalDefault: false
description: "Applications in int and other test environments."

---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: platform-background
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
value: -50
globalDefault: false
description: "Analysis and administration tools that can wait: code analysis, vulnerability scans, database and cluster consoles."

---
apiVersion: v1
kind: Namespace
metadata:
  name: infra
  labels:
    # Audit and warn only; ADR 0025 lists what must change before baseline is
    # enforced here.
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.36
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.36
---
apiVersion: v1
kind: Namespace
metadata:
  name: host-agents
  labels:
    # Only the node-level telemetry agents (node-exporter, Fluent Bit, Filebeat),
    # which need host namespaces and hostPath mounts.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: v1.36
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/audit-version: v1.36
    pod-security.kubernetes.io/warn: baseline
    pod-security.kubernetes.io/warn-version: v1.36
---
apiVersion: v1
kind: Namespace
metadata:
  name: gitlab-runners
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: v1.36
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.36
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.36
    security.__PUBLIC_DOMAIN__/deny-hostpath: "true"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: deny-hostpath-on-isolated-namespaces
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  validations:
    - expression: "!has(object.spec.volumes) || object.spec.volumes.all(volume, !has(volume.hostPath))"
      message: "hostPath volumes are forbidden in isolated application and CI namespaces"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: deny-hostpath-on-isolated-namespaces
spec:
  policyName: deny-hostpath-on-isolated-namespaces
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        security.__PUBLIC_DOMAIN__/deny-hostpath: "true"
---
# CVE-2025-1767 (in-tree gitRepo volumes): reject them cluster-wide, including
# namespaces without Restricted pod security.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: deny-gitrepo-volumes
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  validations:
    - expression: "!has(object.spec.volumes) || object.spec.volumes.all(volume, !has(volume.gitRepo))"
      message: "gitRepo volumes are forbidden; use an init container to clone into an emptyDir"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: deny-gitrepo-volumes
spec:
  policyName: deny-gitrepo-volumes
  validationActions: [Deny]
