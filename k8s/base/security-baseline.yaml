apiVersion: v1
kind: Namespace
metadata:
  name: infra
  labels:
    # Audit and warn only; ADR 0025 lists what must change before baseline is
    # enforced here.
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.36
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.36
---
apiVersion: v1
kind: Namespace
metadata:
  name: host-agents
  labels:
    # Only the node-level telemetry agents (node-exporter, Fluent Bit, Filebeat),
    # which need host namespaces and hostPath mounts.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: v1.36
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/audit-version: v1.36
    pod-security.kubernetes.io/warn: baseline
    pod-security.kubernetes.io/warn-version: v1.36
---
apiVersion: v1
kind: Namespace
metadata:
  name: gitlab-runners
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: v1.36
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.36
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.36
    security.__PUBLIC_DOMAIN__/deny-hostpath: "true"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: deny-hostpath-on-isolated-namespaces
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  validations:
    - expression: "!has(object.spec.volumes) || object.spec.volumes.all(volume, !has(volume.hostPath))"
      message: "hostPath volumes are forbidden in isolated application and CI namespaces"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: deny-hostpath-on-isolated-namespaces
spec:
  policyName: deny-hostpath-on-isolated-namespaces
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        security.__PUBLIC_DOMAIN__/deny-hostpath: "true"
---
# CVE-2025-1767 (in-tree gitRepo volumes): reject them cluster-wide, including
# namespaces without Restricted pod security.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: deny-gitrepo-volumes
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  validations:
    - expression: "!has(object.spec.volumes) || object.spec.volumes.all(volume, !has(volume.gitRepo))"
      message: "gitRepo volumes are forbidden; use an init container to clone into an emptyDir"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: deny-gitrepo-volumes
spec:
  policyName: deny-gitrepo-volumes
  validationActions: [Deny]
