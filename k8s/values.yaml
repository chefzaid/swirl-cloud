publicDomain: ""
internalDnsZone: ""
gitopsRepositoryURL: ""
cloudflareAccessTeamName: ""
# The installer supplies these values and records them in its Argo Application.
# Empty optional values derive from the public domain's first label.
organizationName: ""
organizationSlug: ""
gitlabGroupPath: ""
gitlabGroupName: ""
gitlabProjectName: swirl-cloud
keycloakRealm: ""
tlsSecretName: ""
sonarAlmSetting: ""
cloudflareAccessIdpName: ""
# Kafka cluster ID; empty keeps the ID that installations formatted with before it was recorded.
kafkaClusterId: ""
# Portal (Homepage) language: en or fr (files/homepage-fr.yaml); empty is en.
portalLanguage: ""
# Syslog forwarding to a SOC (docs/guides/soc-forwarding.md); an empty host turns it off.
# The port defaults to 6514, the sources to identity,kubernetes-audit,vault-audit,detection;
# socSyslogCa is a base64-encoded PEM CA bundle (empty: the system CAs).
socSyslogHost: ""
socSyslogPort: ""
socSyslogSources: ""
socSyslogCa: ""
# Controls centrally managed corporate workloads; the apps foundation is always included.
appsEnabled: false
deschedulerEnabled: true
highAvailabilityEnabled: false
# Sizing profile (TODO §26): "standard" keeps every manifest's own sizes and fits
# the minimum server; "large" (files/sizing/large.yaml) is for one server with
# 16+ threads and 96+ GiB. The installer suggests one from the host's capacity and
# keeps the recorded one on reruns; volumes only grow.
sizingProfile: standard
nodeFencing:
  enabled: false
  inventorySecret: node-fencing-inventory
  nodeNames: []

# Application cache and rate-limit state; durable jobs live in PostgreSQL.
# Replication is asynchronous, so a failover can lose recent writes. Three
# voters and min-replicas-to-write stop an isolated primary from carrying on.
redis-ha:
  fullnameOverride: shared-redis-ha
  priorityClassName: platform-critical
  image:
    repository: docker.io/library/redis
    tag: 8.10.3-alpine@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
  replicas: 3
  hardAntiAffinity: true
  persistentVolume:
    enabled: true
    storageClass: longhorn
    size: 1Gi
  podDisruptionBudget:
    minAvailable: 2
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    readOnlyRootFilesystem: true
  redis:
    config:
      min-replicas-to-write: 1
      min-replicas-max-lag: 5
      maxmemory: 192mb
      maxmemory-policy: noeviction
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: "1", memory: 384Mi}
  sentinel:
    quorum: 2
    resources:
      requests: {cpu: 25m, memory: 32Mi}
      limits: {cpu: 250m, memory: 64Mi}
  init:
    resources:
      requests: {cpu: 25m, memory: 32Mi}
      limits: {cpu: 250m, memory: 64Mi}
  splitBrainDetection:
    resources:
      requests: {cpu: 25m, memory: 32Mi}
      limits: {cpu: 250m, memory: 64Mi}
  # Not the chart's exporter: its scrape annotations would also match the
  # annotated-pod job once per container. Matches datastores/redis.yaml.
  extraContainers:
    - name: redis-exporter
      image: quay.io/oliver006/redis_exporter:v1.97.0-alpine@sha256:ae30be386ab25600a8b222538a868d1b156b7e411073f7d2d5208fe79cc98d81
      command: ["sh", "-ec"]
      args:
        - |
          [ "${BM_REDIS_AUTH_ENABLED:-false}" = true ] || unset REDIS_PASSWORD
          exec /redis_exporter
      envFrom:
        - configMapRef:
            name: application-data-access
            optional: true
      env:
        - name: REDIS_ADDR
          value: redis://127.0.0.1:6379
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: application-redis-auth
              key: auth
              optional: true
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: {drop: ["ALL"]}
        readOnlyRootFilesystem: true
      ports:
        - name: metrics
          containerPort: 9121
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {cpu: 100m, memory: 64Mi}
  haproxy:
    enabled: true
    priorityClassName: platform-critical
    image:
      repository: public.ecr.aws/docker/library/haproxy
      tag: "3.4.8-alpine@sha256:8aa6458a9d22a8364a2d2ee9ce93de0cc4a2789e3cf63f0b44adc972863724d7"
    replicas: 3
    hardAntiAffinity: true
    podDisruptionBudget:
      minAvailable: 2
    securityContext:
      runAsNonRoot: true
      runAsUser: 99
      fsGroup: 99
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      readOnlyRootFilesystem: true
    resources:
      requests: {cpu: 25m, memory: 32Mi}
      limits: {cpu: 500m, memory: 128Mi}
    init:
      resources:
        requests: {cpu: 25m, memory: 32Mi}
        limits: {cpu: 250m, memory: 64Mi}

trivy-operator:
  enabled: true
  fullnameOverride: trivy-operator
  # The operator, its Trivy server and its scan jobs can all wait.
  priorityClassName: platform-background
  # "pod" covers standalone pods such as Longhorn's; pods owned by the other
  # kinds are not scanned twice.
  targetWorkloads: "replicaset,statefulset,daemonset,cronjob,pod"
  operator:
    # Completed jobs count against the concurrency limit; delete them as soon
    # as their reports are stored.
    scanJobTTL: ""
    scanSecretTTL: 10m
    # Large GitLab scans are slow. Keep this above trivy.timeout so a scanner
    # timeout is still reported.
    scanJobTimeout: 25m
    scanJobsConcurrentLimit: 2
    scannerReportTTL: 24h
    builtInTrivyServer: true
    # Scans use each application workload's own imagePullSecrets.
    accessGlobalSecretsAndServiceAccount: true
    metricsFindingsEnabled: true
    metricsVulnIdEnabled: true
    metricsExposedSecretInfo: true
    metricsConfigAuditInfo: true
    metricsRbacAssessmentInfo: true
    metricsInfraAssessmentInfo: true
    metricsImageInfo: true
    metricsClusterComplianceInfo: true
  image:
    registry: docker.io
    repository: aquasec/trivy-operator
    tag: "0.36.1@sha256:05191a514247ae644dd5cc71306a94f44faff0a6a3fa817235911b911ecebcb9"
    pullPolicy: IfNotPresent
    pullSecrets: []
  service:
    headless: false
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: /metrics
    prometheus.io/port: "8080"
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  resources:
    # Report caching and detailed metrics hit a 512Mi limit (health-check
    # timeouts, stale reports). CPU peaked at 0.06 core over 6 h on 2026-10-05.
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      cpu: "1"
      memory: 1Gi
  trivyOperator:
    scanJobPodPriorityClassName: platform-background
    scanJobPodTemplatePodSecurityContext:
      runAsNonRoot: true
      runAsUser: 65534
      runAsGroup: 65534
      fsGroup: 65534
      seccompProfile:
        type: RuntimeDefault
    scanJobPodTemplateContainerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
      privileged: false
      readOnlyRootFilesystem: true
    reportRecordFailedChecksOnly: true
    reportResourceLabels: app
  trivy:
    priorityClassName: platform-background
    image:
      registry: docker.io
      repository: aquasec/trivy
      tag: "0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb"
      pullPolicy: IfNotPresent
    additionalVulnerabilityReportFields: Description,Links,CVSS,Target,Class,PackagePath,PackageType
    offlineScan: true
    slow: true
    timeout: 20m
    storageClassEnabled: true
    storageClassName: longhorn
    storageSize: 5Gi
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: "1"
        memory: 512Mi
    server:
      podSecurityContext:
        runAsUser: 65534
        runAsNonRoot: true
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
        runAsGroup: 65534
      securityContext:
        privileged: false
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 100m
          memory: 384Mi
        limits:
          cpu: "1"
          memory: 1Gi
  compliance:
    reportType: all
    cron: "0 */6 * * *"
    specs:
      - k8s-cis-1.23
      - k8s-nsa-1.0
      - k8s-pss-baseline-0.1
      - k8s-pss-restricted-0.1
  policiesBundle:
    registry: docker.io
    repository: aquasec/trivy-checks
    tag: "2.3.0@sha256:2a540ca498daa278b14a77e8e5cd02594d16d131e5032afa65c279d0005826f2"
  nodeCollector:
    registry: ghcr.io
    repository: aquasecurity/node-collector
    tag: "0.3.1@sha256:1a71cf109dc167af84c636fd07c0526ef601ed9f67234115d6ae52b5c013866a"
  extraEnv:
  - name: OPERATOR_POLICY_DATA_DIRS
    value: /etc/trivy-policy-data
  volumes:
  - name: cache-policies
    emptyDir: {}
  - name: policy-data
    configMap:
      name: trivy-policy-data
  volumeMounts:
  - name: cache-policies
    mountPath: /tmp
  - name: policy-data
    mountPath: /etc/trivy-policy-data
    readOnly: true

# Enable only after the shared cache authentication migration is prepared.
applicationData:
  enabled: false
  kafkaBrokers: []
