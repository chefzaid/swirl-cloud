publicDomain: ""
internalDnsZone: ""
gitopsRepositoryURL: ""
cloudflareAccessTeamName: ""
# The installer supplies these values and records them in its Argo Application.
# Empty optional values derive from the public domain's first label.
organizationName: ""
organizationSlug: ""
gitlabGroupPath: ""
gitlabGroupName: ""
gitlabProjectName: swirl-cloud
keycloakRealm: ""
tlsSecretName: ""
sonarAlmSetting: ""
cloudflareAccessIdpName: ""
# Kafka cluster ID; empty keeps the ID that installations formatted with before it was recorded.
kafkaClusterId: ""
# Controls centrally managed corporate workloads; the apps foundation is always included.
appsEnabled: false
deschedulerEnabled: true
highAvailabilityEnabled: false
nodeFencing:
  enabled: false
  inventorySecret: node-fencing-inventory
  nodeNames: []

# Application cache and rate-limit state; durable jobs live in PostgreSQL.
# Replication is asynchronous, so a failover can lose recent writes. Three
# voters and min-replicas-to-write stop an isolated primary from carrying on.
redis-ha:
  fullnameOverride: shared-redis-ha
  image:
    repository: docker.io/library/redis
    tag: 8.10.2-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
  replicas: 3
  hardAntiAffinity: true
  persistentVolume:
    enabled: true
    storageClass: longhorn
    size: 1Gi
  podDisruptionBudget:
    minAvailable: 2
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    readOnlyRootFilesystem: true
  redis:
    config:
      min-replicas-to-write: 1
      min-replicas-max-lag: 5
      maxmemory: 192mb
      maxmemory-policy: noeviction
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: "1", memory: 384Mi}
  sentinel:
    quorum: 2
    resources:
      requests: {cpu: 25m, memory: 32Mi}
      limits: {cpu: 250m, memory: 64Mi}
  init:
    resources:
      requests: {cpu: 25m, memory: 32Mi}
      limits: {cpu: 250m, memory: 64Mi}
  splitBrainDetection:
    resources:
      requests: {cpu: 25m, memory: 32Mi}
      limits: {cpu: 250m, memory: 64Mi}
  # Not the chart's exporter: its scrape annotations would also match the
  # annotated-pod job once per container. Matches datastores/redis.yaml.
  extraContainers:
    - name: redis-exporter
      image: quay.io/oliver006/redis_exporter:v1.92.1-alpine@sha256:f6f0528b12a26d2f89d73d74dd323005022142c7f7bde939f7bbba9adde48fce
      command: ["sh", "-ec"]
      args:
        - |
          [ "${BM_REDIS_AUTH_ENABLED:-false}" = true ] || unset REDIS_PASSWORD
          exec /redis_exporter
      envFrom:
        - configMapRef:
            name: application-data-access
            optional: true
      env:
        - name: REDIS_ADDR
          value: redis://127.0.0.1:6379
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: application-redis-auth
              key: auth
              optional: true
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: {drop: ["ALL"]}
        readOnlyRootFilesystem: true
      ports:
        - name: metrics
          containerPort: 9121
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {cpu: 100m, memory: 64Mi}
  haproxy:
    enabled: true
    image:
      repository: public.ecr.aws/docker/library/haproxy
      tag: "3.3.10-alpine@sha256:29c775f541ba6364ac95de998a8d3d16eb4882470c4fd7bbe8de8315edfdd883"
    replicas: 3
    hardAntiAffinity: true
    podDisruptionBudget:
      minAvailable: 2
    securityContext:
      runAsNonRoot: true
      runAsUser: 99
      fsGroup: 99
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      readOnlyRootFilesystem: true
    resources:
      requests: {cpu: 25m, memory: 32Mi}
      limits: {cpu: 500m, memory: 128Mi}
    init:
      resources:
        requests: {cpu: 25m, memory: 32Mi}
        limits: {cpu: 250m, memory: 64Mi}

trivy-operator:
  enabled: true
  fullnameOverride: trivy-operator
  # "pod" covers standalone pods such as Longhorn's; pods owned by the other
  # kinds are not scanned twice.
  targetWorkloads: "replicaset,statefulset,daemonset,cronjob,pod"
  operator:
    # Completed jobs count against the concurrency limit; delete them as soon
    # as their reports are stored.
    scanJobTTL: ""
    scanSecretTTL: 10m
    # Large GitLab scans are slow. Keep this above trivy.timeout so a scanner
    # timeout is still reported.
    scanJobTimeout: 25m
    scanJobsConcurrentLimit: 2
    scannerReportTTL: 24h
    builtInTrivyServer: true
    # Scans use each application workload's own imagePullSecrets.
    accessGlobalSecretsAndServiceAccount: true
    metricsFindingsEnabled: true
    metricsVulnIdEnabled: true
    metricsExposedSecretInfo: true
    metricsConfigAuditInfo: true
    metricsRbacAssessmentInfo: true
    metricsInfraAssessmentInfo: true
    metricsImageInfo: true
    metricsClusterComplianceInfo: true
  image:
    registry: docker.io
    repository: aquasec/trivy-operator
    tag: "0.34.0@sha256:8123bd89b5f089cb5148123bb2b7a23f4d3cee305dd59132616f73776ef8bc9a"
    pullPolicy: IfNotPresent
    pullSecrets: []
  service:
    headless: false
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: /metrics
    prometheus.io/port: "8080"
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  resources:
    # Report caching and detailed metrics hit a 512Mi limit (health-check
    # timeouts, stale reports). CPU peaked at 0.06 core over 6 h on 2026-10-05.
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      cpu: "1"
      memory: 1Gi
  trivyOperator:
    scanJobPodTemplatePodSecurityContext:
      runAsNonRoot: true
      runAsUser: 65534
      runAsGroup: 65534
      fsGroup: 65534
      seccompProfile:
        type: RuntimeDefault
    scanJobPodTemplateContainerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
      privileged: false
      readOnlyRootFilesystem: true
    reportRecordFailedChecksOnly: true
    reportResourceLabels: app
  trivy:
    image:
      registry: docker.io
      repository: aquasec/trivy
      tag: "0.74.0@sha256:ee940acbf1f58ebadb42d01434ce4609530bf1b52536afbd1eee66cd7123c5c9"
      pullPolicy: IfNotPresent
    additionalVulnerabilityReportFields: Description,Links,CVSS,Target,Class,PackagePath,PackageType
    offlineScan: true
    slow: true
    timeout: 20m
    storageClassEnabled: true
    storageClassName: longhorn
    storageSize: 5Gi
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: "1"
        memory: 512Mi
    server:
      podSecurityContext:
        runAsUser: 65534
        runAsNonRoot: true
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
        runAsGroup: 65534
      securityContext:
        privileged: false
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 100m
          memory: 384Mi
        limits:
          cpu: "1"
          memory: 1Gi
  compliance:
    reportType: all
    cron: "0 */6 * * *"
    specs:
      - k8s-cis-1.23
      - k8s-nsa-1.0
      - k8s-pss-baseline-0.1
      - k8s-pss-restricted-0.1
  policiesBundle:
    registry: docker.io
    repository: aquasec/trivy-checks
    tag: "2.2.0@sha256:b4a7e239039f2ed756c2e88f2d2f95f80658aed99545e637db3ce6133051fb87"
  nodeCollector:
    registry: ghcr.io
    repository: aquasecurity/node-collector
    tag: "0.3.1@sha256:1a71cf109dc167af84c636fd07c0526ef601ed9f67234115d6ae52b5c013866a"
  extraEnv:
  - name: OPERATOR_POLICY_DATA_DIRS
    value: /etc/trivy-policy-data
  volumes:
  - name: cache-policies
    emptyDir: {}
  - name: policy-data
    configMap:
      name: trivy-policy-data
  volumeMounts:
  - name: cache-policies
    mountPath: /tmp
  - name: policy-data
    mountPath: /etc/trivy-policy-data
    readOnly: true

# Enable only after the shared cache authentication migration is prepared.
applicationData:
  enabled: false
  kafkaBrokers: []
