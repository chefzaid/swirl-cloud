          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 11,
          "type": "table",
          "title": "Storage running out",
          "description": "Filesystems and volumes whose free space shrank over the last six hours, with days left at that rate. Empty when nothing is shrinking.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 9,
            "w": 24,
            "x": 0,
            "y": 20
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sort(label_join(swirl_cloud_capacity:filesystem_days_until_full, \"storage\", \" \", \"instance\", \"mountpoint\") or label_join(swirl_cloud_capacity:volume_days_until_full, \"storage\", \"/\", \"namespace\", \"persistentvolumeclaim\"))",
              "format": "table",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "filterable": true
              },
              "unit": "none",
              "decimals": 1
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Days until full"
                },
                "properties": [
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "red",
                          "value": null
                        },
                        {
                          "color": "orange",
                          "value": 7
                        },
                        {
                          "color": "green",
                          "value": 30
                        }
                      ]
                    }
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "showHeader": true,
            "cellHeight": "sm",
            "footer": {
              "show": false
            }
          },
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "instance": true,
                  "mountpoint": true,
                  "namespace": true,
                  "persistentvolumeclaim": true,
                  "job": true,
                  "node": true,
                  "device": true,
                  "fstype": true
                },
                "renameByName": {
                  "storage": "Storage",
                  "Value": "Days until full"
                }
              }
            }
          ]
        }
      ]
    }

