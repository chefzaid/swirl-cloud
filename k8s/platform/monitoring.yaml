apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: monitoring-alert-credentials
  namespace: infra
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: monitoring-alert-credentials
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: infra/monitoring
        property: gitlab_alert_token

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: infra

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/metrics
      - nodes/proxy
      - services
      - endpoints
      - pods
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: infra

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  namespace: infra

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-state-metrics
rules:
  - apiGroups: [""]
    resources:
      - configmaps
      - endpoints
      - limitranges
      - namespaces
      - nodes
      - persistentvolumeclaims
      - persistentvolumes
      - pods
      - replicationcontrollers
      - resourcequotas
      - secrets
      - services
    verbs: ["list", "watch"]
  - apiGroups: ["apps"]
    resources: ["daemonsets", "deployments", "replicasets", "statefulsets"]
    verbs: ["list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["list", "watch"]
  - apiGroups: ["batch"]
    resources: ["cronjobs", "jobs"]
    verbs: ["list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingressclasses", "ingresses", "networkpolicies"]
    verbs: ["list", "watch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "volumeattachments"]
    verbs: ["list", "watch"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources:
      - mutatingadmissionpolicies
      - mutatingadmissionpolicybindings
      - mutatingwebhookconfigurations
      - validatingadmissionpolicies
      - validatingadmissionpolicybindings
      - validatingwebhookconfigurations
    verbs: ["list", "watch"]
  - apiGroups: ["certificates.k8s.io"]
    resources: ["certificatesigningrequests"]
    verbs: ["list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-state-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-state-metrics
subjects:
  - kind: ServiceAccount
    name: kube-state-metrics
    namespace: infra

---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  namespace: infra
  labels:
    app: kube-state-metrics
spec:
  selector:
    app: kube-state-metrics
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
    - name: telemetry
      port: 8081
      targetPort: telemetry

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: infra
  labels:
    app: kube-state-metrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kube-state-metrics
  template:
    metadata:
      labels:
        app: kube-state-metrics
    spec:
      serviceAccountName: kube-state-metrics
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.20.0@sha256:42cfe3723a5f058171c627537fb57a3ea0f26e4380fa18555a95cb1a1b4cfc5b
          args:
            - --metric-labels-allowlist=namespaces=[swirl-cloud.io/application-workloads],pods=[app]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: metrics
              containerPort: 8080
            - name: telemetry
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: telemetry
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi

---
apiVersion: v1
kind: Service
metadata:
  name: node-exporter
  namespace: host-agents
  labels:
    app: node-exporter
spec:
  clusterIP: None
  selector:
    app: node-exporter
  ports:
    - name: metrics
      port: 9100
      targetPort: metrics

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  namespace: host-agents
  labels:
    app: node-exporter
spec:
  selector:
    matchLabels:
      app: node-exporter
  template:
    metadata:
      labels:
        app: node-exporter
    spec:
      automountServiceAccountToken: false
      hostNetwork: true
      hostPID: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      tolerations:
        - operator: Exists
      containers:
        - name: node-exporter
          image: quay.io/prometheus/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          args:
            - --path.rootfs=/host
            - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/kubelet/pods/.+|var/lib/containerd/.+)($|/)
            - --collector.textfile.directory=/host/var/lib/node_exporter/textfile_collector
          ports:
            - name: metrics
              containerPort: 9100
          readinessProbe:
            tcpSocket:
              port: metrics
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: metrics
            periodSeconds: 30
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: root
              mountPath: /host
              readOnly: true
              mountPropagation: HostToContainer
      volumes:
        - name: root
          hostPath:
            path: /

---
# Cluster health and node statistics through a monitor-only Elasticsearch user.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch-exporter
  namespace: infra
  labels:
    app: elasticsearch-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: elasticsearch-exporter
  template:
    metadata:
      labels:
        app: elasticsearch-exporter
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: elasticsearch-exporter
          image: quay.io/prometheuscommunity/elasticsearch-exporter:v1.11.0@sha256:a056739b095df4baaa076f0b31321394233da9a240eeada2623d1b028b7ee7a6
          args:
            - --es.uri=http://elasticsearch.__INTERNAL_DNS_ZONE__:9200
            - --es.timeout=10s
          envFrom:
            - secretRef:
                name: elasticsearch-exporter-credentials
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: metrics
              containerPort: 9114
          readinessProbe:
            tcpSocket:
              port: metrics
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi

---
# Kafka's headless Service resolves to every broker in single-node and HA
# topologies; the private listener admits infra clients (see application-data).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-exporter
  namespace: infra
  labels:
    app: kafka-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-exporter
  template:
    metadata:
      labels:
        app: kafka-exporter
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kafka-exporter
          image: docker.io/danielqsj/kafka-exporter:v1.10.0@sha256:346a53c2489a3530790d01f7b96632496d0d58926662f4c35bb65f569db2ab42
          args:
            - --kafka.server=kafka.__INTERNAL_DNS_ZONE__:9092
            - --kafka.version=4.0.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: metrics
              containerPort: 9308
          readinessProbe:
            tcpSocket:
              port: metrics
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi

---
# Longhorn limits its manager API to Longhorn components. Admit Prometheus to
# the manager port only, which also serves /metrics.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: longhorn-manager-metrics
  namespace: longhorn-system
spec:
  podSelector:
    matchLabels:
      app: longhorn-manager
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: infra
          podSelector:
            matchLabels:
              app: prometheus
      ports:
        - protocol: TCP
          port: 9500

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: infra
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/rules.yaml

    alerting:
      alertmanagers:
        - static_configs:
            - targets: ["alertmanager.__INTERNAL_DNS_ZONE__:9093"]

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

      - job_name: kube-state-metrics
        static_configs:
          - targets: ["kube-state-metrics.__INTERNAL_DNS_ZONE__:8080"]

      - job_name: node-exporter
        kubernetes_sd_configs:
          - role: endpoints
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
            action: keep
            regex: host-agents;node-exporter;metrics
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node

      - job_name: kubernetes-nodes
        scheme: https
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - target_label: __address__
            replacement: kubernetes.default.svc.cluster.local:443
          - source_labels: [__meta_kubernetes_node_name]
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node

      - job_name: kubernetes-cadvisor
        scheme: https
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - target_label: __address__
            replacement: kubernetes.default.svc.cluster.local:443
          - source_labels: [__meta_kubernetes_node_name]
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node

      # Separately installed platform releases are selected by their chart
      # labels and named metrics ports; their charts need no annotations.
      - job_name: traefik
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [infra]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name, __meta_kubernetes_pod_container_port_name]
            action: keep
            regex: traefik;metrics
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node

      # Listener telemetry permits unauthenticated reads, so standbys report too.
      - job_name: vault
        metrics_path: /v1/sys/metrics
        params:
          format: [prometheus]
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [infra]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name, __meta_kubernetes_pod_label_component, __meta_kubernetes_pod_container_port_name]
            action: keep
            regex: vault;server;http
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node

      - job_name: argocd
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [infra]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_part_of, __meta_kubernetes_pod_container_port_name]
            action: keep
            regex: argocd;metrics
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            target_label: component
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node

      # The manager API port also serves /metrics; see longhorn-manager-metrics.
      - job_name: longhorn
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [longhorn-system]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app, __meta_kubernetes_pod_container_port_name]
            action: keep
            regex: longhorn-manager;manager
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node

      # Datastore exporters are containers named <datastore>-exporter with a
      # metrics port; CloudNativePG instances serve the same PostgreSQL role.
      # Each target's job is the datastore name.
      - job_name: datastores
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [infra]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_container_name, __meta_kubernetes_pod_container_port_name, __meta_kubernetes_pod_label_cnpg_io_cluster]
            action: keep
            regex: (postgres|mongodb|redis|kafka|elasticsearch)-exporter;metrics;|postgres;metrics;postgres-ha
          - source_labels: [__meta_kubernetes_pod_container_name]
            regex: (postgres|mongodb|redis|kafka|elasticsearch).*
            target_label: job
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node

      - job_name: external-secrets
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [infra]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name, __meta_kubernetes_pod_container_port_name]
            action: keep
            regex: external-secrets;metrics
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

      # Applications opt in from their owning repository with these pod annotations:
      # prometheus.io/scrape=true, prometheus.io/path=/metrics, prometheus.io/port=<port>.
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_container_init]
            action: drop
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scheme]
            action: replace
            target_label: __scheme__
            regex: (https?)
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            target_label: __address__
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app

  rules.yaml: |
    groups:
      - name: swirl-cloud.capacity
        rules:
          - alert: NodeFilesystemSpaceLow
            expr: |
              (
                node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}
                /
                node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"}
              ) < 0.20
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: Filesystem free space is below 20%
              description: '{{ $labels.instance }} mount {{ $labels.mountpoint }} has {{ $value | humanizePercentage }} free.'
          - alert: NodeFilesystemSpaceCritical
            expr: |
              (
                node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}
                /
                node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"}
              ) < 0.10
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: Filesystem free space is below 10%
              description: '{{ $labels.instance }} mount {{ $labels.mountpoint }} is critically low on space.'
          # Backups, image pulls and upgrades need about 30 GiB on the K3s host
          # filesystem; kubelet image GC starts at 85 % used, before evictions.
          - alert: NodeMaintenanceHeadroomLow
            expr: |
              node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs",mountpoint=~"/|/var|/var/lib|/var/lib/rancher.*"}
              < 30 * 1024 * 1024 * 1024
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: Less than 30 GiB free for maintenance
              description: '{{ $labels.instance }} mount {{ $labels.mountpoint }} has {{ $value | humanize1024 }}B free. Free space before backups, upgrades or image pulls.'
          - alert: NodeFilesystemFillingWithinDay
            expr: |
              predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}[6h], 24 * 3600) < 0
              and node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"} < 0.30
            for: 30m
            labels:
              severity: warning
            annotations:
              summary: Filesystem is predicted to fill within 24 hours
              description: '{{ $labels.instance }} mount {{ $labels.mountpoint }} is consuming its remaining space quickly.'
          - alert: PersistentVolumeSpaceLow
            expr: kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes < 0.20
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: Persistent volume free space is below 20%
              description: '{{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} has {{ $value | humanizePercentage }} free; expand the claim or reduce retention.'
          - alert: PersistentVolumeSpaceCritical
            expr: kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes < 0.10
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: Persistent volume free space is below 10%
              description: '{{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is critically low on space.'
          - alert: PersistentVolumeFillingWithinDay
            expr: |
              predict_linear(kubelet_volume_stats_available_bytes[6h], 24 * 3600) < 0
              and kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes < 0.30
            for: 30m
            labels:
              severity: warning
            annotations:
              summary: Persistent volume is predicted to fill within 24 hours
              description: '{{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is consuming its remaining space quickly.'
      - name: swirl-cloud.kubernetes
        rules:
          - alert: KubernetesDeploymentUnavailable
            expr: kube_deployment_spec_replicas > kube_deployment_status_replicas_available
            for: 10m
            labels:
              severity: critical
            annotations:
              summary: Kubernetes Deployment has unavailable replicas
              description: '{{ $labels.namespace }}/{{ $labels.deployment }} has fewer available replicas than desired.'
          - alert: KubernetesStatefulSetUnavailable
            expr: kube_statefulset_replicas > kube_statefulset_status_replicas_ready
            for: 10m
            labels:
              severity: critical
            annotations:
              summary: Kubernetes StatefulSet has unavailable replicas
              description: '{{ $labels.namespace }}/{{ $labels.statefulset }} has fewer ready replicas than desired.'
          - alert: KubernetesPodCrashLooping
            expr: max_over_time(kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"}[10m]) > 0
            for: 10m
            labels:
              severity: critical
            annotations:
              summary: Pod is crash-looping
              description: '{{ $labels.namespace }}/{{ $labels.pod }} container {{ $labels.container }} is in CrashLoopBackOff.'
          - alert: KubernetesContainerOOMKilled
            expr: increase(kube_pod_container_status_restarts_total[15m]) > 0 and on(namespace, pod, container) kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1
            labels:
              severity: warning
            annotations:
              summary: Container restarted after an OOM kill
              description: '{{ $labels.namespace }}/{{ $labels.pod }} container {{ $labels.container }} exhausted its memory limit.'
          - alert: KubernetesPersistentVolumeReleased
            expr: kube_persistentvolume_status_phase{phase="Released"} == 1
            for: 30m
            labels:
              severity: warning
            annotations:
              summary: Released persistent volume still consumes storage
              description: 'PersistentVolume {{ $labels.persistentvolume }} has remained Released for at least 30 minutes.'
          - alert: KubernetesPersistentVolumeClaimPending
            expr: kube_persistentvolumeclaim_status_phase{phase="Pending"} == 1
            for: 15m
            labels:
              severity: critical
            annotations:
              summary: PersistentVolumeClaim is pending
              description: '{{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} has not bound to storage.'
          # Failed CronJob runs stay in history; ignore those superseded by a later success.
          - alert: KubernetesJobFailed
            expr: |
              kube_job_status_failed > 0
              unless on (namespace, job_name)
              (
                (kube_job_status_start_time * on (namespace, job_name) group_left (owner_name) kube_job_owner{owner_kind="CronJob"})
                < on (namespace, owner_name) group_left ()
                label_replace(kube_cronjob_status_last_successful_time, "owner_name", "$1", "cronjob", "(.+)")
              )
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: Kubernetes Job failed
              description: '{{ $labels.namespace }}/{{ $labels.job_name }} has a failed execution.'
      - name: swirl-cloud.platform
        rules:
          - alert: KubernetesNodeNotReady
            expr: kube_node_status_condition{condition="Ready",status="true"} == 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: Kubernetes node is not Ready
              description: 'Node {{ $labels.node }} has not reported Ready for five minutes.'
          - alert: VaultSealed
            expr: vault_core_unsealed == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: Vault is sealed
              description: 'Vault pod {{ $labels.pod }} is sealed; secrets cannot be read until it is unsealed.'
          # Vault refuses requests once no audit device can record them.
          - alert: VaultAuditDeviceFailing
            expr: increase(vault_audit_log_request_failure[10m]) > 0 or increase(vault_audit_log_response_failure[10m]) > 0
            labels:
              severity: critical
            annotations:
              summary: Vault audit device is failing
              description: 'Vault pod {{ $labels.pod }} failed to write audit entries in the last ten minutes.'
          # Longhorn exports one series per robustness state, set to 1 for the current state.
          - alert: LonghornVolumeDegraded
            expr: longhorn_volume_robustness{state="degraded"} == 1
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: Longhorn volume is degraded
              description: 'Volume {{ $labels.volume }} ({{ $labels.pvc_namespace }}/{{ $labels.pvc }}) is missing healthy replicas or still rebuilding.'
          - alert: LonghornVolumeBackupStale
            # Silent until off-node volume backups are active (the target holds
            # at least one backup); then every volume must stay within 36 hours.
            expr: |
              (time() - longhorn_volume_last_backup_at > 36 * 3600)
              and on() (sum(longhorn_backup_target_backup_volume_count) > 0)
            for: 1h
            labels:
              severity: warning
            annotations:
              summary: Longhorn volume backup is overdue
              description: 'Volume for {{ $labels.pvc }} has no off-node backup from the last 36 hours; check the daily recurring job and the backup target.'
          - alert: LonghornVolumeFaulted
            expr: longhorn_volume_robustness{state="faulted"} == 1
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: Longhorn volume is faulted
              description: 'Volume {{ $labels.volume }} ({{ $labels.pvc_namespace }}/{{ $labels.pvc }}) has no usable replica.'
          - alert: KeycloakPasswordFailuresHigh
            expr: sum by (realm) (increase(keycloak_credentials_password_hashing_validations_total{outcome!="valid"}[15m])) > 20
            labels:
              severity: warning
            annotations:
              summary: Many failed Keycloak password checks
              description: 'Realm {{ $labels.realm }} rejected {{ $value | printf "%.0f" }} passwords in 15 minutes; check for credential guessing against the SSO identity.'
          - alert: ExternalSecretNotReady
            expr: externalsecret_status_condition{condition="Ready",status="False"} == 1
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: ExternalSecret is not Ready
              description: '{{ $labels.namespace }}/{{ $labels.name }} has not synchronized from Vault for 15 minutes; inspect kubectl describe externalsecret.'
          - alert: ElasticsearchUnreachable
            expr: elasticsearch_clusterinfo_up == 0 or absent(elasticsearch_cluster_health_status{color="green"})
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: Elasticsearch is unreachable
              description: 'The exporter cannot read Elasticsearch cluster health; logs and audits are not being indexed.'
          - alert: ElasticsearchClusterRed
            expr: elasticsearch_cluster_health_status{color="red"} == 1
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: Elasticsearch cluster health is red
              description: 'At least one primary shard is unassigned; some logs or audits cannot be written or searched.'
          - alert: ElasticsearchClusterYellow
            expr: elasticsearch_cluster_health_status{color="yellow"} == 1
            for: 30m
            labels:
              severity: warning
            annotations:
              summary: Elasticsearch cluster health is yellow
              description: 'Replica shards are unassigned; on a single node, check for indices that request replicas.'
          - alert: DatastoreDown
            expr: pg_up == 0 or cnpg_collector_up == 0 or mongodb_up == 0 or redis_up == 0 or kafka_brokers < 1
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: Shared datastore is unavailable
              description: '{{ $labels.job }} exporter on {{ $labels.pod }} cannot reach its datastore.'
          - alert: ArgoCDApplicationUnhealthy
            expr: argocd_app_info{health_status=~"Degraded|Missing|Unknown"} == 1
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: Argo CD application is unhealthy
              description: 'Application {{ $labels.name }} has been {{ $labels.health_status }} for fifteen minutes.'
          - alert: ArgoCDApplicationOutOfSync
            expr: argocd_app_info{sync_status="OutOfSync"} == 1
            for: 30m
            labels:
              severity: warning
            annotations:
              summary: Argo CD application is out of sync
              description: 'Application {{ $labels.name }} has not matched its Git revision for thirty minutes.'
          # Traefik is scraped by two jobs; group by certificate identity.
          - alert: TLSCertificateExpiringSoon
            expr: (min by (cn, sans) (traefik_tls_certs_not_after) - time()) < 14 * 86400
            for: 1h
            labels:
              severity: warning
            annotations:
              summary: TLS certificate expires within 14 days
              description: 'Certificate {{ $labels.cn }} for {{ $labels.sans }} expires in {{ $value | humanizeDuration }}.'
          - alert: TLSCertificateExpiryCritical
            expr: (min by (cn, sans) (traefik_tls_certs_not_after) - time()) < 3 * 86400
            for: 10m
            labels:
              severity: critical
            annotations:
              summary: TLS certificate expires within 3 days
              description: 'Certificate {{ $labels.cn }} for {{ $labels.sans }} expires in {{ $value | humanizeDuration }}.'
      - name: swirl-cloud.host-audit
        rules:
          - alert: LynisAuditFailed
            expr: swirl_cloud_lynis_last_run_exit_code != 0
            labels:
              severity: warning
            annotations:
              summary: Managed Lynis audit failed
              description: 'The last Lynis run on {{ $labels.node }} exited with code {{ $value }}; inspect journalctl -u swirl-cloud-lynis.service.'
          - alert: LynisAuditMissing
            expr: time() - swirl_cloud_lynis_last_success_timestamp_seconds > 35 * 86400
            labels:
              severity: warning
            annotations:
              summary: Monthly Lynis audit is overdue
              description: 'No successful Lynis audit on {{ $labels.node }} for more than 35 days; check swirl-cloud-lynis.timer.'
          # Known findings are triaged in docs/security.md; alert only when an
          # image gains critical findings over its own recent maximum, or a new
          # image arrives with some. The 6 h baseline fits the current size-bound
          # retention; widen it with the retention increase in TODO §26.
          - alert: TrivyNewCriticalVulnerability
            expr: |
              max by (exported_namespace, image_repository) (trivy_image_vulnerabilities{severity="Critical"}) > 0
              unless on (exported_namespace, image_repository)
              (
                max by (exported_namespace, image_repository) (trivy_image_vulnerabilities{severity="Critical"})
                <= max_over_time(max by (exported_namespace, image_repository) (trivy_image_vulnerabilities{severity="Critical"})[6h:15m] offset 1h)
              )
            for: 30m
            labels:
              severity: warning
            annotations:
              summary: New critical vulnerabilities in a running image
              description: '{{ $labels.image_repository }} in {{ $labels.exported_namespace }} now has {{ $value }} critical findings. Triage them (docs/security.md#vulnerability-triage) in the Trivy dashboard.'
          - alert: HostIntrusionPreventionDown
            expr: swirl_cloud_intrusion_service_up == 0
            for: 15m
            labels:
              severity: critical
            annotations:
              summary: Host intrusion prevention is not running
              description: '{{ $labels.service }} is inactive on {{ $labels.instance }}; its public SSH has no brute-force protection. Check: sudo systemctl status {{ $labels.service }}.'
          - alert: HostIntrusionMetricsStale
            expr: time() - swirl_cloud_intrusion_metrics_timestamp_seconds > 1800
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: Intrusion-prevention metrics are stale
              description: '{{ $labels.instance }} has not refreshed Fail2ban/CrowdSec metrics for 30 minutes. Check: sudo systemctl status swirl-cloud-intrusion-metrics.timer.'
          - alert: HostBruteForceWave
            expr: |
              sum by (instance) (increase(swirl_cloud_fail2ban_banned_total[1h])) > 50
              or sum by (instance) (swirl_cloud_crowdsec_decisions) > 200
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: Brute-force wave against a host
              description: '{{ $labels.instance }} is banning attackers at an unusual rate ({{ $value | humanize }}). Bans are working; consider key-only SSH on the private interface (TODO §4).'
          - alert: NodeRebootRequired
            expr: swirl_cloud_reboot_required == 1 and time() - swirl_cloud_reboot_required_since_timestamp_seconds > 7 * 86400
            labels:
              severity: warning
            annotations:
              summary: Node reboot has been pending for over a week
              description: 'Installed updates on {{ $labels.node }} have required a reboot for more than seven days; schedule a maintenance window.'
          - alert: HostMaintenanceServiceFailed
            expr: swirl_cloud_systemd_unit_last_run_success == 0
            for: 15m
            labels:
              severity: critical
            annotations:
              summary: Host maintenance service failed
              description: 'The last run of {{ $labels.unit }} on {{ $labels.node }} failed; inspect journalctl -u {{ $labels.unit }}.'
          - alert: K3sRecoveryBackupMissing
            expr: time() - swirl_cloud_systemd_unit_last_success_timestamp_seconds{unit="swirl-cloud-k3s-backup.service"} > 36 * 3600
            labels:
              severity: critical
            annotations:
              summary: Daily K3s recovery backup is overdue
              description: 'No successful swirl-cloud-k3s-backup.service run on {{ $labels.node }} for more than 36 hours; check swirl-cloud-k3s-backup.timer.'
          - alert: VaultUnsealTimerStopped
            expr: time() - swirl_cloud_systemd_unit_last_run_timestamp_seconds{unit="swirl-cloud-vault-unseal.service"} > 15 * 60
            labels:
              severity: warning
            annotations:
              summary: Vault unseal timer is not running
              description: 'swirl-cloud-vault-unseal.service has not run on {{ $labels.node }} for 15 minutes; Vault would stay sealed after a restart.'
      - name: swirl-cloud.ingress
        rules:
          - alert: IngressServiceErrorRateHigh
            expr: |
              sum by (service) (rate(traefik_service_requests_total{code=~"5.."}[10m]))
              / sum by (service) (rate(traefik_service_requests_total[10m])) > 0.05
              and sum by (service) (rate(traefik_service_requests_total[10m])) > 0.05
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: Ingress service is returning server errors
              description: '{{ $labels.service }} has answered more than 5% of requests with 5xx for 15 minutes; see the Ingress Traffic dashboard.'
      - name: swirl-cloud.monitoring
        rules:
          - alert: PrometheusTargetDown
            expr: up == 0
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: Prometheus target is down
              description: '{{ $labels.job }} target {{ $labels.instance }} has been unreachable for ten minutes.'

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: infra
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
    route:
      receiver: gitlab
      group_by: [alertname, namespace]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
    receivers:
      - name: gitlab
        webhook_configs:
          - send_resolved: true
            url: http://gitlab.__INTERNAL_DNS_ZONE__/__GITLAB_GROUP_PATH__/__GITLAB_PROJECT_NAME__/alerts/notify/cluster-prometheus/clusterprometheus.json
            http_config:
              authorization:
                type: Bearer
                credentials_file: /etc/alertmanager/secrets/token

---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: infra
spec:
  selector:
    app: alertmanager
  ports:
    - name: http
      port: 9093
      targetPort: http

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alertmanager
          image: quay.io/prometheus/alertmanager:v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
          ports:
            - name: http
              containerPort: 9093
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager/alertmanager.yml
              subPath: alertmanager.yml
              readOnly: true
            - name: credentials
              mountPath: /etc/alertmanager/secrets
              readOnly: true
            - name: data
              mountPath: /alertmanager
      volumes:
        - name: config
          configMap:
            name: alertmanager-config
        - name: credentials
          secret:
            secretName: monitoring-alert-credentials
            items:
              - key: token
                path: token
        - name: data
          emptyDir:
            sizeLimit: 128Mi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: infra
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn
  resources:
    requests:
      # Keep ample headroom above the 1500 MB TSDB retention limit because
      # WAL and memory-mapped head chunks are not covered by that limit.
      storage: 4Gi

---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: infra
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 9090
      targetPort: http
  selector:
    app: prometheus

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: infra
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
      annotations:
        # subPath mounts never refresh; roll Prometheus when its config changes.
        swirl-cloud.io/prometheus-config: pending
    spec:
      serviceAccountName: prometheus
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: docker.io/prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=15d
            - --storage.tsdb.retention.size=1500MB
            - --web.enable-lifecycle
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
            - name: config
              mountPath: /etc/prometheus/rules.yaml
              subPath: rules.yaml
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-data

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana
  namespace: infra

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: grafana-dashboard-reader
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: grafana-dashboard-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: grafana-dashboard-reader
subjects:
  - kind: ServiceAccount
    name: grafana
    namespace: infra

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: infra
data:
  datasources.yaml: |
    apiVersion: 1
    deleteDatasources:
      - name: Prometheus
        orgId: 1
      - name: Elasticsearch
        orgId: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.__INTERNAL_DNS_ZONE__:9090
        isDefault: true
        editable: false
        jsonData:
          prometheusType: Prometheus
          prometheusVersion: 3.14.0
          timeInterval: 15s
      - name: Elasticsearch
        uid: elasticsearch
        type: elasticsearch
        access: proxy
        url: http://elasticsearch.__INTERNAL_DNS_ZONE__:9200
        database: kubernetes-logs-*
        basicAuth: true
        basicAuthUser: $ELASTICSEARCH_USERNAME
        editable: false
        jsonData:
          timeField: "@timestamp"
          esVersion: 9.4.6
          logMessageField: message
          logLevelField: level
        secureJsonData:
          basicAuthPassword: $ELASTICSEARCH_PASSWORD

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: infra
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: Kubernetes
        orgId: 1
        folder: Kubernetes
        type: file
        disableDeletion: false
        allowUiUpdates: false
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards/kubernetes
      - name: Applications
        orgId: 1
        folder: Applications
        type: file
        disableDeletion: false
        allowUiUpdates: false
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards/applications
      - name: Discovered applications
        orgId: 1
        folder: Applications
        type: file
        # Keep historical dashboards when a workload is removed or Grafana restarts.
        disableDeletion: true
        allowUiUpdates: false
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards/discovered-applications

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-kubernetes-dashboard
  namespace: infra
data:
  kubernetes-overview.json: |
    {
      "uid": "kubernetes-overview",
      "title": "Kubernetes Cluster Overview",
      "tags": ["kubernetes", "cluster", "provisioned"],
      "timezone": "browser",
      "schemaVersion": 41,
      "version": 1,
      "refresh": "30s",
      "time": {"from": "now-6h", "to": "now"},
      "templating": {
        "list": [
          {
            "name": "namespace",
            "label": "Namespace",
            "type": "query",
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "query": {"query": "label_values(kube_namespace_created, namespace)", "refId": "PrometheusVariableQueryEditor-VariableQuery"},
            "includeAll": true,
            "allValue": ".*",
            "multi": true,
            "refresh": 1,
            "current": {"text": "All", "value": ["$__all"]}
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Nodes",
          "gridPos": {"x": 0, "y": 0, "w": 4, "h": 4},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "count(kube_node_info)", "instant": true}],
          "fieldConfig": {"defaults": {"unit": "short", "thresholds": {"mode": "absolute", "steps": [{"color": "red"}, {"color": "green", "value": 1}]}}, "overrides": []},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "values": false}, "colorMode": "value", "graphMode": "none"}
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Running Pods",
          "gridPos": {"x": 4, "y": 0, "w": 4, "h": 4},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "sum(kube_pod_status_phase{namespace=~\"$namespace\",phase=\"Running\"})", "instant": true}],
          "fieldConfig": {"defaults": {"unit": "short", "color": {"mode": "fixed", "fixedColor": "green"}}, "overrides": []},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "values": false}, "colorMode": "value", "graphMode": "none"}
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Unhealthy Pods",
          "gridPos": {"x": 8, "y": 0, "w": 4, "h": 4},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "sum(kube_pod_status_phase{namespace=~\"$namespace\",phase=~\"Pending|Failed|Unknown\"})", "instant": true}],
          "fieldConfig": {"defaults": {"unit": "short", "thresholds": {"mode": "absolute", "steps": [{"color": "green"}, {"color": "red", "value": 1}]}}, "overrides": []},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "values": false}, "colorMode": "value", "graphMode": "none"}
        },
        {
          "id": 4,
          "type": "stat",
          "title": "CPU Used",
          "gridPos": {"x": 12, "y": 0, "w": 4, "h": 4},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "100 * sum(rate(container_cpu_usage_seconds_total{container!=\"\",image!=\"\"}[5m])) / sum(machine_cpu_cores)", "instant": true}],
          "fieldConfig": {"defaults": {"unit": "percent", "min": 0, "max": 100}, "overrides": []},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "values": false}, "colorMode": "value", "graphMode": "area"}
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Memory Used",
          "gridPos": {"x": 16, "y": 0, "w": 4, "h": 4},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "100 * sum(container_memory_working_set_bytes{container!=\"\",image!=\"\"}) / sum(machine_memory_bytes)", "instant": true}],
          "fieldConfig": {"defaults": {"unit": "percent", "min": 0, "max": 100}, "overrides": []},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "values": false}, "colorMode": "value", "graphMode": "area"}
        },
        {
          "id": 6,
          "type": "stat",
          "title": "Restarts (1h)",
          "gridPos": {"x": 20, "y": 0, "w": 4, "h": 4},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=~\"$namespace\"}[1h]))", "instant": true}],
          "fieldConfig": {"defaults": {"unit": "short", "thresholds": {"mode": "absolute", "steps": [{"color": "green"}, {"color": "orange", "value": 1}, {"color": "red", "value": 5}]}}, "overrides": []},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "values": false}, "colorMode": "value", "graphMode": "none"}
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "CPU Usage by Namespace",
          "gridPos": {"x": 0, "y": 4, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "sum by (namespace) (rate(container_cpu_usage_seconds_total{namespace=~\"$namespace\",container!=\"\",image!=\"\"}[5m]))", "legendFormat": "{{namespace}}"}],
          "fieldConfig": {"defaults": {"unit": "cores"}, "overrides": []},
          "options": {"legend": {"displayMode": "table", "placement": "bottom"}}
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Memory Usage by Namespace",
          "gridPos": {"x": 12, "y": 4, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "sum by (namespace) (container_memory_working_set_bytes{namespace=~\"$namespace\",container!=\"\",image!=\"\"})", "legendFormat": "{{namespace}}"}],
          "fieldConfig": {"defaults": {"unit": "bytes"}, "overrides": []},
          "options": {"legend": {"displayMode": "table", "placement": "bottom"}}
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Node CPU Utilization",
          "gridPos": {"x": 0, "y": 12, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "100 - (avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)", "legendFormat": "{{instance}}"}],
          "fieldConfig": {"defaults": {"unit": "percent", "min": 0, "max": 100}, "overrides": []},
          "options": {"legend": {"displayMode": "table", "placement": "bottom"}}
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Node Memory Utilization",
          "gridPos": {"x": 12, "y": 12, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)", "legendFormat": "{{instance}}"}],
          "fieldConfig": {"defaults": {"unit": "percent", "min": 0, "max": 100}, "overrides": []},
          "options": {"legend": {"displayMode": "table", "placement": "bottom"}}
        },
        {
          "id": 11,
          "type": "table",
          "title": "Deployment Availability",
          "gridPos": {"x": 0, "y": 20, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {"refId": "A", "expr": "kube_deployment_status_replicas_available{namespace=~\"$namespace\"}", "legendFormat": "{{namespace}} / {{deployment}}", "instant": true, "format": "table"}
          ],
          "options": {"showHeader": true}
        },
        {
          "id": 12,
          "type": "table",
          "title": "Persistent Volume Claims",
          "gridPos": {"x": 12, "y": 20, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "kube_persistentvolumeclaim_status_phase{namespace=~\"$namespace\",phase=\"Bound\"} == 1", "legendFormat": "{{namespace}} / {{persistentvolumeclaim}}", "instant": true, "format": "table"}],
          "options": {"showHeader": true}
        }
      ]
    }

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: infra
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi

---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: infra
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3000
      targetPort: http
  selector:
    app: grafana

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: infra
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
      annotations:
        swirl-cloud.io/application-observability: pending
    spec:
      serviceAccountName: grafana
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
        runAsUser: 10001
        runAsGroup: 10001
      initContainers:
        # File providers stop initializing when a sidecar's directory is absent.
        - name: prepare-dashboard-directories
          image: docker.io/library/node:24.21.0-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
          command:
            - node
            - -e
            - "const fs=require('node:fs'); for(const directory of ['applications','discovered-applications']) fs.mkdirSync('/var/lib/grafana/dashboards/'+directory,{recursive:true});"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: dashboard-files
              mountPath: /var/lib/grafana/dashboards
      containers:
        - name: grafana
          image: docker.io/grafana/grafana:13.2.2-distroless@sha256:69a5d2d957ca0bba434c160dcd4f2d07de9d6c756a0ba10ae7f52b72ced1e4cc
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin-secret
                  key: GF_SECURITY_ADMIN_PASSWORD
            - name: GF_SERVER_ROOT_URL
              value: https://grafana.__PUBLIC_DOMAIN__
            - name: GF_AUTH_BASIC_ENABLED
              value: "false"
            - name: GF_AUTH_GENERIC_OAUTH_ENABLED
              value: "true"
            - name: GF_AUTH_GENERIC_OAUTH_NAME
              value: Keycloak
            - name: GF_AUTH_GENERIC_OAUTH_AUTO_LOGIN
              value: "true"
            - name: GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP
              value: "true"
            - name: GF_AUTH_GENERIC_OAUTH_CLIENT_ID
              value: grafana
            - name: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-sso-credentials
                  key: GRAFANA_CLIENT_SECRET
            - name: GF_AUTH_GENERIC_OAUTH_SCOPES
              value: openid profile email groups
            - name: GF_AUTH_GENERIC_OAUTH_AUTH_URL
              value: https://keycloak.__PUBLIC_DOMAIN__/auth/realms/__KEYCLOAK_REALM__/protocol/openid-connect/auth
            - name: GF_AUTH_GENERIC_OAUTH_TOKEN_URL
              value: https://keycloak.__PUBLIC_DOMAIN__/auth/realms/__KEYCLOAK_REALM__/protocol/openid-connect/token
            - name: GF_AUTH_GENERIC_OAUTH_API_URL
              value: https://keycloak.__PUBLIC_DOMAIN__/auth/realms/__KEYCLOAK_REALM__/protocol/openid-connect/userinfo
            - name: GF_AUTH_GENERIC_OAUTH_USE_PKCE
              value: "true"
            - name: GF_AUTH_GENERIC_OAUTH_USE_REFRESH_TOKEN
              value: "true"
            - name: GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH
              value: "contains(groups[*], 'platform-admins') && 'GrafanaAdmin' || 'Viewer'"
            - name: GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN
              value: "true"
            - name: GF_AUTH_SIGNOUT_REDIRECT_URL
              value: https://keycloak.__PUBLIC_DOMAIN__/auth/realms/__KEYCLOAK_REALM__/protocol/openid-connect/logout?post_logout_redirect_uri=https%3A%2F%2Fgrafana.__PUBLIC_DOMAIN__%2F
            - name: ELASTICSEARCH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: grafana-elasticsearch-credentials
                  key: ELASTICSEARCH_USERNAME
            - name: ELASTICSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-elasticsearch-credentials
                  key: ELASTICSEARCH_PASSWORD
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: "1"
              memory: 768Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources/datasources.yaml
              subPath: datasources.yaml
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml
              subPath: dashboards.yaml
            - name: dashboard-files
              mountPath: /var/lib/grafana/dashboards
            - name: kubernetes-dashboard
              mountPath: /var/lib/grafana/dashboards/kubernetes
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: grafana-logs
              mountPath: /var/log/grafana
        - name: application-discovery
          image: docker.io/library/node:24.21.0-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
          command: [node, /application-discovery/discovery.mjs]
          env:
            - name: DISCOVERY_INTERVAL_SECONDS
              value: "60"
            - name: DASHBOARD_DIRECTORY
              value: /var/lib/grafana/dashboards/discovered-applications
            - name: KIBANA_URL
              value: http://kibana.__INTERNAL_DNS_ZONE__:5601
            - name: KIBANA_PUBLIC_URL
              value: https://kibana.__PUBLIC_DOMAIN__
          envFrom:
            - secretRef:
                name: kibana-bootstrap-credentials
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi
          volumeMounts:
            - name: application-discovery
              mountPath: /application-discovery
              readOnly: true
            - name: dashboard-files
              mountPath: /var/lib/grafana/dashboards
        - name: dashboard-sidecar
          image: ghcr.io/kiwigrid/k8s-sidecar:2.11.2@sha256:2912be006f62f9ea080194cf6d3afcd90daead8d101d0ba686a137a849f6a4f6
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          env:
            - name: METHOD
              value: WATCH
            - name: LABEL
              value: grafana_dashboard
            - name: LABEL_VALUE
              value: "1"
            - name: NAMESPACE
              value: ALL
            - name: RESOURCE
              value: configmap
            - name: FOLDER
              value: /var/lib/grafana/dashboards/applications
            - name: UNIQUE_FILENAMES
              value: "true"
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: dashboard-files
              mountPath: /var/lib/grafana/dashboards
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: grafana-data
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboard-files
          emptyDir: {}
        - name: application-discovery
          configMap:
            name: application-observability-discovery
        - name: kubernetes-dashboard
          configMap:
            name: grafana-kubernetes-dashboard
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: grafana-logs
          emptyDir:
            sizeLimit: 256Mi

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-ingress-traffic-dashboard
  namespace: infra
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: swirl-cloud
data:
  ingress-traffic.json: |
    {
      "uid": "ingress-traffic",
      "title": "Ingress Traffic",
      "description": "Traefik request rate, server-error ratio and latency per backend service.",
      "tags": [
        "traefik",
        "ingress",
        "provisioned"
      ],
      "timezone": "browser",
      "schemaVersion": 41,
      "version": 1,
      "refresh": "1m",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Requests per second by service",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "topk(10, sum by (service) (rate(traefik_service_requests_total[5m])))",
              "legendFormat": "{{service}}"
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "5xx ratio by service",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (service) (rate(traefik_service_requests_total{code=~\"5..\"}[5m])) / sum by (service) (rate(traefik_service_requests_total[5m]))",
              "legendFormat": "{{service}}"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "p95 latency by service",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "topk(10, histogram_quantile(0.95, sum by (service, le) (rate(traefik_service_request_duration_seconds_bucket[5m]))))",
              "legendFormat": "{{service}}"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Entrypoint responses by status class",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (entrypoint, code_class) (label_replace(rate(traefik_entrypoint_requests_total[5m]), \"code_class\", \"${1}xx\", \"code\", \"([0-9]).*\"))",
              "legendFormat": "{{entrypoint}} {{code_class}}"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Open connections by entrypoint",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 16,
            "w": 24,
            "h": 6
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (entrypoint) (traefik_open_connections)",
              "legendFormat": "{{entrypoint}}"
            }
          ]
        }
      ]
    }
