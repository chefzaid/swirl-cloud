                }
              }
            }
          ]
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Availability over time",
          "datasource": {
            "type": "elasticsearch",
            "uid": "platform-reports"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 28
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "elasticsearch",
                "uid": "platform-reports"
              },
              "query": "kind:availability",
              "metrics": [
                {
                  "id": "1",
                  "type": "avg",
                  "field": "ratio"
                }
              ],
              "bucketAggs": [
                {
                  "id": "2",
                  "type": "date_histogram",
                  "field": "@timestamp",
                  "settings": {
                    "interval": "auto",
                    "min_doc_count": "0",
                    "trimEdges": "0"
                  }
                }
              ],
              "timeField": "@timestamp"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 3,
              "max": 1,
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 10
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "hidden",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "single"
            }
          }
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "CPU allocated by namespace",
          "description": "Cores charged (larger of requests and usage), averaged per interval.",
          "datasource": {
            "type": "elasticsearch",
            "uid": "platform-reports"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 28
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "elasticsearch",
                "uid": "platform-reports"
              },
              "query": "kind:usage",
              "metrics": [
                {
                  "id": "1",
                  "type": "avg",
                  "field": "cpu_cores"
                }
              ],
              "bucketAggs": [
                {
                  "id": "3",
                  "type": "terms",
                  "field": "namespace",
                  "settings": {
                    "min_doc_count": "1",
                    "size": "10",
                    "order": "desc",
                    "orderBy": "1"
                  }
                },
                {
                  "id": "2",
                  "type": "date_histogram",
                  "field": "@timestamp",
                  "settings": {
                    "interval": "auto",
                    "min_doc_count": "0",
                    "trimEdges": "0"
                  }
                }
              ],
              "timeField": "@timestamp"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 2,
              "min": 0,
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 20,
                "stacking": {
                  "mode": "normal",
                  "group": "A"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "Vulnerabilities past deadline",
          "description": "Open Critical (15 days) and High (30 days) image x vulnerability pairs older than their deadline; ./install.sh --vulnerability-report lists them.",
          "datasource": {
            "type": "elasticsearch",
            "uid": "platform-reports"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 36
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "elasticsearch",
                "uid": "platform-reports"
              },
              "query": "kind:vulnerabilities",
              "metrics": [
                {
                  "id": "1",
                  "type": "max",
                  "field": "past_deadline"
                }
              ],
              "bucketAggs": [
                {
                  "id": "3",
                  "type": "terms",
                  "field": "severity",
                  "settings": {
                    "min_doc_count": "1",
                    "size": "10",
                    "order": "asc",
                    "orderBy": "_term"
                  }
                },
                {
                  "id": "2",
                  "type": "date_histogram",
                  "field": "@timestamp",
                  "settings": {
                    "interval": "auto",
                    "min_doc_count": "0",
                    "trimEdges": "0"
                  }
                }
              ],
              "timeField": "@timestamp"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "min": 0,
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 10
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 12,
          "type": "timeseries",
          "title": "Open Critical and High vulnerabilities",
          "datasource": {
            "type": "elasticsearch",
            "uid": "platform-reports"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 36
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "elasticsearch",
                "uid": "platform-reports"
              },
              "query": "kind:vulnerabilities",
              "metrics": [
                {
                  "id": "1",
                  "type": "max",
                  "field": "open"
                }
              ],
              "bucketAggs": [
                {
                  "id": "3",
                  "type": "terms",
                  "field": "severity",
                  "settings": {
                    "min_doc_count": "1",
                    "size": "10",
                    "order": "asc",
                    "orderBy": "_term"
                  }
                },
                {
                  "id": "2",
                  "type": "date_histogram",
                  "field": "@timestamp",
                  "settings": {
                    "interval": "auto",
                    "min_doc_count": "0",
                    "trimEdges": "0"
                  }
                }
              ],
              "timeField": "@timestamp"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "min": 0,
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 10
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 13,
          "type": "table",
          "title": "Service indicators",
          "description": "Average over the period of hourly values: data store availability, CI queue time (p90, seconds), CI failures caused by the platform and Argo CD sync failures.",
          "datasource": {
            "type": "elasticsearch",
            "uid": "platform-reports"
          },
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 44
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "elasticsearch",
                "uid": "platform-reports"
              },
              "query": "kind:sli",
              "metrics": [
                {
                  "id": "1",
                  "type": "avg",
                  "field": "value"
