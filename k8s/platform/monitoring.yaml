apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: monitoring-alert-credentials
  namespace: infra
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: monitoring-alert-credentials
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: infra/monitoring
        property: gitlab_alert_token

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: infra

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/metrics
      - nodes/proxy
      - services
      - endpoints
      - pods
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  # Ingress hosts are discovered as availability probe targets.
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: infra

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  namespace: infra

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-state-metrics
rules:
  - apiGroups: [""]
    resources:
      - configmaps
      - endpoints
      - limitranges
      - namespaces
      - nodes
      - persistentvolumeclaims
      - persistentvolumes
      - pods
      - replicationcontrollers
      - resourcequotas
      - secrets
      - services
    verbs: ["list", "watch"]
  - apiGroups: ["apps"]
    resources: ["daemonsets", "deployments", "replicasets", "statefulsets"]
    verbs: ["list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["list", "watch"]
  - apiGroups: ["batch"]
    resources: ["cronjobs", "jobs"]
    verbs: ["list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingressclasses", "ingresses", "networkpolicies"]
    verbs: ["list", "watch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "volumeattachments"]
    verbs: ["list", "watch"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources:
      - mutatingadmissionpolicies
      - mutatingadmissionpolicybindings
      - mutatingwebhookconfigurations
      - validatingadmissionpolicies
      - validatingadmissionpolicybindings
      - validatingwebhookconfigurations
    verbs: ["list", "watch"]
  - apiGroups: ["certificates.k8s.io"]
    resources: ["certificatesigningrequests"]
    verbs: ["list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-state-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-state-metrics
subjects:
  - kind: ServiceAccount
    name: kube-state-metrics
    namespace: infra

---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  namespace: infra
  labels:
    app: kube-state-metrics
spec:
  selector:
    app: kube-state-metrics
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
    - name: telemetry
      port: 8081
      targetPort: telemetry

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: infra
  labels:
    app: kube-state-metrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kube-state-metrics
  template:
    metadata:
      labels:
        app: kube-state-metrics
    spec:
      serviceAccountName: kube-state-metrics
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.20.0@sha256:42cfe3723a5f058171c627537fb57a3ea0f26e4380fa18555a95cb1a1b4cfc5b
          args:
            - --metric-labels-allowlist=namespaces=[swirl-cloud.io/application-workloads,swirl-cloud.io/application-environment],pods=[app]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: metrics
              containerPort: 8080
            - name: telemetry
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: telemetry
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi

---
apiVersion: v1
kind: Service
metadata:
  name: node-exporter
  namespace: host-agents
  labels:
    app: node-exporter
spec:
  clusterIP: None
  selector:
    app: node-exporter
  ports:
    - name: metrics
      port: 9100
      targetPort: metrics

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  namespace: host-agents
  labels:
    app: node-exporter
spec:
  selector:
    matchLabels:
      app: node-exporter
  template:
    metadata:
      labels:
        app: node-exporter
    spec:
      automountServiceAccountToken: false
      hostNetwork: true
      hostPID: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      tolerations:
        - operator: Exists
      containers:
        - name: node-exporter
          image: quay.io/prometheus/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          args:
            - --path.rootfs=/host
            - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/kubelet/pods/.+|var/lib/containerd/.+)($|/)
            - --collector.textfile.directory=/host/var/lib/node_exporter/textfile_collector
          ports:
            - name: metrics
              containerPort: 9100
          readinessProbe:
            tcpSocket:
              port: metrics
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: metrics
            periodSeconds: 30
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: root
              mountPath: /host
              readOnly: true
              mountPropagation: HostToContainer
      volumes:
        - name: root
          hostPath:
            path: /

---
# Availability probes for every public Ingress host (docs/guides/service-levels.md).
# Requests travel the public path (DNS, Cloudflare, Traefik) like a user's.
# Login redirects and 401/403/404 answers count as available; 5xx, TLS and
# connection errors do not.
apiVersion: v1
kind: ConfigMap
metadata:
  name: blackbox-exporter-config
  namespace: infra
data:
  blackbox.yml: |
    modules:
      https_available:
        prober: http
        timeout: 10s
        http:
          preferred_ip_protocol: ip4
          follow_redirects: false
          fail_if_not_ssl: true
          valid_status_codes: [200, 201, 202, 204, 301, 302, 303, 307, 308, 401, 403, 404]
          headers:
            User-Agent: swirl-cloud-availability-probe

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blackbox-exporter
  namespace: infra
  labels:
    app: blackbox-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blackbox-exporter
  template:
    metadata:
      labels:
        app: blackbox-exporter
      annotations:
        swirl-cloud.io/config-version: "1"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: blackbox-exporter
          image: quay.io/prometheus/blackbox-exporter:v0.28.0@sha256:e753ff9f3fc458d02cca5eddab5a77e1c175eee484a8925ac7d524f04366c2fc
          args:
            - --config.file=/etc/blackbox/blackbox.yml
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 9115
          readinessProbe:
            httpGet:
              path: /-/healthy
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/blackbox
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: blackbox-exporter-config

---
apiVersion: v1
kind: Service
metadata:
  name: blackbox-exporter
  namespace: infra
  labels:
    app: blackbox-exporter
spec:
  selector:
    app: blackbox-exporter
  ports:
    - name: http
      port: 9115
      targetPort: http

---
# Cluster health and node statistics through a monitor-only Elasticsearch user.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch-exporter
  namespace: infra
  labels:
    app: elasticsearch-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: elasticsearch-exporter
  template:
    metadata:
      labels:
        app: elasticsearch-exporter
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: elasticsearch-exporter
          image: quay.io/prometheuscommunity/elasticsearch-exporter:v1.11.0@sha256:a056739b095df4baaa076f0b31321394233da9a240eeada2623d1b028b7ee7a6
          args:
            - --es.uri=http://elasticsearch.__INTERNAL_DNS_ZONE__:9200
            - --es.timeout=10s
          envFrom:
            - secretRef:
                name: elasticsearch-exporter-credentials
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: metrics
              containerPort: 9114
          readinessProbe:
            tcpSocket:
              port: metrics
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi

---
# Kafka's headless Service resolves to every broker in single-node and HA
# topologies; the private listener admits infra clients (see application-data).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-exporter
  namespace: infra
  labels:
    app: kafka-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-exporter
  template:
    metadata:
      labels:
        app: kafka-exporter
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kafka-exporter
          image: docker.io/danielqsj/kafka-exporter:v1.10.0@sha256:346a53c2489a3530790d01f7b96632496d0d58926662f4c35bb65f569db2ab42
          args:
            - --kafka.server=kafka.__INTERNAL_DNS_ZONE__:9092
            - --kafka.version=4.0.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: metrics
              containerPort: 9308
          readinessProbe:
            tcpSocket:
              port: metrics
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi

---
# Longhorn limits its manager API to Longhorn components. Admit Prometheus to
# the manager port only, which also serves /metrics.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: longhorn-manager-metrics
  namespace: longhorn-system
spec:
  podSelector:
    matchLabels:
      app: longhorn-manager
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: infra
          podSelector:
            matchLabels:
              app: prometheus
      ports:
        - protocol: TCP
          port: 9500

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: infra
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/rules.yaml

    alerting:
      alertmanagers:
        - static_configs:
            - targets: ["alertmanager.__INTERNAL_DNS_ZONE__:9093"]

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

      - job_name: kube-state-metrics
        static_configs:
          - targets: ["kube-state-metrics.__INTERNAL_DNS_ZONE__:8080"]

      - job_name: node-exporter
        kubernetes_sd_configs:
          - role: endpoints
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
            action: keep
            regex: host-agents;node-exporter;metrics
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node

      - job_name: kubernetes-nodes
        scheme: https
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - target_label: __address__
            replacement: kubernetes.default.svc.cluster.local:443
          - source_labels: [__meta_kubernetes_node_name]
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node

      - job_name: kubernetes-cadvisor
        scheme: https
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - target_label: __address__
            replacement: kubernetes.default.svc.cluster.local:443
          - source_labels: [__meta_kubernetes_node_name]
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node

      # Separately installed platform releases are selected by their chart
      # labels and named metrics ports; their charts need no annotations.
      - job_name: traefik
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [infra]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name, __meta_kubernetes_pod_container_port_name]
            action: keep
            regex: traefik;metrics
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node

      # Listener telemetry permits unauthenticated reads, so standbys report too.
      - job_name: vault
        metrics_path: /v1/sys/metrics
        params:
          format: [prometheus]
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [infra]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name, __meta_kubernetes_pod_label_component, __meta_kubernetes_pod_container_port_name]
            action: keep
            regex: vault;server;http
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node

      # One probe per public Ingress host through the blackbox exporter.
      - job_name: availability-probes
        metrics_path: /probe
        params:
          module: [https_available]
        scrape_interval: 30s
        scrape_timeout: 15s
        kubernetes_sd_configs:
          - role: ingress
        relabel_configs:
          # Skip wildcard and host-less rules.
          - source_labels: [__address__]
            action: drop
            regex: '(\*.*)?'
          - source_labels: [__address__]
            target_label: __param_target
            replacement: https://$1/
          - source_labels: [__param_target]
            target_label: instance
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - target_label: __address__
            replacement: blackbox-exporter.__INTERNAL_DNS_ZONE__:9115

      - job_name: argocd
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [infra]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_part_of, __meta_kubernetes_pod_container_port_name]
            action: keep
            regex: argocd;metrics
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            target_label: component
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node

      # The manager API port also serves /metrics; see longhorn-manager-metrics.
      - job_name: longhorn
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [longhorn-system]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app, __meta_kubernetes_pod_container_port_name]
            action: keep
            regex: longhorn-manager;manager
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node

      # Datastore exporters are containers named <datastore>-exporter with a
      # metrics port; CloudNativePG instances serve the same PostgreSQL role.
      # Each target's job is the datastore name.
      - job_name: datastores
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [infra]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_container_name, __meta_kubernetes_pod_container_port_name, __meta_kubernetes_pod_label_cnpg_io_cluster]
            action: keep
            regex: (postgres|mongodb|redis|kafka|elasticsearch)-exporter;metrics;|postgres;metrics;postgres-ha
          - source_labels: [__meta_kubernetes_pod_container_name]
            regex: (postgres|mongodb|redis|kafka|elasticsearch).*
            target_label: job
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node

      - job_name: external-secrets
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [infra]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name, __meta_kubernetes_pod_container_port_name]
            action: keep
            regex: external-secrets;metrics
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

      # Applications opt in from their owning repository with these pod annotations:
      # prometheus.io/scrape=true, prometheus.io/path=/metrics, prometheus.io/port=<port>.
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_container_init]
            action: drop
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scheme]
            action: replace
            target_label: __scheme__
            regex: (https?)
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            target_label: __address__
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app

  rules.yaml: |
    groups:
      - name: swirl-cloud.capacity
        rules:
          - alert: NodeFilesystemSpaceLow
            expr: |
              (
                node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}
                /
                node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"}
              ) < 0.20
            for: 10m
            labels:
              severity: warning
              owner: platform
            annotations:
              runbook_url: https://gitlab.__PUBLIC_DOMAIN__/__GITLAB_GROUP_PATH__/__GITLAB_PROJECT_NAME__/-/blob/main/docs/guides/alert-runbooks.md#nodefilesystemspacelow
              summary: Filesystem free space is below 20%
              description: '{{ $labels.instance }} mount {{ $labels.mountpoint }} has {{ $value | humanizePercentage }} free.'
          - alert: NodeFilesystemSpaceCritical
            expr: |
              (
                node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}
                /
                node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"}
              ) < 0.10
            for: 5m
            labels:
              severity: critical
              owner: platform
            annotations:
              runbook_url: https://gitlab.__PUBLIC_DOMAIN__/__GITLAB_GROUP_PATH__/__GITLAB_PROJECT_NAME__/-/blob/main/docs/guides/alert-runbooks.md#nodefilesystemspacecritical
              summary: Filesystem free space is below 10%
              description: '{{ $labels.instance }} mount {{ $labels.mountpoint }} is critically low on space.'
          # Backups, image pulls and upgrades need about 30 GiB on the K3s host
          # filesystem; kubelet image GC starts at 85 % used, before evictions.
          - alert: NodeMaintenanceHeadroomLow
            expr: |
              node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs",mountpoint=~"/|/var|/var/lib|/var/lib/rancher.*"}
              < 30 * 1024 * 1024 * 1024
            for: 15m
            labels:
              severity: warning
              owner: platform
            annotations:
              runbook_url: https://gitlab.__PUBLIC_DOMAIN__/__GITLAB_GROUP_PATH__/__GITLAB_PROJECT_NAME__/-/blob/main/docs/guides/alert-runbooks.md#nodemaintenanceheadroomlow
              summary: Less than 30 GiB free for maintenance
              description: '{{ $labels.instance }} mount {{ $labels.mountpoint }} has {{ $value | humanize1024 }}B free. Free space before backups, upgrades or image pulls.'
          - alert: NodeFilesystemFillingWithinDay
            expr: |
              predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}[6h], 24 * 3600) < 0
              and node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"} < 0.30
            for: 30m
            labels:
              severity: warning
              owner: platform
            annotations:
              runbook_url: https://gitlab.__PUBLIC_DOMAIN__/__GITLAB_GROUP_PATH__/__GITLAB_PROJECT_NAME__/-/blob/main/docs/guides/alert-runbooks.md#nodefilesystemfillingwithinday
              summary: Filesystem is predicted to fill within 24 hours
              description: '{{ $labels.instance }} mount {{ $labels.mountpoint }} is consuming its remaining space quickly.'
          - alert: PersistentVolumeSpaceLow
            expr: kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes < 0.20
            for: 15m
            labels:
              severity: warning
              owner: '{{ if match "^apps(-.+)?$" $labels.namespace }}application{{ else }}platform{{ end }}'
            annotations:
              runbook_url: https://gitlab.__PUBLIC_DOMAIN__/__GITLAB_GROUP_PATH__/__GITLAB_PROJECT_NAME__/-/blob/main/docs/guides/alert-runbooks.md#persistentvolumespacelow
              summary: Persistent volume free space is below 20%
              description: '{{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} has {{ $value | humanizePercentage }} free; expand the claim or reduce retention.'
          - alert: PersistentVolumeSpaceCritical
            expr: kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes < 0.10
            for: 5m
            labels:
              severity: critical
              owner: '{{ if match "^apps(-.+)?$" $labels.namespace }}application{{ else }}platform{{ end }}'
            annotations:
              runbook_url: https://gitlab.__PUBLIC_DOMAIN__/__GITLAB_GROUP_PATH__/__GITLAB_PROJECT_NAME__/-/blob/main/docs/guides/alert-runbooks.md#persistentvolumespacecritical
              summary: Persistent volume free space is below 10%
              description: '{{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is critically low on space.'
          - alert: PersistentVolumeFillingWithinDay
            expr: |
              predict_linear(kubelet_volume_stats_available_bytes[6h], 24 * 3600) < 0
              and kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes < 0.30
            for: 30m
            labels:
              severity: warning
              owner: '{{ if match "^apps(-.+)?$" $labels.namespace }}application{{ else }}platform{{ end }}'
            annotations:
              runbook_url: https://gitlab.__PUBLIC_DOMAIN__/__GITLAB_GROUP_PATH__/__GITLAB_PROJECT_NAME__/-/blob/main/docs/guides/alert-runbooks.md#persistentvolumefillingwithinday
              summary: Persistent volume is predicted to fill within 24 hours
              description: '{{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is consuming its remaining space quickly.'
      - name: swirl-cloud.kubernetes
        rules:
          - alert: KubernetesDeploymentUnavailable
            expr: kube_deployment_spec_replicas > kube_deployment_status_replicas_available
            for: 10m
            labels:
              severity: critical
              owner: '{{ if match "^apps(-.+)?$" $labels.namespace }}application{{ else }}platform{{ end }}'
            annotations:
              runbook_url: https://gitlab.__PUBLIC_DOMAIN__/__GITLAB_GROUP_PATH__/__GITLAB_PROJECT_NAME__/-/blob/main/docs/guides/alert-runbooks.md#kubernetesdeploymentunavailable
              summary: Kubernetes Deployment has unavailable replicas
              description: '{{ $labels.namespace }}/{{ $labels.deployment }} has fewer available replicas than desired.'
          - alert: KubernetesStatefulSetUnavailable
            expr: kube_statefulset_replicas > kube_statefulset_status_replicas_ready
            for: 10m
            labels:
              severity: critical
              owner: '{{ if match "^apps(-.+)?$" $labels.namespace }}application{{ else }}platform{{ end }}'
            annotations:
              runbook_url: https://gitlab.__PUBLIC_DOMAIN__/__GITLAB_GROUP_PATH__/__GITLAB_PROJECT_NAME__/-/blob/main/docs/guides/alert-runbooks.md#kubernetesstatefulsetunavailable
              summary: Kubernetes StatefulSet has unavailable replicas
              description: '{{ $labels.namespace }}/{{ $labels.statefulset }} has fewer ready replicas than desired.'
          - alert: KubernetesPodCrashLooping
            expr: max_over_time(kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"}[10m]) > 0
            for: 10m
            labels:
              severity: critical
              owner: '{{ if match "^apps(-.+)?$" $labels.namespace }}application{{ else }}platform{{ end }}'
            annotations:
              runbook_url: https://gitlab.__PUBLIC_DOMAIN__/__GITLAB_GROUP_PATH__/__GITLAB_PROJECT_NAME__/-/blob/main/docs/guides/alert-runbooks.md#kubernetespodcrashlooping
              summary: Pod is crash-looping
              description: '{{ $labels.namespace }}/{{ $labels.pod }} container {{ $labels.container }} is in CrashLoopBackOff.'
          - alert: KubernetesContainerOOMKilled
            expr: increase(kube_pod_container_status_restarts_total[15m]) > 0 and on(namespace, pod, container) kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1
            labels:
              severity: warning
              owner: '{{ if match "^apps(-.+)?$" $labels.namespace }}application{{ else }}platform{{ end }}'
            annotations:
              runbook_url: https://gitlab.__PUBLIC_DOMAIN__/__GITLAB_GROUP_PATH__/__GITLAB_PROJECT_NAME__/-/blob/main/docs/guides/alert-runbooks.md#kubernetescontaineroomkilled
              summary: Container restarted after an OOM kill
              description: '{{ $labels.namespace }}/{{ $labels.pod }} container {{ $labels.container }} exhausted its memory limit.'
          - alert: KubernetesPersistentVolumeReleased
            expr: kube_persistentvolume_status_phase{phase="Released"} == 1
            for: 30m
            labels:
              severity: warning
              owner: platform
            annotations:
              runbook_url: https://gitlab.__PUBLIC_DOMAIN__/__GITLAB_GROUP_PATH__/__GITLAB_PROJECT_NAME__/-/blob/main/docs/guides/alert-runbooks.md#kubernetespersistentvolumereleased
              summary: Released persistent volume still consumes storage
              description: 'PersistentVolume {{ $labels.persistentvolume }} has remained Released for at least 30 minutes.'
          - alert: KubernetesPersistentVolumeClaimPending
            expr: kube_persistentvolumeclaim_status_phase{phase="Pending"} == 1
            for: 15m
            labels:
              severity: critical
              owner: '{{ if match "^apps(-.+)?$" $labels.namespace }}application{{ else }}platform{{ end }}'
            annotations:
              runbook_url: https://gitlab.__PUBLIC_DOMAIN__/__GITLAB_GROUP_PATH__/__GITLAB_PROJECT_NAME__/-/blob/main/docs/guides/alert-runbooks.md#kubernetespersistentvolumeclaimpending
              summary: PersistentVolumeClaim is pending
              description: '{{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} has not bound to storage.'
          # Failed CronJob runs stay in history; ignore those superseded by a later success.
          - alert: KubernetesJobFailed
            expr: |
              kube_job_status_failed > 0
              unless on (namespace, job_name)
              (
                (kube_job_status_start_time * on (namespace, job_name) group_left (owner_name) kube_job_owner{owner_kind="CronJob"})
                < on (namespace, owner_name) group_left ()
                label_replace(kube_cronjob_status_last_successful_time, "owner_name", "$1", "cronjob", "(.+)")
              )
            for: 5m
            labels:
              severity: warning
              owner: '{{ if match "^apps(-.+)?$" $labels.namespace }}application{{ else }}platform{{ end }}'
            annotations:
              runbook_url: https://gitlab.__PUBLIC_DOMAIN__/__GITLAB_GROUP_PATH__/__GITLAB_PROJECT_NAME__/-/blob/main/docs/guides/alert-runbooks.md#kubernetesjobfailed
              summary: Kubernetes Job failed
              description: '{{ $labels.namespace }}/{{ $labels.job_name }} has a failed execution.'
      - name: swirl-cloud.platform
        rules:
          - alert: KubernetesNodeNotReady
            expr: kube_node_status_condition{condition="Ready",status="true"} == 0
            for: 5m
            labels:
              severity: critical
              owner: platform
            annotations:
              runbook_url: https://gitlab.__PUBLIC_DOMAIN__/__GITLAB_GROUP_PATH__/__GITLAB_PROJECT_NAME__/-/blob/main/docs/guides/alert-runbooks.md#kubernetesnodenotready
              summary: Kubernetes node is not Ready
              description: 'Node {{ $labels.node }} has not reported Ready for five minutes.'
          - alert: VaultSealed
            expr: vault_core_unsealed == 0
            for: 2m
            labels:
              severity: critical
              owner: platform
            annotations:
              runbook_url: https://gitlab.__PUBLIC_DOMAIN__/__GITLAB_GROUP_PATH__/__GITLAB_PROJECT_NAME__/-/blob/main/docs/guides/alert-runbooks.md#vaultsealed
              summary: Vault is sealed
              description: 'Vault pod {{ $labels.pod }} is sealed; secrets cannot be read until it is unsealed.'
          # Vault refuses requests once no audit device can record them.
          - alert: VaultAuditDeviceFailing
            expr: increase(vault_audit_log_request_failure[10m]) > 0 or increase(vault_audit_log_response_failure[10m]) > 0
            labels:
              severity: critical
              owner: security
            annotations:
              runbook_url: https://gitlab.__PUBLIC_DOMAIN__/__GITLAB_GROUP_PATH__/__GITLAB_PROJECT_NAME__/-/blob/main/docs/guides/alert-runbooks.md#vaultauditdevicefailing
              summary: Vault audit device is failing
              description: 'Vault pod {{ $labels.pod }} failed to write audit entries in the last ten minutes.'
          # Longhorn exports one series per robustness state, set to 1 for the current state.
          - alert: LonghornVolumeDegraded
            expr: longhorn_volume_robustness{state="degraded"} == 1
            for: 15m
            labels:
              severity: warning
              owner: platform
            annotations:
              runbook_url: https://gitlab.__PUBLIC_DOMAIN__/__GITLAB_GROUP_PATH__/__GITLAB_PROJECT_NAME__/-/blob/main/docs/guides/alert-runbooks.md#longhornvolumedegraded
              summary: Longhorn volume is degraded
              description: 'Volume {{ $labels.volume }} ({{ $labels.pvc_namespace }}/{{ $labels.pvc }}) is missing healthy replicas or still rebuilding.'
          - alert: LonghornVolumeBackupStale
            # Silent until off-node volume backups are active (the target holds
            # at least one backup); then every volume must stay within 36 hours.
            expr: |
              (time() - longhorn_volume_last_backup_at > 36 * 3600)
              and on() (sum(longhorn_backup_target_backup_volume_count) > 0)
            for: 1h
            labels:
              severity: warning
              owner: platform
            annotations:
              runbook_url: https://gitlab.__PUBLIC_DOMAIN__/__GITLAB_GROUP_PATH__/__GITLAB_PROJECT_NAME__/-/blob/main/docs/guides/alert-runbooks.md#longhornvolumebackupstale
              summary: Longhorn volume backup is overdue
              description: 'Volume for {{ $labels.pvc }} has no off-node backup from the last 36 hours; check the daily recurring job and the backup target.'
          - alert: LonghornVolumeFaulted
            expr: longhorn_volume_robustness{state="faulted"} == 1
            for: 2m
            labels:
              severity: critical
              owner: platform
            annotations:
              runbook_url: https://gitlab.__PUBLIC_DOMAIN__/__GITLAB_GROUP_PATH__/__GITLAB_PROJECT_NAME__/-/blob/main/docs/guides/alert-runbooks.md#longhornvolumefaulted
              summary: Longhorn volume is faulted
              description: 'Volume {{ $labels.volume }} ({{ $labels.pvc_namespace }}/{{ $labels.pvc }}) has no usable replica.'
          - alert: KeycloakPasswordFailuresHigh
            expr: sum by (realm) (increase(keycloak_credentials_password_hashing_validations_total{outcome!="valid"}[15m])) > 20
            labels:
              severity: warning
              owner: security
            annotations:
              runbook_url: https://gitlab.__PUBLIC_DOMAIN__/__GITLAB_GROUP_PATH__/__GITLAB_PROJECT_NAME__/-/blob/main/docs/guides/alert-runbooks.md#keycloakpasswordfailureshigh
              summary: Many failed Keycloak password checks
              description: 'Realm {{ $labels.realm }} rejected {{ $value | printf "%.0f" }} passwords in 15 minutes; check for credential guessing against the SSO identity.'
          - alert: ExternalSecretNotReady
            expr: externalsecret_status_condition{condition="Ready",status="False"} == 1
            for: 15m
            labels:
              severity: warning
              owner: platform
            annotations:
              runbook_url: https://gitlab.__PUBLIC_DOMAIN__/__GITLAB_GROUP_PATH__/__GITLAB_PROJECT_NAME__/-/blob/main/docs/guides/alert-runbooks.md#externalsecretnotready
              summary: ExternalSecret is not Ready
              description: '{{ $labels.namespace }}/{{ $labels.name }} has not synchronized from Vault for 15 minutes; inspect kubectl describe externalsecret.'
          - alert: ElasticsearchUnreachable
            expr: elasticsearch_clusterinfo_up == 0 or absent(elasticsearch_cluster_health_status{color="green"})
            for: 5m
            labels:
              severity: critical
              owner: platform
            annotations:
              runbook_url: https://gitlab.__PUBLIC_DOMAIN__/__GITLAB_GROUP_PATH__/__GITLAB_PROJECT_NAME__/-/blob/main/docs/guides/alert-runbooks.md#elasticsearchunreachable
              summary: Elasticsearch is unreachable
              description: 'The exporter cannot read Elasticsearch cluster health; logs and audits are not being indexed.'
          - alert: ElasticsearchClusterRed
            expr: elasticsearch_cluster_health_status{color="red"} == 1
            for: 5m
            labels:
              severity: critical
              owner: platform
            annotations:
              runbook_url: https://gitlab.__PUBLIC_DOMAIN__/__GITLAB_GROUP_PATH__/__GITLAB_PROJECT_NAME__/-/blob/main/docs/guides/alert-runbooks.md#elasticsearchclusterred
              summary: Elasticsearch cluster health is red
              description: 'At least one primary shard is unassigned; some logs or audits cannot be written or searched.'
          - alert: ElasticsearchClusterYellow
            expr: elasticsearch_cluster_health_status{color="yellow"} == 1
            for: 30m
            labels:
              severity: warning
              owner: platform
            annotations:
              runbook_url: https://gitlab.__PUBLIC_DOMAIN__/__GITLAB_GROUP_PATH__/__GITLAB_PROJECT_NAME__/-/blob/main/docs/guides/alert-runbooks.md#elasticsearchclusteryellow
              summary: Elasticsearch cluster health is yellow
              description: 'Replica shards are unassigned; on a single node, check for indices that request replicas.'
          - alert: DatastoreDown
            expr: pg_up == 0 or cnpg_collector_up == 0 or mongodb_up == 0 or redis_up == 0 or kafka_brokers < 1
            for: 5m
            labels:
              severity: critical
              owner: platform
            annotations:
              runbook_url: https://gitlab.__PUBLIC_DOMAIN__/__GITLAB_GROUP_PATH__/__GITLAB_PROJECT_NAME__/-/blob/main/docs/guides/alert-runbooks.md#datastoredown
              summary: Shared datastore is unavailable
              description: '{{ $labels.job }} exporter on {{ $labels.pod }} cannot reach its datastore.'
          - alert: ArgoCDApplicationUnhealthy
            expr: argocd_app_info{health_status=~"Degraded|Missing|Unknown"} == 1
            for: 15m
            labels:
              severity: warning
              owner: platform
            annotations:
              runbook_url: https://gitlab.__PUBLIC_DOMAIN__/__GITLAB_GROUP_PATH__/__GITLAB_PROJECT_NAME__/-/blob/main/docs/guides/alert-runbooks.md#argocdapplicationunhealthy
              summary: Argo CD application is unhealthy
              description: 'Application {{ $labels.name }} has been {{ $labels.health_status }} for fifteen minutes.'
          - alert: ArgoCDApplicationOutOfSync
            expr: argocd_app_info{sync_status="OutOfSync"} == 1
            for: 30m
            labels:
              severity: warning
              owner: platform
            annotations:
              runbook_url: https://gitlab.__PUBLIC_DOMAIN__/__GITLAB_GROUP_PATH__/__GITLAB_PROJECT_NAME__/-/blob/main/docs/guides/alert-runbooks.md#argocdapplicationoutofsync
              summary: Argo CD application is out of sync
              description: 'Application {{ $labels.name }} has not matched its Git revision for thirty minutes.'
          # Traefik is scraped by two jobs; group by certificate identity.
          - alert: TLSCertificateExpiringSoon
            expr: (min by (cn, sans) (traefik_tls_certs_not_after) - time()) < 14 * 86400
            for: 1h
            labels:
              severity: warning
              owner: platform
            annotations:
              runbook_url: https://gitlab.__PUBLIC_DOMAIN__/__GITLAB_GROUP_PATH__/__GITLAB_PROJECT_NAME__/-/blob/main/docs/guides/alert-runbooks.md#tlscertificateexpiringsoon
              summary: TLS certificate expires within 14 days
              description: 'Certificate {{ $labels.cn }} for {{ $labels.sans }} expires in {{ $value | humanizeDuration }}.'
          - alert: TLSCertificateExpiryCritical
            expr: (min by (cn, sans) (traefik_tls_certs_not_after) - time()) < 3 * 86400
            for: 10m
            labels:
              severity: critical
              owner: platform
            annotations:
              runbook_url: https://gitlab.__PUBLIC_DOMAIN__/__GITLAB_GROUP_PATH__/__GITLAB_PROJECT_NAME__/-/blob/main/docs/guides/alert-runbooks.md#tlscertificateexpirycritical
              summary: TLS certificate expires within 3 days
              description: 'Certificate {{ $labels.cn }} for {{ $labels.sans }} expires in {{ $value | humanizeDuration }}.'
      - name: swirl-cloud.host-audit
        rules:
          - alert: LynisAuditFailed
            expr: swirl_cloud_lynis_last_run_exit_code != 0
            labels:
              severity: warning
              owner: security
            annotations:
              runbook_url: https://gitlab.__PUBLIC_DOMAIN__/__GITLAB_GROUP_PATH__/__GITLAB_PROJECT_NAME__/-/blob/main/docs/guides/alert-runbooks.md#lynisauditfailed
              summary: Managed Lynis audit failed
              description: 'The last Lynis run on {{ $labels.node }} exited with code {{ $value }}; inspect journalctl -u swirl-cloud-lynis.service.'
          - alert: LynisAuditMissing
            expr: time() - swirl_cloud_lynis_last_success_timestamp_seconds > 35 * 86400
            labels:
              severity: warning
              owner: security
            annotations:
              runbook_url: https://gitlab.__PUBLIC_DOMAIN__/__GITLAB_GROUP_PATH__/__GITLAB_PROJECT_NAME__/-/blob/main/docs/guides/alert-runbooks.md#lynisauditmissing
              summary: Monthly Lynis audit is overdue
              description: 'No successful Lynis audit on {{ $labels.node }} for more than 35 days; check swirl-cloud-lynis.timer.'
          # Known findings are triaged in docs/security.md; alert only when an
          # image gains critical findings over its own recent maximum, or a new
          # image arrives with some. The 6 h baseline fits the current size-bound
          # retention; widen it with the retention increase in TODO §26.
          - alert: TrivyNewCriticalVulnerability
            expr: |
              max by (exported_namespace, image_repository) (trivy_image_vulnerabilities{severity="Critical"}) > 0
              unless on (exported_namespace, image_repository)
              (
                max by (exported_namespace, image_repository) (trivy_image_vulnerabilities{severity="Critical"})
                <= max_over_time(max by (exported_namespace, image_repository) (trivy_image_vulnerabilities{severity="Critical"})[6h:15m] offset 1h)
              )
            for: 30m
            labels:
              severity: warning
              owner: security
            annotations:
              runbook_url: https://gitlab.__PUBLIC_DOMAIN__/__GITLAB_GROUP_PATH__/__GITLAB_PROJECT_NAME__/-/blob/main/docs/guides/alert-runbooks.md#trivynewcriticalvulnerability
              summary: New critical vulnerabilities in a running image
              description: '{{ $labels.image_repository }} in {{ $labels.exported_namespace }} now has {{ $value }} critical findings. Triage them (docs/security.md#vulnerability-triage) in the Trivy dashboard.'
          - alert: HostFirewallDisabled
            expr: swirl_cloud_host_firewall_active == 0
            for: 5m
            labels:
              severity: critical
              owner: security
            annotations:
              runbook_url: https://gitlab.__PUBLIC_DOMAIN__/__GITLAB_GROUP_PATH__/__GITLAB_PROJECT_NAME__/-/blob/main/docs/guides/alert-runbooks.md#hostfirewalldisabled
              summary: Host firewall is not enforcing
              description: 'UFW is inactive or INPUT is not default-deny on {{ $labels.instance }}; every listening port may be reachable. Check: sudo ufw status verbose, then rerun scripts/configure-node-security.sh.'
          - alert: HostIntrusionPreventionDown
            expr: swirl_cloud_intrusion_service_up == 0
            for: 15m
            labels:
              severity: critical
              owner: security
            annotations:
              runbook_url: https://gitlab.__PUBLIC_DOMAIN__/__GITLAB_GROUP_PATH__/__GITLAB_PROJECT_NAME__/-/blob/main/docs/guides/alert-runbooks.md#hostintrusionpreventiondown
              summary: Host intrusion prevention is not running
              description: '{{ $labels.service }} is inactive on {{ $labels.instance }}; its public SSH has no brute-force protection. Check: sudo systemctl status {{ $labels.service }}.'
          - alert: HostIntrusionMetricsStale
            expr: time() - swirl_cloud_intrusion_metrics_timestamp_seconds > 1800
            for: 10m
            labels:
              severity: warning
              owner: security
            annotations:
              runbook_url: https://gitlab.__PUBLIC_DOMAIN__/__GITLAB_GROUP_PATH__/__GITLAB_PROJECT_NAME__/-/blob/main/docs/guides/alert-runbooks.md#hostintrusionmetricsstale
              summary: Intrusion-prevention metrics are stale
              description: '{{ $labels.instance }} has not refreshed Fail2ban/CrowdSec metrics for 30 minutes. Check: sudo systemctl status swirl-cloud-intrusion-metrics.timer.'
          - alert: HostBruteForceWave
            expr: |
              sum by (instance) (increase(swirl_cloud_fail2ban_banned_total[1h])) > 50
              or sum by (instance) (swirl_cloud_crowdsec_decisions) > 200
            for: 10m
            labels:
              severity: warning
              owner: security
            annotations:
              runbook_url: https://gitlab.__PUBLIC_DOMAIN__/__GITLAB_GROUP_PATH__/__GITLAB_PROJECT_NAME__/-/blob/main/docs/guides/alert-runbooks.md#hostbruteforcewave
              summary: Brute-force wave against a host
              description: '{{ $labels.instance }} is banning attackers at an unusual rate ({{ $value | humanize }}). Bans are working; consider key-only SSH on the private interface (TODO §4).'
          - alert: NodeRebootRequired
            expr: swirl_cloud_reboot_required == 1 and time() - swirl_cloud_reboot_required_since_timestamp_seconds > 7 * 86400
            labels:
              severity: warning
              owner: platform
            annotations:
              runbook_url: https://gitlab.__PUBLIC_DOMAIN__/__GITLAB_GROUP_PATH__/__GITLAB_PROJECT_NAME__/-/blob/main/docs/guides/alert-runbooks.md#noderebootrequired
              summary: Node reboot has been pending for over a week
              description: 'Installed updates on {{ $labels.node }} have required a reboot for more than seven days; schedule a maintenance window.'
          - alert: HostMaintenanceServiceFailed
            expr: swirl_cloud_systemd_unit_last_run_success == 0
            for: 15m
            labels:
              severity: critical
              owner: platform
            annotations:
              runbook_url: https://gitlab.__PUBLIC_DOMAIN__/__GITLAB_GROUP_PATH__/__GITLAB_PROJECT_NAME__/-/blob/main/docs/guides/alert-runbooks.md#hostmaintenanceservicefailed
              summary: Host maintenance service failed
              description: 'The last run of {{ $labels.unit }} on {{ $labels.node }} failed; inspect journalctl -u {{ $labels.unit }}.'
          - alert: K3sRecoveryBackupMissing
            expr: time() - swirl_cloud_systemd_unit_last_success_timestamp_seconds{unit="swirl-cloud-k3s-backup.service"} > 36 * 3600
            labels:
              severity: critical
              owner: platform
            annotations:
              runbook_url: https://gitlab.__PUBLIC_DOMAIN__/__GITLAB_GROUP_PATH__/__GITLAB_PROJECT_NAME__/-/blob/main/docs/guides/alert-runbooks.md#k3srecoverybackupmissing
              summary: Daily K3s recovery backup is overdue
              description: 'No successful swirl-cloud-k3s-backup.service run on {{ $labels.node }} for more than 36 hours; check swirl-cloud-k3s-backup.timer.'
          - alert: VaultUnsealTimerStopped
            expr: time() - swirl_cloud_systemd_unit_last_run_timestamp_seconds{unit="swirl-cloud-vault-unseal.service"} > 15 * 60
            labels:
              severity: warning
              owner: platform
            annotations:
              runbook_url: https://gitlab.__PUBLIC_DOMAIN__/__GITLAB_GROUP_PATH__/__GITLAB_PROJECT_NAME__/-/blob/main/docs/guides/alert-runbooks.md#vaultunsealtimerstopped
              summary: Vault unseal timer is not running
              description: 'swirl-cloud-vault-unseal.service has not run on {{ $labels.node }} for 15 minutes; Vault would stay sealed after a restart.'
      - name: swirl-cloud.ingress
        rules:
          - alert: IngressServiceErrorRateHigh
            expr: |
              sum by (service) (rate(traefik_service_requests_total{code=~"5.."}[10m]))
              / sum by (service) (rate(traefik_service_requests_total[10m])) > 0.05
              and sum by (service) (rate(traefik_service_requests_total[10m])) > 0.05
            for: 15m
            labels:
              severity: warning
              owner: '{{ if match "^apps(-[a-z0-9]+)?-" $labels.service }}application{{ else }}platform{{ end }}'
            annotations:
              runbook_url: https://gitlab.__PUBLIC_DOMAIN__/__GITLAB_GROUP_PATH__/__GITLAB_PROJECT_NAME__/-/blob/main/docs/guides/alert-runbooks.md#ingressserviceerrorratehigh
              summary: Ingress service is returning server errors
              description: '{{ $labels.service }} has answered more than 5% of requests with 5xx for 15 minutes; see the Ingress Traffic dashboard.'
      - name: swirl-cloud.monitoring
        rules:
          - alert: PrometheusTargetDown
            expr: up == 0
            for: 10m
            labels:
              severity: warning
              owner: platform
            annotations:
              runbook_url: https://gitlab.__PUBLIC_DOMAIN__/__GITLAB_GROUP_PATH__/__GITLAB_PROJECT_NAME__/-/blob/main/docs/guides/alert-runbooks.md#prometheustargetdown
              summary: Prometheus target is down
              description: '{{ $labels.job }} target {{ $labels.instance }} has been unreachable for ten minutes.'
      # Helm replaces the next line with per-check rules generated from
      # k8s/files/compliance-controls.yaml (status 2 passing, 1 no evidence, 0 failing).
      # swirl-cloud:compliance-evidence-rules
      - name: swirl-cloud.compliance
        rules:
          - record: swirl_cloud_compliance_control_status
            expr: min by (control) (swirl_cloud_compliance_check_status)
          - record: swirl_cloud_compliance_framework_control_status
            expr: |
              min by (framework, control) (
                swirl_cloud_compliance_requirement * on (control) group_left swirl_cloud_compliance_control_status
              )
          - record: swirl_cloud_compliance_framework_passing_ratio
            expr: |
              (
                count by (framework) (swirl_cloud_compliance_framework_control_status == 2)
                or count by (framework) (swirl_cloud_compliance_framework_control_status) * 0
              )
              / count by (framework) (swirl_cloud_compliance_framework_control_status)
          # Drift: a control is worse than its best state in the last six hours.
          - alert: ComplianceControlRegressed
            expr: swirl_cloud_compliance_control_status < max_over_time(swirl_cloud_compliance_control_status[6h])
            for: 30m
            labels:
              severity: warning
              owner: security
            annotations:
              runbook_url: https://gitlab.__PUBLIC_DOMAIN__/__GITLAB_GROUP_PATH__/__GITLAB_PROJECT_NAME__/-/blob/main/docs/guides/alert-runbooks.md#compliancecontrolregressed
              summary: A compliance control started failing or lost its evidence
              description: 'Control {{ $labels.control }} is now {{ if eq $value 0.0 }}failing{{ else }}without evidence{{ end }}. Open the Compliance Evidence dashboard or run ./install.sh --compliance.'
      # Service levels (docs/guides/service-levels.md): every public endpoint
      # targets 99.5 % availability (error budget 0.5 %) measured by probes.
      # Burn-rate alerts follow the multi-window method of the Google SRE
      # workbook: 14.4x over 1 h and 5 m pages, 6x over 6 h and 30 m warns.
      - name: swirl-cloud.slo
        rules:
          - record: swirl_cloud_slo:probe_success:ratio_rate5m
            expr: avg by (instance, namespace) (avg_over_time(probe_success{job="availability-probes"}[5m]))
          - record: swirl_cloud_slo:probe_success:ratio_rate30m
            expr: avg by (instance, namespace) (avg_over_time(probe_success{job="availability-probes"}[30m]))
          - record: swirl_cloud_slo:probe_success:ratio_rate1h
            expr: avg by (instance, namespace) (avg_over_time(probe_success{job="availability-probes"}[1h]))
          - record: swirl_cloud_slo:probe_success:ratio_rate6h
            expr: avg by (instance, namespace) (avg_over_time(probe_success{job="availability-probes"}[6h]))
          - record: swirl_cloud_slo:objective
            expr: vector(0.995)
          - alert: SLOAvailabilityBudgetBurnFast
            expr: |
              (1 - swirl_cloud_slo:probe_success:ratio_rate1h) > 14.4 * (1 - 0.995)
              and (1 - swirl_cloud_slo:probe_success:ratio_rate5m) > 14.4 * (1 - 0.995)
            for: 2m
            labels:
              severity: critical
              owner: '{{ if match "^apps(-.+)?$" $labels.namespace }}application{{ else }}platform{{ end }}'
            annotations:
              runbook_url: https://gitlab.__PUBLIC_DOMAIN__/__GITLAB_GROUP_PATH__/__GITLAB_PROJECT_NAME__/-/blob/main/docs/guides/alert-runbooks.md#sloavailabilitybudgetburnfast
              summary: Endpoint is burning its availability budget fast
              description: '{{ $labels.instance }} failed {{ $value | humanizePercentage }} of probes over the last hour; at this rate the month''s 0.5 % budget is gone in about two days.'
          - alert: SLOAvailabilityBudgetBurnSlow
            expr: |
              (1 - swirl_cloud_slo:probe_success:ratio_rate6h) > 6 * (1 - 0.995)
              and (1 - swirl_cloud_slo:probe_success:ratio_rate30m) > 6 * (1 - 0.995)
            for: 15m
            labels:
              severity: warning
              owner: '{{ if match "^apps(-.+)?$" $labels.namespace }}application{{ else }}platform{{ end }}'
            annotations:
              runbook_url: https://gitlab.__PUBLIC_DOMAIN__/__GITLAB_GROUP_PATH__/__GITLAB_PROJECT_NAME__/-/blob/main/docs/guides/alert-runbooks.md#sloavailabilitybudgetburnslow
              summary: Endpoint is steadily burning its availability budget
              description: '{{ $labels.instance }} failed {{ $value | humanizePercentage }} of probes over six hours; the month''s 0.5 % budget lasts about five days at this rate.'
      # Service indicators that endpoint probes do not cover (docs/guides/service-levels.md).
      - name: swirl-cloud.sli
        rules:
          - record: swirl_cloud_sli:datastore_up
            expr: |
              label_replace(
                max by (job) (pg_up or mongodb_up or redis_up or (kafka_brokers >= bool 1)),
                "service", "$1", "job", "(.*)"
              )
          # CI failures caused by the platform (runner, system, timeouts), not by
          # job scripts or cancellations, over all jobs in the window.
          - record: swirl_cloud_sli:ci_platform_failures:ratio_rate6h
            expr: |
              (sum(increase(gitlab_runner_failed_jobs_total{failure_reason!~"script_failure|job_canceled"}[6h])) or vector(0))
              / clamp_min(sum(increase(gitlab_runner_jobs_total[6h])), 1)
          - record: swirl_cloud_sli:ci_queue_seconds:p90_6h
            expr: histogram_quantile(0.9, sum by (le) (rate(gitlab_runner_job_queue_duration_seconds_bucket[6h])))
          - record: swirl_cloud_sli:argocd_sync_failures:ratio_rate6h
            expr: |
              (sum(increase(argocd_app_sync_total{phase=~"Error|Failed"}[6h])) or vector(0))
              / clamp_min(sum(increase(argocd_app_sync_total[6h])), 1)
          - alert: CIJobsQueueingLong
            expr: swirl_cloud_sli:ci_queue_seconds:p90_6h > 600
            for: 1h
            labels:
              severity: warning
              owner: platform
            annotations:
              runbook_url: https://gitlab.__PUBLIC_DOMAIN__/__GITLAB_GROUP_PATH__/__GITLAB_PROJECT_NAME__/-/blob/main/docs/guides/alert-runbooks.md#cijobsqueueinglong
              summary: CI jobs wait more than ten minutes for a runner
              description: 'Nine in ten CI jobs started within {{ $value | humanizeDuration }} over six hours; raise runner concurrency or add capacity.'
      # Capacity planning (docs/guides/capacity-planning.md): requests reserve
      # schedulable capacity whether used or not, so plan on requests and keep
      # usage in view. Targets keep requests below 70 % and survive a server loss.
      - name: swirl-cloud.capacity-planning
        rules:
          - record: swirl_cloud_capacity:requests:ratio
            expr: |
              sum by (resource) (kube_pod_container_resource_requests{resource=~"cpu|memory",node!=""} and on (namespace, pod) (kube_pod_status_phase{phase="Running"} == 1))
              / sum by (resource) (kube_node_status_allocatable{resource=~"cpu|memory"})
          - record: swirl_cloud_capacity:node_requests:ratio
            expr: |
              sum by (node, resource) (kube_pod_container_resource_requests{resource=~"cpu|memory",node!=""} and on (namespace, pod) (kube_pod_status_phase{phase="Running"} == 1))
              / sum by (node, resource) (kube_node_status_allocatable{resource=~"cpu|memory"})
          # Requests against the capacity left after losing the largest server.
          - record: swirl_cloud_capacity:requests_after_node_loss:ratio
            expr: |
              (
                sum by (resource) (kube_pod_container_resource_requests{resource=~"cpu|memory",node!=""} and on (namespace, pod) (kube_pod_status_phase{phase="Running"} == 1))
                / (sum by (resource) (kube_node_status_allocatable{resource=~"cpu|memory"}) - max by (resource) (kube_node_status_allocatable{resource=~"cpu|memory"}))
              )
              and on () (count(kube_node_info) > 1)
          # CPU cores or memory bytes to add so requests stay below 70 %.
          - record: swirl_cloud_capacity:additional_needed
            expr: |
              clamp_min(
                sum by (resource) (kube_pod_container_resource_requests{resource=~"cpu|memory",node!=""} and on (namespace, pod) (kube_pod_status_phase{phase="Running"} == 1)) / 0.7
                - sum by (resource) (kube_node_status_allocatable{resource=~"cpu|memory"}),
                0
              )
          - record: swirl_cloud_capacity:filesystem_days_until_full
            expr: |
              node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}
              / -deriv(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}[6h]) / 86400 > 0
          - record: swirl_cloud_capacity:volume_days_until_full
            expr: |
              kubelet_volume_stats_available_bytes
              / -deriv(kubelet_volume_stats_available_bytes[6h]) / 86400 > 0
          - alert: ClusterCapacityRequestsHigh
            expr: swirl_cloud_capacity:requests:ratio > 0.9
            for: 30m
            labels:
              severity: warning
              owner: platform
            annotations:
              runbook_url: https://gitlab.__PUBLIC_DOMAIN__/__GITLAB_GROUP_PATH__/__GITLAB_PROJECT_NAME__/-/blob/main/docs/guides/alert-runbooks.md#clustercapacityrequestshigh
              summary: Cluster {{ $labels.resource }} requests are above 90 % of capacity
              description: 'Running pods request {{ $value | humanizePercentage }} of allocatable {{ $labels.resource }}; new or restarted pods may not schedule. See the Capacity Planning dashboard.'
          - alert: ClusterCannotSurviveNodeLoss
            expr: swirl_cloud_capacity:requests_after_node_loss:ratio > 1
            for: 1h
            labels:
              severity: warning
              owner: platform
            annotations:
              runbook_url: https://gitlab.__PUBLIC_DOMAIN__/__GITLAB_GROUP_PATH__/__GITLAB_PROJECT_NAME__/-/blob/main/docs/guides/alert-runbooks.md#clustercannotsurvivenodeloss
              summary: Workloads would not fit after losing the largest server
              description: 'Requested {{ $labels.resource }} is {{ $value | humanizePercentage }} of the capacity left without the largest server; a host failure would leave pods unscheduled.'
      # Cost showback (docs/guides/cost-showback.md): each server's monthly cost,
      # published by scripts/configure-node-cost.sh, is split 65 % CPU / 35 %
      # memory and allocated to running pods by the larger of request and usage.
      # What no pod uses is idle cost on that server.
      - name: swirl-cloud.cost
        interval: 1m
        rules:
          - record: swirl_cloud_cost_pod_cpu_cores
            expr: |
              sum by (node, namespace, pod) (
                max by (node, namespace, pod, container) (
                  (kube_pod_container_resource_requests{resource="cpu",node!=""}
                    and on (namespace, pod) (kube_pod_status_phase{phase="Running"} == 1))
                  or rate(container_cpu_usage_seconds_total{container!="",container!="POD"}[5m])
                )
              )
          - record: swirl_cloud_cost_pod_memory_bytes
            expr: |
              sum by (node, namespace, pod) (
                max by (node, namespace, pod, container) (
                  (kube_pod_container_resource_requests{resource="memory",node!=""}
                    and on (namespace, pod) (kube_pod_status_phase{phase="Running"} == 1))
                  or container_memory_working_set_bytes{container!="",container!="POD"}
                )
              )
          - record: swirl_cloud_cost_node_monthly
            expr: max by (node, currency) (swirl_cloud_node_monthly_cost)
          # Divide by capacity, or by the allocation when bursting pods exceed it,
          # so pod costs never add up to more than the server costs.
          - record: swirl_cloud_cost_cpu_core_monthly
            expr: |
              0.65 * swirl_cloud_cost_node_monthly
              / on (node) group_left max by (node) (
                kube_node_status_allocatable{resource="cpu"} or sum by (node) (swirl_cloud_cost_pod_cpu_cores)
              )
          - record: swirl_cloud_cost_memory_gib_monthly
            expr: |
              0.35 * swirl_cloud_cost_node_monthly
              / on (node) group_left max by (node) (
                kube_node_status_allocatable{resource="memory"} / 2^30 or sum by (node) (swirl_cloud_cost_pod_memory_bytes) / 2^30
              )
          - record: swirl_cloud_cost_pod_monthly
            expr: |
              swirl_cloud_cost_pod_cpu_cores * on (node) group_left (currency) swirl_cloud_cost_cpu_core_monthly
              + swirl_cloud_cost_pod_memory_bytes / 2^30 * on (node) group_left (currency) swirl_cloud_cost_memory_gib_monthly
          # Workload: the pod's app label, else its name without generated suffixes.
          - record: swirl_cloud_cost_workload_monthly
            expr: |
              sum by (namespace, workload, currency) (
                label_replace(
                  label_replace(
                    swirl_cloud_cost_pod_monthly
                    * on (namespace, pod) group_left (label_app) max by (namespace, pod, label_app) (kube_pod_labels),
                    "workload", "$1", "pod", "^(.+?)(-[a-f0-9]{32}|-[a-f0-9]{8,10})?(-[a-z0-9]{5}|-[0-9]+)?$"
                  ),
                  "workload", "$1", "label_app", "(.+)"
                )
              )
          - record: swirl_cloud_cost_namespace_monthly
            expr: sum by (namespace, currency) (swirl_cloud_cost_pod_monthly)
          - record: swirl_cloud_cost_idle_monthly
            expr: |
              clamp_min(
                swirl_cloud_cost_node_monthly
                - on (node, currency) (sum by (node, currency) (swirl_cloud_cost_pod_monthly) or swirl_cloud_cost_node_monthly * 0),
                0
              )
          - record: swirl_cloud_cost_shared_monthly
            expr: max by (item, currency) (swirl_cloud_shared_monthly_cost)
          - record: swirl_cloud_cost_total_monthly
            expr: |
              (
                sum by (currency) (swirl_cloud_cost_node_monthly)
                + on (currency) sum by (currency) (swirl_cloud_cost_shared_monthly)
              )
              or sum by (currency) (swirl_cloud_cost_node_monthly)

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: infra
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
    route:
      receiver: gitlab
      group_by: [alertname, namespace]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
    receivers:
      - name: gitlab
        webhook_configs:
          - send_resolved: true
            url: http://gitlab.__INTERNAL_DNS_ZONE__/__GITLAB_GROUP_PATH__/__GITLAB_PROJECT_NAME__/alerts/notify/cluster-prometheus/clusterprometheus.json
            http_config:
              authorization:
                type: Bearer
                credentials_file: /etc/alertmanager/secrets/token

---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: infra
spec:
  selector:
    app: alertmanager
  ports:
    - name: http
      port: 9093
      targetPort: http

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alertmanager
          image: quay.io/prometheus/alertmanager:v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
          ports:
            - name: http
              containerPort: 9093
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager/alertmanager.yml
              subPath: alertmanager.yml
              readOnly: true
            - name: credentials
              mountPath: /etc/alertmanager/secrets
              readOnly: true
            - name: data
              mountPath: /alertmanager
      volumes:
        - name: config
          configMap:
            name: alertmanager-config
        - name: credentials
          secret:
            secretName: monitoring-alert-credentials
            items:
              - key: token
                path: token
        - name: data
          emptyDir:
            sizeLimit: 128Mi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: infra
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn
  resources:
    requests:
      # Keep ample headroom above the 1500 MB TSDB retention limit because
      # WAL and memory-mapped head chunks are not covered by that limit.
      storage: 4Gi

---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: infra
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 9090
      targetPort: http
  selector:
    app: prometheus

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: infra
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
      annotations:
        # subPath mounts never refresh; roll Prometheus when its config changes.
        swirl-cloud.io/prometheus-config: pending
    spec:
      serviceAccountName: prometheus
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: docker.io/prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=15d
            - --storage.tsdb.retention.size=1500MB
            - --web.enable-lifecycle
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          # CPU peaked at 0.07 core over 6 h on 2026-10-05.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
            - name: config
              mountPath: /etc/prometheus/rules.yaml
              subPath: rules.yaml
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-data

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana
  namespace: infra

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: grafana-dashboard-reader
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: grafana-dashboard-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: grafana-dashboard-reader
subjects:
  - kind: ServiceAccount
    name: grafana
    namespace: infra

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: infra
data:
  datasources.yaml: |
    apiVersion: 1
    deleteDatasources:
      - name: Prometheus
        orgId: 1
      - name: Elasticsearch
        orgId: 1
      - name: Platform reports
        orgId: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.__INTERNAL_DNS_ZONE__:9090
        isDefault: true
        editable: false
        jsonData:
          prometheusType: Prometheus
          prometheusVersion: 3.14.0
          timeInterval: 15s
      - name: Elasticsearch
        uid: elasticsearch
        type: elasticsearch
        access: proxy
        url: http://elasticsearch.__INTERNAL_DNS_ZONE__:9200
        database: kubernetes-logs-*
        basicAuth: true
        basicAuthUser: $ELASTICSEARCH_USERNAME
        editable: false
        jsonData:
          timeField: "@timestamp"
          esVersion: 9.4.6
          logMessageField: message
          logLevelField: level
        secureJsonData:
          basicAuthPassword: $ELASTICSEARCH_PASSWORD
      - name: Platform reports
        uid: platform-reports
        type: elasticsearch
        access: proxy
        url: http://elasticsearch.__INTERNAL_DNS_ZONE__:9200
        database: platform-reports-*
        basicAuth: true
        basicAuthUser: $ELASTICSEARCH_USERNAME
        editable: false
        jsonData:
          timeField: "@timestamp"
          esVersion: 9.4.6
        secureJsonData:
          basicAuthPassword: $ELASTICSEARCH_PASSWORD

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: infra
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: Kubernetes
        orgId: 1
        folder: Kubernetes
        type: file
        disableDeletion: false
        allowUiUpdates: false
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards/kubernetes
      - name: Applications
        orgId: 1
        folder: Applications
        type: file
        disableDeletion: false
        allowUiUpdates: false
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards/applications
      - name: Discovered applications
        orgId: 1
        folder: Applications
        type: file
        # Keep historical dashboards when a workload is removed or Grafana restarts.
        disableDeletion: true
        allowUiUpdates: false
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards/discovered-applications

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-kubernetes-dashboard
  namespace: infra
data:
  kubernetes-overview.json: |
    {
      "uid": "kubernetes-overview",
      "title": "Kubernetes Cluster Overview",
      "tags": ["kubernetes", "cluster", "provisioned"],
      "timezone": "browser",
      "schemaVersion": 41,
      "version": 1,
      "refresh": "30s",
      "time": {"from": "now-6h", "to": "now"},
      "templating": {
        "list": [
          {
            "name": "namespace",
            "label": "Namespace",
            "type": "query",
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "query": {"query": "label_values(kube_namespace_created, namespace)", "refId": "PrometheusVariableQueryEditor-VariableQuery"},
            "includeAll": true,
            "allValue": ".*",
            "multi": true,
            "refresh": 1,
            "current": {"text": "All", "value": ["$__all"]}
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Nodes",
          "gridPos": {"x": 0, "y": 0, "w": 4, "h": 4},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "count(kube_node_info)", "instant": true}],
          "fieldConfig": {"defaults": {"unit": "short", "thresholds": {"mode": "absolute", "steps": [{"color": "red"}, {"color": "green", "value": 1}]}}, "overrides": []},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "values": false}, "colorMode": "value", "graphMode": "none"}
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Running Pods",
          "gridPos": {"x": 4, "y": 0, "w": 4, "h": 4},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "sum(kube_pod_status_phase{namespace=~\"$namespace\",phase=\"Running\"})", "instant": true}],
          "fieldConfig": {"defaults": {"unit": "short", "color": {"mode": "fixed", "fixedColor": "green"}}, "overrides": []},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "values": false}, "colorMode": "value", "graphMode": "none"}
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Unhealthy Pods",
          "gridPos": {"x": 8, "y": 0, "w": 4, "h": 4},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "sum(kube_pod_status_phase{namespace=~\"$namespace\",phase=~\"Pending|Failed|Unknown\"})", "instant": true}],
          "fieldConfig": {"defaults": {"unit": "short", "thresholds": {"mode": "absolute", "steps": [{"color": "green"}, {"color": "red", "value": 1}]}}, "overrides": []},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "values": false}, "colorMode": "value", "graphMode": "none"}
        },
        {
          "id": 4,
          "type": "stat",
          "title": "CPU Used",
          "gridPos": {"x": 12, "y": 0, "w": 4, "h": 4},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "100 * sum(rate(container_cpu_usage_seconds_total{container!=\"\",image!=\"\"}[5m])) / sum(machine_cpu_cores)", "instant": true}],
          "fieldConfig": {"defaults": {"unit": "percent", "min": 0, "max": 100}, "overrides": []},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "values": false}, "colorMode": "value", "graphMode": "area"}
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Memory Used",
          "gridPos": {"x": 16, "y": 0, "w": 4, "h": 4},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "100 * sum(container_memory_working_set_bytes{container!=\"\",image!=\"\"}) / sum(machine_memory_bytes)", "instant": true}],
          "fieldConfig": {"defaults": {"unit": "percent", "min": 0, "max": 100}, "overrides": []},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "values": false}, "colorMode": "value", "graphMode": "area"}
        },
        {
          "id": 6,
          "type": "stat",
          "title": "Restarts (1h)",
          "gridPos": {"x": 20, "y": 0, "w": 4, "h": 4},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=~\"$namespace\"}[1h]))", "instant": true}],
          "fieldConfig": {"defaults": {"unit": "short", "thresholds": {"mode": "absolute", "steps": [{"color": "green"}, {"color": "orange", "value": 1}, {"color": "red", "value": 5}]}}, "overrides": []},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "values": false}, "colorMode": "value", "graphMode": "none"}
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "CPU Usage by Namespace",
          "gridPos": {"x": 0, "y": 4, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "sum by (namespace) (rate(container_cpu_usage_seconds_total{namespace=~\"$namespace\",container!=\"\",image!=\"\"}[5m]))", "legendFormat": "{{namespace}}"}],
          "fieldConfig": {"defaults": {"unit": "cores"}, "overrides": []},
          "options": {"legend": {"displayMode": "table", "placement": "bottom"}}
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Memory Usage by Namespace",
          "gridPos": {"x": 12, "y": 4, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "sum by (namespace) (container_memory_working_set_bytes{namespace=~\"$namespace\",container!=\"\",image!=\"\"})", "legendFormat": "{{namespace}}"}],
          "fieldConfig": {"defaults": {"unit": "bytes"}, "overrides": []},
          "options": {"legend": {"displayMode": "table", "placement": "bottom"}}
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Node CPU Utilization",
          "gridPos": {"x": 0, "y": 12, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "100 - (avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)", "legendFormat": "{{instance}}"}],
          "fieldConfig": {"defaults": {"unit": "percent", "min": 0, "max": 100}, "overrides": []},
          "options": {"legend": {"displayMode": "table", "placement": "bottom"}}
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Node Memory Utilization",
          "gridPos": {"x": 12, "y": 12, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)", "legendFormat": "{{instance}}"}],
          "fieldConfig": {"defaults": {"unit": "percent", "min": 0, "max": 100}, "overrides": []},
          "options": {"legend": {"displayMode": "table", "placement": "bottom"}}
        },
        {
          "id": 11,
          "type": "table",
          "title": "Deployment Availability",
          "gridPos": {"x": 0, "y": 20, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {"refId": "A", "expr": "kube_deployment_status_replicas_available{namespace=~\"$namespace\"}", "legendFormat": "{{namespace}} / {{deployment}}", "instant": true, "format": "table"}
          ],
          "options": {"showHeader": true}
        },
        {
          "id": 12,
          "type": "table",
          "title": "Persistent Volume Claims",
          "gridPos": {"x": 12, "y": 20, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "kube_persistentvolumeclaim_status_phase{namespace=~\"$namespace\",phase=\"Bound\"} == 1", "legendFormat": "{{namespace}} / {{persistentvolumeclaim}}", "instant": true, "format": "table"}],
          "options": {"showHeader": true}
        }
      ]
    }

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: infra
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi

---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: infra
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3000
      targetPort: http
  selector:
    app: grafana

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: infra
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
      annotations:
        swirl-cloud.io/application-observability: pending
        # Bump when grafana-datasources changes; Grafana reads them at startup.
        swirl-cloud.io/datasources-version: "2"
    spec:
      serviceAccountName: grafana
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
        runAsUser: 10001
        runAsGroup: 10001
      initContainers:
        # File providers stop initializing when a sidecar's directory is absent.
        - name: prepare-dashboard-directories
          image: docker.io/library/node:24.21.0-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
          command:
            - node
            - -e
            - "const fs=require('node:fs'); for(const directory of ['applications','discovered-applications']) fs.mkdirSync('/var/lib/grafana/dashboards/'+directory,{recursive:true});"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: dashboard-files
              mountPath: /var/lib/grafana/dashboards
      containers:
        - name: grafana
          image: docker.io/grafana/grafana:13.2.2-distroless@sha256:69a5d2d957ca0bba434c160dcd4f2d07de9d6c756a0ba10ae7f52b72ced1e4cc
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin-secret
                  key: GF_SECURITY_ADMIN_PASSWORD
            - name: GF_SERVER_ROOT_URL
              value: https://grafana.__PUBLIC_DOMAIN__
            # No usage reports, update checks, news feed or Gravatar requests
            # leave the installation (docs/guides/external-services.md).
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES
              value: "false"
            - name: GF_NEWS_NEWS_FEED_ENABLED
              value: "false"
            - name: GF_SECURITY_DISABLE_GRAVATAR
              value: "true"
            - name: GF_AUTH_BASIC_ENABLED
              value: "false"
            - name: GF_AUTH_GENERIC_OAUTH_ENABLED
              value: "true"
            - name: GF_AUTH_GENERIC_OAUTH_NAME
              value: Keycloak
            - name: GF_AUTH_GENERIC_OAUTH_AUTO_LOGIN
              value: "true"
            - name: GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP
              value: "true"
            - name: GF_AUTH_GENERIC_OAUTH_CLIENT_ID
              value: grafana
            - name: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-sso-credentials
                  key: GRAFANA_CLIENT_SECRET
            - name: GF_AUTH_GENERIC_OAUTH_SCOPES
              value: openid profile email groups
            - name: GF_AUTH_GENERIC_OAUTH_AUTH_URL
              value: https://keycloak.__PUBLIC_DOMAIN__/auth/realms/__KEYCLOAK_REALM__/protocol/openid-connect/auth
            - name: GF_AUTH_GENERIC_OAUTH_TOKEN_URL
              value: https://keycloak.__PUBLIC_DOMAIN__/auth/realms/__KEYCLOAK_REALM__/protocol/openid-connect/token
            - name: GF_AUTH_GENERIC_OAUTH_API_URL
              value: https://keycloak.__PUBLIC_DOMAIN__/auth/realms/__KEYCLOAK_REALM__/protocol/openid-connect/userinfo
            - name: GF_AUTH_GENERIC_OAUTH_USE_PKCE
              value: "true"
            - name: GF_AUTH_GENERIC_OAUTH_USE_REFRESH_TOKEN
              value: "true"
            - name: GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH
              value: "contains(groups[*], 'platform-admins') && 'GrafanaAdmin' || 'Viewer'"
            - name: GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN
              value: "true"
            - name: GF_AUTH_SIGNOUT_REDIRECT_URL
              value: https://keycloak.__PUBLIC_DOMAIN__/auth/realms/__KEYCLOAK_REALM__/protocol/openid-connect/logout?post_logout_redirect_uri=https%3A%2F%2Fgrafana.__PUBLIC_DOMAIN__%2F
            - name: ELASTICSEARCH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: grafana-elasticsearch-credentials
                  key: ELASTICSEARCH_USERNAME
            - name: ELASTICSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-elasticsearch-credentials
                  key: ELASTICSEARCH_PASSWORD
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: "1"
              memory: 768Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources/datasources.yaml
              subPath: datasources.yaml
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml
              subPath: dashboards.yaml
            - name: dashboard-files
              mountPath: /var/lib/grafana/dashboards
            - name: kubernetes-dashboard
              mountPath: /var/lib/grafana/dashboards/kubernetes
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: grafana-logs
              mountPath: /var/log/grafana
        - name: application-discovery
          image: docker.io/library/node:24.21.0-alpine@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
          command: [node, /application-discovery/discovery.mjs]
          env:
            - name: DISCOVERY_INTERVAL_SECONDS
              value: "60"
            - name: DASHBOARD_DIRECTORY
              value: /var/lib/grafana/dashboards/discovered-applications
            - name: KIBANA_URL
              value: http://kibana.__INTERNAL_DNS_ZONE__:5601
            - name: KIBANA_PUBLIC_URL
              value: https://kibana.__PUBLIC_DOMAIN__
          envFrom:
            - secretRef:
                name: kibana-bootstrap-credentials
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi
          volumeMounts:
            - name: application-discovery
              mountPath: /application-discovery
              readOnly: true
            - name: dashboard-files
              mountPath: /var/lib/grafana/dashboards
        - name: dashboard-sidecar
          image: ghcr.io/kiwigrid/k8s-sidecar:2.11.2@sha256:2912be006f62f9ea080194cf6d3afcd90daead8d101d0ba686a137a849f6a4f6
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          env:
            - name: METHOD
              value: WATCH
            - name: LABEL
              value: grafana_dashboard
            - name: LABEL_VALUE
              value: "1"
            - name: NAMESPACE
              value: ALL
            - name: RESOURCE
              value: configmap
            - name: FOLDER
              value: /var/lib/grafana/dashboards/applications
            - name: UNIQUE_FILENAMES
              value: "true"
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: dashboard-files
              mountPath: /var/lib/grafana/dashboards
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: grafana-data
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboard-files
          emptyDir: {}
        - name: application-discovery
          configMap:
            name: application-observability-discovery
        - name: kubernetes-dashboard
          configMap:
            name: grafana-kubernetes-dashboard
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: grafana-logs
          emptyDir:
            sizeLimit: 256Mi

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-capacity-planning-dashboard
  namespace: infra
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: swirl-cloud
data:
  capacity-planning.json: |
    {
      "uid": "capacity-planning",
      "title": "Capacity Planning",
      "description": "Requested and used CPU and memory against capacity, headroom after losing the largest server, capacity to add, and storage time to full.",
      "tags": [
        "capacity",
        "planning",
        "provisioned"
      ],
      "timezone": "browser",
      "schemaVersion": 41,
      "version": 1,
      "refresh": "5m",
      "time": {
        "from": "now-12h",
        "to": "now"
      },
      "templating": {
        "list": []
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "CPU requested",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "swirl_cloud_capacity:requests:ratio{resource=\"cpu\"}",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.7
                  },
                  {
                    "color": "red",
                    "value": 0.9
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "auto",
            "orientation": "auto"
          },
          "description": "Share of allocatable CPU reserved by running pods."
        },
        {
          "id": 2,
          "type": "stat",
          "title": "CPU used",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 4,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(rate(container_cpu_usage_seconds_total{container!=\"\",container!=\"POD\"}[5m])) / sum(kube_node_status_allocatable{resource=\"cpu\"})",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.7
                  },
                  {
                    "color": "red",
                    "value": 0.9
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "auto",
            "orientation": "auto"
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Memory requested",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 8,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "swirl_cloud_capacity:requests:ratio{resource=\"memory\"}",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.7
                  },
                  {
                    "color": "red",
                    "value": 0.9
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "auto",
            "orientation": "auto"
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Memory used",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 12,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(container_memory_working_set_bytes{container!=\"\",container!=\"POD\"}) / sum(kube_node_status_allocatable{resource=\"memory\"})",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.7
                  },
                  {
                    "color": "red",
                    "value": 0.9
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "auto",
            "orientation": "auto"
          }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "CPU cores to add",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 16,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "swirl_cloud_capacity:additional_needed{resource=\"cpu\"}",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 1,
              "color": {
                "mode": "fixed",
                "fixedColor": "text"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "auto",
            "orientation": "auto"
          },
          "description": "Cores to add so requests stay below 70 %; 0 means none."
        },
        {
          "id": 6,
          "type": "stat",
          "title": "Memory to add",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 20,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "swirl_cloud_capacity:additional_needed{resource=\"memory\"}",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "decimals": 1,
              "color": {
                "mode": "fixed",
                "fixedColor": "text"
              }
            },
            "overrides": []
          },
