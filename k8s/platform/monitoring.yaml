                {
                  "id": "2",
                  "type": "terms",
                  "field": "control",
                  "settings": {
                    "min_doc_count": "1",
                    "size": "500",
                    "order": "asc",
                    "orderBy": "_term"
                  }
                }
              ],
              "timeField": "@timestamp"
            }
          ],
          "options": {
            "showHeader": true,
            "cellHeight": "sm",
            "footer": {
              "show": false
            },
            "sortBy": [
              {
                "displayName": "Hours passing",
                "desc": false
              }
            ]
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "filterable": true,
                "align": "auto"
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
