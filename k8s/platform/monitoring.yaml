# Longhorn limits its manager API to Longhorn components. Admit Prometheus to
# the manager port only, which also serves /metrics.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: longhorn-manager-metrics
  namespace: longhorn-system
spec:
  podSelector:
    matchLabels:
      app: longhorn-manager
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: infra
          podSelector:
            matchLabels:
              app: prometheus
      ports:
        - protocol: TCP
          port: 9500

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: infra
data:
  prometheus.yml: |
    # swirl-cloud:file prometheus/prometheus.yml

  rules.yaml: |
    # swirl-cloud:file prometheus/rules.yaml

---
# Alertmanager configuration, rendered from the platform mail relay in Vault
# infra/smtp (ADR 0029). Notifications are paused: every alert routes to the
# "paused" receiver, which sends nothing; restoring the gitlab and email routes
# needs the owner's approval (TODO.md §14). With mail off, "email" has no target.
# scripts/configure-platform-mail.py restarts Alertmanager after a change.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-config
  namespace: infra
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: alertmanager-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        alertmanager.yml: |
          global:
            resolve_timeout: 5m
          {{- if eq .enabled "true" }}
            smtp_smarthost: {{ printf "%s:%s" .host .port | quote }}
            smtp_from: {{ if .from_name }}{{ printf "%s <%s>" (.from_name | quote) .from_address | quote }}{{ else }}{{ .from_address | quote }}{{ end }}
            smtp_hello: {{ splitList "@" .from_address | last | quote }}
            smtp_auth_username: {{ .username | quote }}
            smtp_auth_password: {{ .password | quote }}
            smtp_require_tls: true
            smtp_force_implicit_tls: {{ eq .tls "ssl" }}
          {{- end }}
          route:
            receiver: paused
            group_by: [alertname, namespace]
            group_wait: 30s
            group_interval: 5m
            repeat_interval: 4h
          receivers:
            - name: paused
            - name: gitlab
              webhook_configs:
                - send_resolved: true
                  url: http://gitlab.__INTERNAL_DNS_ZONE__/__GITLAB_GROUP_PATH__/__GITLAB_PROJECT_NAME__/alerts/notify/cluster-prometheus/clusterprometheus.json
                  http_config:
                    authorization:
                      type: Bearer
                      credentials_file: /etc/alertmanager/secrets/token
            - name: email
          {{- if and (eq .enabled "true") .alert_to }}
              email_configs:
                - to: {{ .alert_to | quote }}
                  send_resolved: true
          {{- end }}
  dataFrom:
    - extract:
        key: infra/smtp

---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: infra
spec:
  selector:
    app: alertmanager
  ports:
    - name: http
      port: 9093
      targetPort: http

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
      annotations:
        # Delivery counters feed the AlertNotificationsFailing alert.
        prometheus.io/scrape: "true"
        prometheus.io/port: "9093"
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alertmanager
          image: quay.io/prometheus/alertmanager:v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
          args:
            - --config.file=/etc/alertmanager/config/alertmanager.yml
            - --storage.path=/alertmanager
          ports:
            - name: http
              containerPort: 9093
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager/config
              readOnly: true
            - name: credentials
              mountPath: /etc/alertmanager/secrets
              readOnly: true
            - name: data
              mountPath: /alertmanager
      volumes:
        - name: config
          secret:
            secretName: alertmanager-config
            items:
              - key: alertmanager.yml
                path: alertmanager.yml
        - name: credentials
          secret:
            secretName: monitoring-alert-credentials
            items:
              - key: token
                path: token
        - name: data
          emptyDir:
            sizeLimit: 128Mi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: infra
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn
  resources:
    requests:
      # Headroom above the 1500 MB retention size, which excludes the WAL and
      # memory-mapped head chunks.
      storage: 4Gi

---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: infra
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 9090
      targetPort: http
  selector:
    app: prometheus

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: infra
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
      annotations:
        # subPath mounts never refresh; roll Prometheus when its config changes.
        swirl-cloud.io/prometheus-config: pending
    spec:
      serviceAccountName: prometheus
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: docker.io/prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=15d
            - --storage.tsdb.retention.size=1500MB
            - --web.enable-lifecycle
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
          # CPU peaked at 0.07 core over 6 h on 2026-10-05. The CPU limit sets
          # GOMAXPROCS: with one, a chunk read stalled on disk freezes every
          # handler, probes included.
          resources:
            requests:
              cpu: 100m
              memory: 768Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
            - name: config
              mountPath: /etc/prometheus/rules.yaml
              subPath: rules.yaml
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-data

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana
  namespace: infra

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: grafana-dashboard-reader
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: grafana-dashboard-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: grafana-dashboard-reader
subjects:
  - kind: ServiceAccount
    name: grafana
    namespace: infra

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: infra
data:
  datasources.yaml: |
    apiVersion: 1
    deleteDatasources:
      - name: Prometheus
        orgId: 1
      - name: Elasticsearch
        orgId: 1
      - name: Platform reports
        orgId: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.__INTERNAL_DNS_ZONE__:9090
        isDefault: true
        editable: false
        jsonData:
          prometheusType: Prometheus
          prometheusVersion: 3.14.0
          timeInterval: 15s
      - name: Elasticsearch
        uid: elasticsearch
        type: elasticsearch
        access: proxy
        url: http://elasticsearch.__INTERNAL_DNS_ZONE__:9200
        database: kubernetes-logs-*
        basicAuth: true
        basicAuthUser: $ELASTICSEARCH_USERNAME
        editable: false
        jsonData:
          timeField: "@timestamp"
          esVersion: 9.4.6
          logMessageField: message
          logLevelField: level
        secureJsonData:
          basicAuthPassword: $ELASTICSEARCH_PASSWORD
      - name: Platform reports
        uid: platform-reports
        type: elasticsearch
        access: proxy
        url: http://elasticsearch.__INTERNAL_DNS_ZONE__:9200
        database: platform-reports-*
        basicAuth: true
        basicAuthUser: $ELASTICSEARCH_USERNAME
        editable: false
        jsonData:
          timeField: "@timestamp"
          esVersion: 9.4.6
        secureJsonData:
          basicAuthPassword: $ELASTICSEARCH_PASSWORD

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: infra
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: Kubernetes
        orgId: 1
        folder: Kubernetes
        type: file
        disableDeletion: false
        allowUiUpdates: false
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards/kubernetes
      - name: Applications
        orgId: 1
        folder: Applications
        type: file
        disableDeletion: false
        allowUiUpdates: false
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards/applications
      - name: Discovered applications
        orgId: 1
        folder: Applications
        type: file
        # Keep historical dashboards when a workload is removed or Grafana restarts.
        disableDeletion: true
        allowUiUpdates: false
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards/discovered-applications

