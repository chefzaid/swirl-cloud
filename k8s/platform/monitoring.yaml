---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: infra
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
      annotations:
        swirl-cloud.io/application-observability: pending
        # Bump when grafana-datasources changes; Grafana reads them at startup.
        swirl-cloud.io/datasources-version: "2"
    spec:
      serviceAccountName: grafana
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
        runAsUser: 10001
        runAsGroup: 10001
      initContainers:
        # File providers stop initializing when a sidecar's directory is absent.
        - name: prepare-dashboard-directories
          image: docker.io/library/node:24.22.1-alpine@sha256:06d7adf3e0ef61a13f1d28682726366f97a15aa1888c934d3ecec86c33918b53
          command:
            - node
            - -e
            - "const fs=require('node:fs'); for(const directory of ['applications','discovered-applications']) fs.mkdirSync('/var/lib/grafana/dashboards/'+directory,{recursive:true});"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: dashboard-files
              mountPath: /var/lib/grafana/dashboards
      containers:
        - name: grafana
          image: docker.io/grafana/grafana:13.2.4-distroless@sha256:ae3d3add290adbe6a88412229f5d76fd7bb82743050881698642d3d62f277e35
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin-secret
                  key: GF_SECURITY_ADMIN_PASSWORD
            - name: GF_SERVER_ROOT_URL
              value: https://grafana.__PUBLIC_DOMAIN__
            # No usage reports, update checks, news feed or Gravatar requests
            # leave the installation (docs/guides/external-services.md).
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES
              value: "false"
            - name: GF_NEWS_NEWS_FEED_ENABLED
              value: "false"
            - name: GF_SECURITY_DISABLE_GRAVATAR
              value: "true"
            - name: GF_AUTH_BASIC_ENABLED
              value: "false"
            - name: GF_AUTH_GENERIC_OAUTH_ENABLED
              value: "true"
            - name: GF_AUTH_GENERIC_OAUTH_NAME
              value: Keycloak
            - name: GF_AUTH_GENERIC_OAUTH_AUTO_LOGIN
              value: "true"
            - name: GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP
              value: "true"
            - name: GF_AUTH_GENERIC_OAUTH_CLIENT_ID
              value: grafana
            - name: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-sso-credentials
                  key: GRAFANA_CLIENT_SECRET
            - name: GF_AUTH_GENERIC_OAUTH_SCOPES
              value: openid profile email groups
            - name: GF_AUTH_GENERIC_OAUTH_AUTH_URL
              value: https://keycloak.__PUBLIC_DOMAIN__/auth/realms/__KEYCLOAK_REALM__/protocol/openid-connect/auth
            - name: GF_AUTH_GENERIC_OAUTH_TOKEN_URL
              value: https://keycloak.__PUBLIC_DOMAIN__/auth/realms/__KEYCLOAK_REALM__/protocol/openid-connect/token
            - name: GF_AUTH_GENERIC_OAUTH_API_URL
              value: https://keycloak.__PUBLIC_DOMAIN__/auth/realms/__KEYCLOAK_REALM__/protocol/openid-connect/userinfo
            - name: GF_AUTH_GENERIC_OAUTH_USE_PKCE
              value: "true"
            - name: GF_AUTH_GENERIC_OAUTH_USE_REFRESH_TOKEN
              value: "true"
            - name: GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH
              value: "contains(groups[*], 'platform-admins') && 'GrafanaAdmin' || 'Viewer'"
            - name: GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN
              value: "true"
            - name: GF_AUTH_SIGNOUT_REDIRECT_URL
              value: https://keycloak.__PUBLIC_DOMAIN__/auth/realms/__KEYCLOAK_REALM__/protocol/openid-connect/logout?post_logout_redirect_uri=https%3A%2F%2Fgrafana.__PUBLIC_DOMAIN__%2F
            - name: ELASTICSEARCH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: grafana-elasticsearch-credentials
                  key: ELASTICSEARCH_USERNAME
            - name: ELASTICSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-elasticsearch-credentials
                  key: ELASTICSEARCH_PASSWORD
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: "1"
              memory: 768Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources/datasources.yaml
              subPath: datasources.yaml
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml
              subPath: dashboards.yaml
            - name: dashboard-files
              mountPath: /var/lib/grafana/dashboards
            - name: kubernetes-dashboard
              mountPath: /var/lib/grafana/dashboards/kubernetes
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: grafana-logs
              mountPath: /var/log/grafana
        - name: application-discovery
          image: docker.io/library/node:24.22.1-alpine@sha256:06d7adf3e0ef61a13f1d28682726366f97a15aa1888c934d3ecec86c33918b53
          command: [node, /application-discovery/discovery.mjs]
          env:
            - name: DISCOVERY_INTERVAL_SECONDS
              value: "60"
            - name: DASHBOARD_DIRECTORY
              value: /var/lib/grafana/dashboards/discovered-applications
            - name: KIBANA_URL
              value: http://kibana.__INTERNAL_DNS_ZONE__:5601
            - name: KIBANA_PUBLIC_URL
              value: https://kibana.__PUBLIC_DOMAIN__
          envFrom:
            - secretRef:
                name: kibana-bootstrap-credentials
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi
          volumeMounts:
            - name: application-discovery
              mountPath: /application-discovery
              readOnly: true
            - name: dashboard-files
              mountPath: /var/lib/grafana/dashboards
        - name: dashboard-sidecar
          image: ghcr.io/kiwigrid/k8s-sidecar:2.11.2@sha256:2912be006f62f9ea080194cf6d3afcd90daead8d101d0ba686a137a849f6a4f6
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          env:
            - name: METHOD
              value: WATCH
            - name: LABEL
              value: grafana_dashboard
            - name: LABEL_VALUE
              value: "1"
            - name: NAMESPACE
              value: ALL
            - name: RESOURCE
              value: configmap
            - name: FOLDER
              value: /var/lib/grafana/dashboards/applications
            - name: UNIQUE_FILENAMES
              value: "true"
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: dashboard-files
              mountPath: /var/lib/grafana/dashboards
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: grafana-data
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboard-files
          emptyDir: {}
        - name: application-discovery
          configMap:
            name: application-observability-discovery
        - name: kubernetes-dashboard
          configMap:
            name: grafana-kubernetes-dashboard
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: grafana-logs
          emptyDir:
            sizeLimit: 256Mi

