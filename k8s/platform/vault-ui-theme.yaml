apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault-ui-theme
  namespace: infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vault-ui-theme
  template:
    metadata:
      labels:
        app: vault-ui-theme
      annotations:
        theme.__PUBLIC_DOMAIN__/config-revision: "1"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ui-theme
          image: docker.io/library/nginx:1.30.5-alpine@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
          command: ["/usr/sbin/nginx", "-c", "/theme/nginx.conf", "-g", "daemon off;"]
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          volumeMounts:
            - name: theme
              mountPath: /theme
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: theme
          configMap:
            name: vault-ui-theme
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 8Mi
---
apiVersion: v1
kind: Service
metadata:
  name: vault-ui-theme
  namespace: infra
spec:
  selector:
    app: vault-ui-theme
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vault-ui-theme
  namespace: infra
spec:
  podSelector:
    matchLabels:
      app: vault-ui-theme
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 8080
          protocol: TCP
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vault
      ports:
        - port: 8200
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
# Only the UI path goes through the theme helper; vault-ingress routes /v1
# (all authenticated APIs) directly to Vault.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vault-ui-theme
  namespace: infra
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: infra-platform-body-limit@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - vault.__PUBLIC_DOMAIN__
      secretName: __TLS_SECRET_NAME__
  rules:
    - host: vault.__PUBLIC_DOMAIN__
      http:
        paths:
          - path: /ui
            pathType: Prefix
            backend:
              service:
                name: vault-ui-theme
                port:
                  number: 8080

---
# Same pinned Dark Reader site API and CSP adjustment as Sonar; see docs/operations.md#ui-themes.
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-ui-theme
  namespace: infra
  annotations:
    upstream.repository: https://github.com/darkreader/darkreader
    upstream.version: 4.9.130
    upstream.integrity: sha512-hLYjyUszzRc7n+EGbK+LYJV9uCp0JwwvRNgXgKyMkqCoetwkheefWUIxbxKiqQaSWLrCQuQuv55f2cHQMopJ2w==
data:
  darkreader.js: |
    # swirl-cloud:file darkreader/darkreader.js
  LICENSE: |
    # swirl-cloud:file darkreader/LICENSE
  theme.js: |
    /* Platform Vault theme: local assets, dark by default, per-browser opt-out. */
    (() => {
      'use strict';
      const preferenceKey = 'platform.vault.theme';
      let dark = true;
      try { dark = localStorage.getItem(preferenceKey) !== 'light'; } catch {}
      const reader = window.DarkReader;
      if (!reader) return;
      reader.setFetchMethod((url) => {
        const target = new URL(url, location.href);
        if (target.origin !== location.origin) {
          return Promise.reject(new Error('Theme assets must use the Vault origin'));
        }
        return fetch(target, { credentials: 'same-origin' });
      });
      const apply = () => {
        if (dark) {
          reader.enable({
            brightness: 100, contrast: 100, sepia: 0,
            darkSchemeBackgroundColor: '#181c25',
            darkSchemeTextColor: '#e6eaf2',
          }, { ignoreImageAnalysis: ['*'] });
        } else {
          reader.disable();
        }
      };
      apply();
      document.addEventListener('DOMContentLoaded', () => {
        const button = document.createElement('button');
        button.id = 'platform-theme-toggle';
        button.type = 'button';
        button.setAttribute('aria-label', 'Dark theme');
        const updateButton = () => {
          button.textContent = dark ? '☾ Dark' : '☀ Light';
          button.setAttribute('aria-pressed', String(dark));
          button.title = dark ? 'Switch to light theme' : 'Switch to dark theme';
        };
        button.addEventListener('click', () => {
          dark = !dark;
          try { localStorage.setItem(preferenceKey, dark ? 'dark' : 'light'); } catch {}
          apply();
          updateButton();
        });
        updateButton();
        document.body.append(button);
      }, { once: true });
    })();
  theme.css: |
    #platform-theme-toggle {
      position: fixed;
      right: 1rem;
      bottom: 0.75rem;
      z-index: 1000;
      padding: 0.4rem 0.75rem;
      border: 1px solid #63728a;
      border-radius: 1rem;
      color: #293447;
      background: #f4f6fa;
      font: 600 12px/1.4 system-ui, sans-serif;
      cursor: pointer;
      box-shadow: 0 2px 8px #0002;
    }
    #platform-theme-toggle:focus-visible {
      outline: 2px solid #397ee5;
      outline-offset: 3px;
    }
  nginx.conf: |
    worker_processes 1;
    pid /tmp/nginx.pid;
    error_log /dev/stderr warn;
    events { worker_connections 256; }
    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;
        access_log off;
        server_tokens off;
        client_body_temp_path /tmp/client;
        proxy_temp_path /tmp/proxy;
        fastcgi_temp_path /tmp/fastcgi;
        uwsgi_temp_path /tmp/uwsgi;
        scgi_temp_path /tmp/scgi;
        server {
            listen 8080;
            client_max_body_size 64k;
            location = /healthz { return 200 'ok\n'; }
            location = /ui { return 302 /ui/; }
            location = /ui/_platform/darkreader.js {
                alias /theme/darkreader.js;
                default_type application/javascript;
                add_header X-Content-Type-Options nosniff;
            }
            location = /ui/_platform/theme.js {
                alias /theme/theme.js;
                default_type application/javascript;
                add_header X-Content-Type-Options nosniff;
            }
            location = /ui/_platform/theme.css {
                alias /theme/theme.css;
                default_type text/css;
                add_header X-Content-Type-Options nosniff;
            }
            location = /ui/_platform/LICENSE {
                alias /theme/LICENSE;
                default_type text/plain;
            }
            location /ui/_platform/ { return 404; }
            location /ui/ {
                limit_except GET { deny all; }
                # Vault's embedded UI assets are public. Keep credentials and bodies
                # out of this presentation layer's upstream requests.
                proxy_pass_request_headers off;
                proxy_pass_request_body off;
                proxy_set_header Host $host;
                proxy_set_header Content-Length "";
                proxy_set_header Accept-Encoding "";
                proxy_set_header Connection "";
                proxy_http_version 1.1;
                proxy_buffering off;
                proxy_max_temp_file_size 0;
                proxy_connect_timeout 5s;
                proxy_read_timeout 30s;
                proxy_pass http://vault.__INTERNAL_DNS_ZONE__:8200;
                sub_filter '</head>' '<link rel="stylesheet" href="/ui/_platform/theme.css?v=1"><script src="/ui/_platform/darkreader.js?v=1"></script><script src="/ui/_platform/theme.js?v=1"></script></head>';
                sub_filter_once on;
            }
            location / { return 404; }
        }
    }
