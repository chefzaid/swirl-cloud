apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dbgate-pvc
  namespace: infra
spec:
  storageClassName: longhorn
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: dbgate
  namespace: infra
  labels:
    app: dbgate
spec:
  type: ClusterIP
  selector:
    app: dbgate
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dbgate
  namespace: infra
  labels:
    app: dbgate
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dbgate
  template:
    metadata:
      labels:
        app: dbgate
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dbgate
          image: docker.io/dbgate/dbgate:7.3.2@sha256:fc68e7c433963bff17af7372ce87f4b94873551a1c1b124220c8c04a22a80311
          # Kubernetes owns /etc/hosts; bypass the upstream Docker wrapper.
          command: ["node"]
          args: ["bundle.js", "--listen-api"]
          workingDir: /home/dbgate-docker
          ports:
            - containerPort: 3000
          env:
            - name: WORKSPACE_DIR
              value: /home/node/.dbgate
            # DBGate signs its sessions with a per-process key; Keycloak login
            # lets the browser re-authenticate silently after any restart.
            - name: OAUTH_AUTH
              value: "https://keycloak.__PUBLIC_DOMAIN__/auth/realms/__KEYCLOAK_REALM__/protocol/openid-connect/auth"
            - name: OAUTH_TOKEN
              value: "http://keycloak.__INTERNAL_DNS_ZONE__:8080/auth/realms/__KEYCLOAK_REALM__/protocol/openid-connect/token"
            - name: OAUTH_LOGOUT
              value: "https://keycloak.__PUBLIC_DOMAIN__/auth/realms/__KEYCLOAK_REALM__/protocol/openid-connect/logout"
            - name: OAUTH_CLIENT_ID
              value: dbgate
            - name: OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-sso-credentials
                  key: DBGATE_CLIENT_SECRET
            - name: OAUTH_SCOPE
              value: "openid profile email"
            - name: OAUTH_LOGIN_FIELD
              value: preferred_username
            - name: OAUTH_GROUP_FIELD
              value: groups
            - name: OAUTH_ALLOWED_GROUPS
              value: platform-admins
            - name: CONNECTIONS
              value: "postgres,mongodb,redis"
            - name: LABEL_postgres
              value: "PostgreSQL cluster"
            - name: SERVER_postgres
              value: "postgres.__INTERNAL_DNS_ZONE__"
            - name: PORT_postgres
              value: "5432"
            - name: ENGINE_postgres
              value: "postgres@dbgate-plugin-postgres"
            - name: USER_postgres
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: PASSWORD_postgres
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: LABEL_mongodb
              value: "MongoDB"
            - name: SERVER_mongodb
              value: "mongodb.__INTERNAL_DNS_ZONE__"
            - name: PORT_mongodb
              value: "27017"
            - name: ENGINE_mongodb
              value: "mongo@dbgate-plugin-mongo"
            - name: USER_mongodb
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: MONGO_INITDB_ROOT_USERNAME
            - name: PASSWORD_mongodb
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: MONGO_INITDB_ROOT_PASSWORD
            - name: LABEL_redis
              value: "Redis"
            - name: SERVER_redis
              value: "redis.__INTERNAL_DNS_ZONE__"
            - name: PORT_redis
              value: "6379"
            - name: ENGINE_redis
              value: "redis@dbgate-plugin-redis"
            - name: USER_redis
              valueFrom:
                secretKeyRef:
                  name: application-redis-legacy-auth
                  key: username
                  optional: true
            - name: PASSWORD_redis
              valueFrom:
                secretKeyRef:
                  name: application-redis-legacy-auth
                  key: password
                  optional: true
          volumeMounts:
            - name: dbgate-data
              mountPath: /home/node/.dbgate
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          # Schema analysis can saturate the CPU; a restart would end every session.
          readinessProbe:
            httpGet:
              path: /__health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /__health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: dbgate-data
          persistentVolumeClaim:
            claimName: dbgate-pvc
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
