# Malware scanning for applications (ClamAV). Applications send a file to
# clamav.__INTERNAL_DNS_ZONE__:3310 with clamd's INSTREAM command and act on the
# answer ("stream: OK" or "stream: <name> FOUND"); nothing is stored here.
# Two replicas, each with its signatures on its own volume: an update or a
# restart leaves the other one scanning, and a pod is ready only with a
# complete, loaded signature set. A new volume starts from the set the image
# carries, so no whole download from the mirror is needed; freshclam beside
# clamd fetches the differences every hour and has clamd load them at once,
# without pausing scans.
# Every result goes to the malware-scans-* reports (Grafana "ClamAV Malware
# Scanning"); a detection raises MalwareDetected (security-detection.yaml).
# clamd is unauthenticated, so only the application namespaces may reach it.
# Guide: docs/guides/application-onboarding.md#malware-scanning.
apiVersion: v1
kind: ConfigMap
metadata:
  name: clamav-config
  namespace: infra
  labels:
    app: clamav
data:
  clamd.conf: |
    # swirl-cloud:file clamav/clamd.conf
  # freshclam's address for telling clamd to load new signatures.
  clamd-local.conf: |
    # swirl-cloud:file clamav/clamd-local.conf
  freshclam.conf: |
    # swirl-cloud:file clamav/freshclam.conf
  signatures.sh: |
    # swirl-cloud:file clamav/signatures.sh
  probe.sh: |
    # swirl-cloud:file clamav/probe.sh
  exporter.mjs: |
    # swirl-cloud:file clamav/exporter.mjs

---
apiVersion: v1
kind: Service
metadata:
  name: clamav
  namespace: infra
  labels:
    app: clamav
spec:
  selector:
    app: clamav
  ports:
    - name: clamd
      port: 3310
      targetPort: clamd

---
# The StatefulSet's governing Service (one DNS name per replica).
apiVersion: v1
kind: Service
metadata:
  name: clamav-replicas
  namespace: infra
  labels:
    app: clamav
spec:
  clusterIP: None
  selector:
    app: clamav
  ports:
    - name: clamd
      port: 3310
      targetPort: clamd

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clamav
  namespace: infra
  labels:
    app: clamav
spec:
  replicas: 2
  serviceName: clamav-replicas
  # One replica at a time, at the first start too: the second starts once the
  # first is ready, and an update always leaves one scanning.
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: clamav
  template:
    metadata:
      labels:
        app: clamav
      annotations:
        swirl-cloud.io/application-data: disabled
        # A changed setting or script replaces the pods; clamd reads its settings at start.
        swirl-cloud.io/clamav: pending
        # Prometheus scrapes the exporter through its own job (files/prometheus/prometheus.yml).
    spec:
      priorityClassName: platform-standard
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # The image's clamav user and group.
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: clamav
      initContainers:
        # clamd starts only with a complete signature set (main, daily and bytecode):
        # the image's own set, then the mirror's differences since.
        - name: signatures
          image: docker.io/clamav/clamav:1.5.4@sha256:7054e3f34308c384ea43cd786ea17abf899bd44af40af9f1b099853d7a5c214e
          command: ["sh", "/etc/clamav-config/signatures.sh"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext: &container
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/clamav-config
              readOnly: true
            # Here, so that the image's own set stays visible at /var/lib/clamav.
            - name: signatures
              mountPath: /signatures
            - name: tmp
              mountPath: /tmp
              subPath: freshclam
      containers:
        - name: clamd
          image: docker.io/clamav/clamav:1.5.4@sha256:7054e3f34308c384ea43cd786ea17abf899bd44af40af9f1b099853d7a5c214e
          command: ["clamd", "--foreground", "--config-file=/etc/clamav-config/clamd.conf"]
          ports:
            - name: clamd
              containerPort: 3310
          # Loading the signatures takes a minute or more.
          startupProbe:
            exec:
              command: ["sh", "/etc/clamav-config/probe.sh", "alive"]
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 90
          readinessProbe:
            exec:
              command: ["sh", "/etc/clamav-config/probe.sh", "ready"]
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["sh", "/etc/clamav-config/probe.sh", "alive"]
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          # About 1.3 GiB for one signature set; a reload holds two for a moment,
          # beside up to eight scans of 50 MB files.
          resources:
            requests:
              cpu: 200m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 6Gi
          securityContext: *container
          volumeMounts:
            - name: config
              mountPath: /etc/clamav-config
              readOnly: true
            - name: signatures
              mountPath: /var/lib/clamav
              readOnly: true
            # Each stream, and what clamd unpacks from archives, while it scans.
            - name: scratch
              mountPath: /tmp
        - name: freshclam
          image: docker.io/clamav/clamav:1.5.4@sha256:7054e3f34308c384ea43cd786ea17abf899bd44af40af9f1b099853d7a5c214e
          command: ["freshclam", "--daemon", "--foreground", "--stdout", "--config-file=/etc/clamav-config/freshclam.conf",
                    "--daemon-notify=/etc/clamav-config/clamd-local.conf"]
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext: *container
          volumeMounts:
            - name: config
              mountPath: /etc/clamav-config
              readOnly: true
            - name: signatures
              mountPath: /var/lib/clamav
            - name: tmp
              mountPath: /tmp
              subPath: freshclam
        - name: exporter
          image: docker.io/library/node:26.13.1-alpine@sha256:6bd9ab43c0ec0190ca7b2d193906cb8b7edf6e7f4afa43ddeccd6452710bffb5
          command: ["node", "/etc/clamav-config/exporter.mjs"]
          ports:
            - name: metrics
              containerPort: 9464
          # Its own restarts only: a readiness probe here would take clamd out of the Service.
          livenessProbe:
            httpGet: {path: /healthz, port: metrics}
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 48Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/clamav-config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: clamav-config
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
        # Eight scans at once, each a 52 MiB stream and up to 400 MiB unpacked.
        - name: scratch
          emptyDir:
            sizeLimit: 8Gi
  # Refilled from the image and the mirror if lost, so out of the daily volume
  # backups (LONGHORN_BACKUP_EXCLUDE in scripts/configure-k3s-backups.sh).
  volumeClaimTemplates:
    - metadata:
        name: signatures
        labels:
          app: clamav
      spec:
        storageClassName: longhorn
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 4Gi

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: clamav
  namespace: infra
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: clamav

---
# clamd answers anyone who connects: only the application namespaces may.
# Prometheus reads the exporter's metrics.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: clamav-application-access
  namespace: infra
spec:
  podSelector:
    matchLabels:
      app: clamav
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [apps, corp]
        - namespaceSelector:
            matchLabels:
              swirl-cloud.io/application-workloads: "true"
      ports:
        - {protocol: TCP, port: 3310}
    - from:
        - podSelector:
            matchLabels:
              app: prometheus
      ports:
        - {protocol: TCP, port: 9464}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-clamav-dashboard
  namespace: infra
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: swirl-cloud
data:
  clamav-malware-scanning.json: |
    # swirl-cloud:file dashboards/clamav-malware-scanning.json
