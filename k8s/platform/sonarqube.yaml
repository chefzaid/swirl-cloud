---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sonarqube-sso-admin-token
  namespace: infra
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: sonarqube-sso-admin-token
    creationPolicy: Owner
  data:
    - secretKey: admin-token
      remoteRef:
        key: infra/sonarqube
        property: admin_token

---
apiVersion: batch/v1
kind: Job
metadata:
  name: sonarqube-sso-admin-bootstrap
  namespace: infra
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 5
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: sonarqube-sso-admin-bootstrap
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate-sso-identity
          image: docker.io/library/postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
          env:
            - name: SONAR_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sonarqube-db-credentials
                  key: jdbc-password
            - name: SSO_PRIMARY_EMAIL
              valueFrom:
                secretKeyRef:
                  name: keycloak-sso-credentials
                  key: SSO_PRIMARY_EMAIL
            - name: SSO_DISPLAY_NAME
              valueFrom:
                secretKeyRef:
                  name: keycloak-sso-credentials
                  key: SSO_DISPLAY_NAME
          command:
            - /bin/sh
            - -ec
            - |
              until pg_isready --host=postgres.__INTERNAL_DNS_ZONE__ --port=5432 --username=sonar; do
                sleep 5
              done

              PGPASSWORD="$SONAR_DB_PASSWORD" psql \
                --host=postgres.__INTERNAL_DNS_ZONE__ \
                --port=5432 \
                --username=sonar \
                --dbname=sonarqube \
                --set=ON_ERROR_STOP=1 \
                --set=sso_email="$SSO_PRIMARY_EMAIL" \
                --set=sso_display_name="$SSO_DISPLAY_NAME" <<'SQL'
              UPDATE users
              SET login = :'sso_email',
                  name = CASE
                    WHEN name IS NULL OR btrim(name) = '' OR name IN (login, email)
                      THEN :'sso_display_name'
                    ELSE name
                  END,
                  email = :'sso_email',
                  external_login = :'sso_email',
                  external_id = :'sso_email',
                  external_identity_provider = 'sonarqube',
                  updated_at = (EXTRACT(EPOCH FROM clock_timestamp()) * 1000)::bigint
              WHERE email = :'sso_email'
                AND external_identity_provider = 'sonarqube'
                AND NOT EXISTS (
                  SELECT 1 FROM users target
                  WHERE target.login = :'sso_email'
                    AND target.uuid <> users.uuid
                );

              -- Header SSO refreshes groups and email every five minutes. Keep
              -- that security behavior while preventing its email-valued name
              -- header from destroying a locally edited display name.
              CREATE OR REPLACE FUNCTION swirl_cloud_preserve_delegated_full_name()
              RETURNS trigger
              LANGUAGE plpgsql
              AS '
              BEGIN
                IF OLD.external_identity_provider = ''sonarqube''
                   AND NEW.external_identity_provider = ''sonarqube''
                   AND NEW.name IN (NEW.login, NEW.email)
                   AND OLD.name IS NOT NULL
                   AND btrim(OLD.name) <> ''''
                   AND OLD.name NOT IN (OLD.login, OLD.email) THEN
                  NEW.name := OLD.name;
                END IF;
                RETURN NEW;
              END;
              ';

              DROP TRIGGER IF EXISTS swirl_cloud_preserve_delegated_full_name ON users;
              CREATE TRIGGER swirl_cloud_preserve_delegated_full_name
              BEFORE UPDATE OF name ON users
              FOR EACH ROW
              EXECUTE FUNCTION swirl_cloud_preserve_delegated_full_name();
              SQL
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 01
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: bootstrap
          image: docker.io/curlimages/curl:8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
          env:
            - name: SONAR_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sonarqube-sso-admin-token
                  key: admin-token
          command:
            - /bin/sh
            - -ec
            - |
              sonar_url=http://sonarqube.__INTERNAL_DNS_ZONE__:9000
              auth_header="Authorization: Bearer $SONAR_ADMIN_TOKEN"

              until curl --fail --silent --show-error \
                --header "$auth_header" "$sonar_url/api/system/status" >/dev/null; do
                sleep 10
              done

              groups="$(curl --fail --silent --show-error --header "$auth_header" \
                "$sonar_url/api/user_groups/search?q=platform-admins")"
              if ! printf '%s' "$groups" | grep -q '"name":"platform-admins"'; then
                curl --fail --silent --show-error --request POST --header "$auth_header" \
                  --data-urlencode name=platform-admins \
                  --data-urlencode 'description=Keycloak platform administrators' \
                  "$sonar_url/api/user_groups/create" >/dev/null
              fi

              curl --fail --silent --show-error --request POST --header "$auth_header" \
                --data-urlencode groupName=platform-admins \
                --data-urlencode permission=admin \
                "$sonar_url/api/permissions/add_group" >/dev/null
              echo 'Ensured the Keycloak platform-admins group has SonarQube administration.'
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sonarqube-data
  namespace: infra
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sonarqube-extensions
  namespace: infra
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sonarqube-logs
  namespace: infra
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarqube
  namespace: infra
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sonarqube
  template:
    metadata:
      labels:
        app: sonarqube
      annotations:
        theme.__PUBLIC_DOMAIN__/config-revision: "1"
    spec:
      automountServiceAccountToken: false
      # Exec probes killed at their timeout orphan curl and grep; a shared process
      # namespace lets the pause container reap them (the JVM never does).
      shareProcessNamespace: true
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 0
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
      - name: prepare-theme
        image: docker.io/library/sonarqube:26.9.0.129388-community@sha256:4905574ab8584dcac1a06c01cdc43a4ce9e369723ac4a7ab1d029c1bf71e6fe9
        command:
        - sh
        - -ec
        - |
          # Preserve Sonar's own assets, context placeholders and CSP-protected script.
          test "$(grep -c '</head>' /opt/sonarqube/web/index.html)" = 1
          awk '/<\/head>/ { while ((getline line < "/theme/head.html") > 0) print line } { print }' \
            /opt/sonarqube/web/index.html > /prepared/index.html
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 0
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          readOnlyRootFilesystem: true
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
        volumeMounts:
        - name: sonarqube-dark-theme
          mountPath: /theme
          readOnly: true
        - name: sonarqube-themed-index
          mountPath: /prepared
      - name: init-database
        image: docker.io/library/postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          runAsGroup: 01
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          readOnlyRootFilesystem: true
        env:
        - name: POSTGRES_ADMIN_USER
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_USER
        - name: POSTGRES_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
        - name: SONAR_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: sonarqube-db-credentials
              key: jdbc-password
        command:
        - sh
        - -ec
        - |
          until PGPASSWORD="$POSTGRES_ADMIN_PASSWORD" psql \
            --host=postgres.__INTERNAL_DNS_ZONE__ \
            --username="$POSTGRES_ADMIN_USER" \
            --dbname=postgres \
            --command='SELECT 1' >/dev/null 2>&1; do
            echo "Waiting for shared PostgreSQL..."
            sleep 2
          done
          PGPASSWORD="$POSTGRES_ADMIN_PASSWORD" psql \
            --host=postgres.__INTERNAL_DNS_ZONE__ \
            --username="$POSTGRES_ADMIN_USER" \
            --dbname=postgres \
            --set=ON_ERROR_STOP=1 \
            --set=sonar_password="$SONAR_DB_PASSWORD" <<'SQL'
          SELECT 'CREATE ROLE sonar LOGIN'
          WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'sonar') \gexec
          ALTER ROLE sonar WITH LOGIN PASSWORD :'sonar_password';
          SELECT 'CREATE DATABASE sonarqube OWNER sonar'
          WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'sonarqube') \gexec
          ALTER DATABASE sonarqube OWNER TO sonar;
          SQL
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
      containers:
      - name: sonarqube
        image: docker.io/library/sonarqube:26.9.0.129388-community@sha256:4905574ab8584dcac1a06c01cdc43a4ce9e369723ac4a7ab1d029c1bf71e6fe9
        ports:
        - containerPort: 9000
        env:
        # No usage statistics leave the installation (docs/guides/external-services.md).
        - name: SONAR_TELEMETRY_ENABLE
          value: "false"
        - name: SONAR_JDBC_URL
          value: "jdbc:postgresql://postgres.__INTERNAL_DNS_ZONE__:5432/sonarqube"
        - name: SONAR_JDBC_USERNAME
          value: "sonar"
        - name: SONAR_JDBC_PASSWORD
          valueFrom:
            secretKeyRef:
              name: sonarqube-db-credentials
              key: jdbc-password
        - name: SONAR_WEB_SSO_ENABLE
          value: "true"
        - name: SONAR_WEB_SSO_LOGINHEADER
          value: X-Auth-Request-Email
        - name: SONAR_WEB_SSO_NAMEHEADER
          value: X-Auth-Request-Email
        - name: SONAR_WEB_SSO_EMAILHEADER
          value: X-Auth-Request-Email
        - name: SONAR_WEB_SSO_GROUPSHEADER
          value: X-Auth-Request-Groups
        - name: SONAR_WEB_SSO_REFRESHINTERVALINMINUTES
          value: "5"
        volumeMounts:
        - name: sonarqube-themed-index
          mountPath: /opt/sonarqube/web/index.html
          subPath: index.html
          readOnly: true
        - name: sonarqube-dark-theme
          mountPath: /opt/sonarqube/web/js/platform-darkreader.js
          subPath: darkreader.js
          readOnly: true
        - name: sonarqube-dark-theme
          mountPath: /opt/sonarqube/web/js/platform-theme.js
          subPath: theme.js
          readOnly: true
        - name: sonarqube-dark-theme
          mountPath: /opt/sonarqube/web/css/platform-theme.css
          subPath: theme.css
          readOnly: true
        - name: sonarqube-dark-theme
          mountPath: /opt/sonarqube/web/js/platform-darkreader.LICENSE.txt
          subPath: LICENSE
          readOnly: true
        - name: sonarqube-data
          mountPath: /opt/sonarqube/data
        - name: sonarqube-extensions
          mountPath: /opt/sonarqube/extensions
        - name: sonarqube-logs
          mountPath: /opt/sonarqube/logs
        - name: sonarqube-temp
          mountPath: /opt/sonarqube/temp
        - name: tmp
          mountPath: /tmp
        # Requests follow measured use (peak 0.09 core over 6 h on 2026-10-05);
        # analyses burst up to the limit.
        resources:
          requests:
            memory: "2Gi"
            cpu: "150m"
          limits:
            memory: "4Gi"
            cpu: "2"
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 0
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          readOnlyRootFilesystem: true
        startupProbe:
          exec:
            command:
              - sh
              - -c
              - curl -fsS --max-time 3 http://127.0.0.1:9000/api/system/status >/dev/null
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 60
        readinessProbe:
          exec:
            command:
              - sh
              - -c
              - curl -fsS --max-time 3 http://127.0.0.1:9000/api/system/status | grep -q '"status":"UP"'
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        livenessProbe:
          tcpSocket:
            port: 9000
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 6
      volumes:
      - name: sonarqube-dark-theme
        configMap:
          name: sonarqube-dark-theme
      - name: sonarqube-themed-index
        emptyDir:
          medium: Memory
          sizeLimit: 1Mi
      - name: sonarqube-data
        persistentVolumeClaim:
          claimName: sonarqube-data
      - name: sonarqube-extensions
        persistentVolumeClaim:
          claimName: sonarqube-extensions
      - name: sonarqube-logs
        persistentVolumeClaim:
          claimName: sonarqube-logs
      - name: sonarqube-temp
        emptyDir:
          sizeLimit: 512Mi
      - name: tmp
        emptyDir:
          sizeLimit: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: sonarqube
  namespace: infra
spec:
  type: ClusterIP
  ports:
    - port: 9000
      targetPort: 9000
  selector:
    app: sonarqube

---
# Vendored Dark Reader site API; see docs/operations.md#ui-themes for the CSP adjustment.
apiVersion: v1
kind: ConfigMap
metadata:
  name: sonarqube-dark-theme
  namespace: infra
  annotations:
    upstream.repository: https://github.com/darkreader/darkreader
    upstream.version: 4.9.130
    upstream.integrity: sha512-hLYjyUszzRc7n+EGbK+LYJV9uCp0JwwvRNgXgKyMkqCoetwkheefWUIxbxKiqQaSWLrCQuQuv55f2cHQMopJ2w==
data:
  darkreader.js: |
    # swirl-cloud:file darkreader/darkreader.js
  LICENSE: |
    # swirl-cloud:file darkreader/LICENSE
  theme.js: |
    /* Platform Sonar theme: local assets, dark by default, per-browser opt-out. */
    (() => {
      'use strict';
      const preferenceKey = 'platform.sonar.theme';
      let dark = true;
      try { dark = localStorage.getItem(preferenceKey) !== 'light'; } catch {}
      const reader = window.DarkReader;
      if (!reader) return;
      reader.setFetchMethod((url) => {
        const target = new URL(url, location.href);
        if (target.origin !== location.origin) {
          return Promise.reject(new Error('Theme assets must use the Sonar origin'));
        }
        return fetch(target, { credentials: 'same-origin' });
      });
      const apply = () => {
        if (dark) {
          reader.enable({
            brightness: 100, contrast: 100, sepia: 0,
            darkSchemeBackgroundColor: '#181c25',
            darkSchemeTextColor: '#e6eaf2',
          }, { ignoreImageAnalysis: ['*'] });
        } else {
          reader.disable();
        }
      };
      apply();
      document.addEventListener('DOMContentLoaded', () => {
        const button = document.createElement('button');
        button.id = 'platform-theme-toggle';
        button.type = 'button';
        button.setAttribute('aria-label', 'Dark theme');
        const updateButton = () => {
          button.textContent = dark ? '☾ Dark' : '☀ Light';
          button.setAttribute('aria-pressed', String(dark));
          button.title = dark ? 'Switch to light theme' : 'Switch to dark theme';
        };
        button.addEventListener('click', () => {
          dark = !dark;
          try { localStorage.setItem(preferenceKey, dark ? 'dark' : 'light'); } catch {}
          apply();
          updateButton();
        });
        updateButton();
        document.body.append(button);
      }, { once: true });
    })();
  theme.css: |
    #platform-theme-toggle {
      position: fixed;
      right: 1rem;
      bottom: 0.75rem;
      z-index: 1000;
      padding: 0.4rem 0.75rem;
      border: 1px solid #63728a;
      border-radius: 1rem;
      color: #293447;
      background: #f4f6fa;
      font: 600 12px/1.4 system-ui, sans-serif;
      cursor: pointer;
      box-shadow: 0 2px 8px #0002;
    }
    #platform-theme-toggle:focus-visible {
      outline: 2px solid #397ee5;
      outline-offset: 3px;
    }
  head.html: |2
        <link rel="stylesheet" href="WEB_CONTEXT/css/platform-theme.css?v=1" />
        <script src="WEB_CONTEXT/js/platform-darkreader.js?v=1"></script>
        <script src="WEB_CONTEXT/js/platform-theme.js?v=1"></script>
