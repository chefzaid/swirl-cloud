# Hourly snapshots of availability, cost, capacity and compliance status kept in
# Elasticsearch (platform-reports-*, 13 months) for monthly reports beyond
# Prometheus retention. See docs/guides/platform-reports.md.
apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-reports-snapshot
  namespace: infra
data:
  index-template.json: |
    {
      "index_patterns": ["platform-reports-*"],
      "template": {
        "settings": {
          "number_of_shards": 1,
          "number_of_replicas": 0,
          "index.lifecycle.name": "swirl-cloud-platform-reports"
        },
        "mappings": {
          "dynamic": false,
          "properties": {
            "@timestamp": {"type": "date"},
            "kind": {"type": "keyword"},
            "scope": {"type": "keyword"},
            "endpoint": {"type": "keyword"},
            "namespace": {"type": "keyword"},
            "workload": {"type": "keyword"},
            "control": {"type": "keyword"},
            "framework": {"type": "keyword"},
            "currency": {"type": "keyword"},
            "status": {"type": "keyword"},
            "ratio": {"type": "double"},
            "passing": {"type": "double"},
            "monthly_cost": {"type": "double"},
            "cpu_cores": {"type": "double"},
            "memory_bytes": {"type": "double"},
            "severity": {"type": "keyword"},
            "open": {"type": "long"},
            "past_deadline": {"type": "long"},
            "deadline_days": {"type": "long"},
            "indicator": {"type": "keyword"},
            "value": {"type": "double"}
          }
        }
      }
    }
  vulnerability-template.json: |
    {
      "index_patterns": ["platform-reports-vulnerability-tracking"],
      "priority": 10,
      "template": {
        "settings": {"number_of_shards": 1, "number_of_replicas": 0},
        "mappings": {
          "dynamic": false,
          "properties": {
            "@timestamp": {"type": "date"},
            "kind": {"type": "keyword"},
            "image": {"type": "keyword"},
            "vuln_id": {"type": "keyword"},
            "severity": {"type": "keyword"},
            "first_seen": {"type": "date"},
            "last_seen": {"type": "date"}
          }
        }
      }
    }
  ilm-policy.json: |
    {
      "policy": {
        "phases": {
          "hot": {"min_age": "0ms", "actions": {"set_priority": {"priority": 50}}},
          "delete": {"min_age": "400d", "actions": {"delete": {}}}
        }
      }
    }
  snapshot.mjs: |
    // Snapshot the last full hour from Prometheus recording rules into
    // Elasticsearch. Document IDs are derived from the hour, so a rerun
    // replaces that hour's documents instead of duplicating them.
    import { readFile } from "node:fs/promises";

    const prometheus = process.env.PROMETHEUS_URL;
    const elasticsearch = process.env.ELASTICSEARCH_URL;
    const authorization = "Basic " + Buffer.from(
      `${process.env.ELASTICSEARCH_USERNAME}:${process.env.ELASTICSEARCH_PASSWORD}`).toString("base64");
    // Evaluate at the top of the hour; documents are stamped with the start of
    // the hour their one-hour windows cover.
    const hour = new Date();
    hour.setUTCMinutes(0, 0, 0);
    const timestamp = new Date(hour.getTime() - 3600 * 1000).toISOString();
    const index = `platform-reports-${timestamp.slice(0, 7).replace("-", ".")}`;
    const STATUS = { 0: "failing", 1: "no_evidence", 2: "passing" };

    async function query(expr) {
      const parameters = new URLSearchParams({ query: expr, time: String(hour.getTime() / 1000) });
      const response = await fetch(`${prometheus}/api/v1/query?${parameters}`);
      const body = await response.json();
      if (body.status !== "success") throw new Error(`${expr}: ${body.error}`);
      return body.data.result.map(({ metric, value }) => ({ metric, value: Number(value[1]) }))
        .filter(({ value }) => Number.isFinite(value));
    }

    async function elastic(path, method, body, type = "application/json") {
      const response = await fetch(`${elasticsearch}${path}`, {
        method, headers: { Authorization: authorization, "Content-Type": type }, body });
      const text = await response.text();
      if (!response.ok) throw new Error(`${method} ${path}: HTTP ${response.status} ${text.slice(0, 300)}`);
      return text ? JSON.parse(text) : {};
    }

    const documents = [];
    const add = (id, fields) => documents.push({ id: `${id}@${timestamp}`, doc: { "@timestamp": timestamp, ...fields } });

    for (const { metric, value } of await query(
      'avg by (instance, namespace) (avg_over_time(probe_success{job="availability-probes"}[1h]))')) {
      add(`availability:${metric.instance}`, { kind: "availability", endpoint: metric.instance, namespace: metric.namespace, ratio: value });
    }
    for (const { metric, value } of await query("swirl_cloud_cost_namespace_monthly")) {
      add(`cost:namespace:${metric.namespace}:${metric.currency}`,
        { kind: "cost", scope: "namespace", namespace: metric.namespace, currency: metric.currency, monthly_cost: value });
    }
    for (const { metric, value } of await query("swirl_cloud_cost_workload_monthly")) {
      add(`cost:workload:${metric.namespace}:${metric.workload}:${metric.currency}`,
        { kind: "cost", scope: "workload", namespace: metric.namespace, workload: metric.workload, currency: metric.currency, monthly_cost: value });
    }
    for (const [scope, expr] of [["idle", "sum by (currency) (swirl_cloud_cost_idle_monthly)"],
                                 ["shared", "sum by (currency) (swirl_cloud_cost_shared_monthly)"],
                                 ["total", "swirl_cloud_cost_total_monthly"]]) {
      for (const { metric, value } of await query(expr)) {
        add(`cost:${scope}:${metric.currency}`, { kind: "cost", scope, currency: metric.currency, monthly_cost: value });
      }
    }
    for (const [indicator, expr] of [
      ["datastore", "avg by (service) (avg_over_time(swirl_cloud_sli:datastore_up[1h]))"],
      ["ci_queue_p90_seconds", "swirl_cloud_sli:ci_queue_seconds:p90_6h"],
      ["ci_platform_failure_ratio", "swirl_cloud_sli:ci_platform_failures:ratio_rate6h"],
      ["argocd_sync_failure_ratio", "swirl_cloud_sli:argocd_sync_failures:ratio_rate6h"]]) {
      for (const { metric, value } of await query(expr)) {
        const name = metric.service ? `${indicator}:${metric.service}` : indicator;
        add(`sli:${name}`, { kind: "sli", indicator: name, value });
      }
    }
    const usage = new Map();
    for (const [field, expr] of [["cpu_cores", "sum by (namespace) (swirl_cloud_cost_pod_cpu_cores)"],
                                 ["memory_bytes", "sum by (namespace) (swirl_cloud_cost_pod_memory_bytes)"]]) {
      for (const { metric, value } of await query(expr)) {
        usage.set(metric.namespace, { ...(usage.get(metric.namespace) || {}), [field]: value });
      }
    }
    for (const [namespace, fields] of usage) add(`usage:${namespace}`, { kind: "usage", namespace, ...fields });
    for (const { metric, value } of await query("swirl_cloud_compliance_control_status")) {
      add(`compliance:${metric.control}`, { kind: "compliance", control: metric.control,
        status: STATUS[value] || "unknown", passing: value === 2 ? 1 : 0 });
    }
    for (const { metric, value } of await query("swirl_cloud_compliance_framework_passing_ratio")) {
      add(`compliance-framework:${metric.framework}`, { kind: "compliance_framework", framework: metric.framework, ratio: value });
    }

    await elastic("/_ilm/policy/swirl-cloud-platform-reports", "PUT", await readFile("/opt/platform-reports/ilm-policy.json"));
    await elastic("/_index_template/platform-reports", "PUT", await readFile("/opt/platform-reports/index-template.json"));
    // Templates apply when an index is created; add new fields to this month's
    // index too (adding fields is allowed, existing ones are unchanged).
    const template = JSON.parse(await readFile("/opt/platform-reports/index-template.json", "utf8"));
    const mapping = await fetch(`${elasticsearch}/${index}/_mapping`, { method: "PUT",
      headers: { Authorization: authorization, "Content-Type": "application/json" },
      body: JSON.stringify({ properties: template.template.mappings.properties }) });
    if (!mapping.ok && mapping.status !== 404) throw new Error(`mapping: HTTP ${mapping.status} ${(await mapping.text()).slice(0, 200)}`);
    await elastic("/_index_template/platform-reports-vulnerability-tracking", "PUT",
      await readFile("/opt/platform-reports/vulnerability-template.json"));

    // Vulnerability deadlines: remember when each image x vulnerability was
    // first and last seen (kept without lifecycle deletion), and count the open
    // ones older than their severity's deadline.
    const deadlines = Object.fromEntries((process.env.VULNERABILITY_DEADLINE_DAYS || "Critical=15,High=30")
      .split(",").map((pair) => pair.split("=")).map(([severity, days]) => [severity, Number(days)]));
    const vulnerabilities = await query(`count by (image_registry, image_repository, vuln_id, severity) `
      + `(trivy_vulnerability_id{severity=~"${Object.keys(deadlines).join("|")}"})`);
    const seen = hour.toISOString();
    const counts = Object.fromEntries(Object.keys(deadlines).map((severity) => [severity, { open: 0, past_deadline: 0 }]));
    for (let start = 0; start < vulnerabilities.length; start += 500) {
      const batch = vulnerabilities.slice(start, start + 500);
      const body = batch.flatMap(({ metric }) => {
        const image = `${metric.image_registry}/${metric.image_repository}`;
        return [JSON.stringify({ update: { _index: "platform-reports-vulnerability-tracking", _id: `${image}|${metric.vuln_id}`,
                                           _source: true } }),
                JSON.stringify({ script: { source: "ctx._source.last_seen = params.seen; ctx._source['@timestamp'] = params.seen",
                                           params: { seen } },
                                 upsert: { "@timestamp": seen, kind: "vulnerability", image, vuln_id: metric.vuln_id,
                                           severity: metric.severity, first_seen: seen, last_seen: seen } })];
      }).join("\n") + "\n";
      const result = await elastic("/_bulk", "POST", body, "application/x-ndjson");
      result.items.forEach((item, position) => {
        const { severity } = batch[position].metric;
        const firstSeen = item.update?.get?._source?.first_seen || seen;
        counts[severity].open += 1;
        if (hour.getTime() - Date.parse(firstSeen) > deadlines[severity] * 86400000) counts[severity].past_deadline += 1;
      });
    }
    for (const [severity, { open, past_deadline }] of Object.entries(counts)) {
      add(`vulnerabilities:${severity}`, { kind: "vulnerabilities", severity, open, past_deadline,
        deadline_days: deadlines[severity] });
    }
    if (documents.length) {
      const bulk = documents.flatMap(({ id, doc }) => [JSON.stringify({ index: { _index: index, _id: id } }), JSON.stringify(doc)]).join("\n") + "\n";
      const result = await elastic("/_bulk?refresh=false", "POST", bulk, "application/x-ndjson");
      if (result.errors) {
        const failed = result.items.find((item) => item.index?.error);
        throw new Error(`bulk indexing failed: ${JSON.stringify(failed?.index?.error).slice(0, 300)}`);
      }
    }
    console.log(`Indexed ${documents.length} report documents for ${timestamp} into ${index}.`);

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: platform-reports-snapshot
  namespace: infra
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  # A few minutes past the hour, after the hour's recording rules are evaluated.
  schedule: "7 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app: platform-reports-snapshot
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: snapshot
              image: docker.io/library/node:24.22.1-alpine@sha256:06d7adf3e0ef61a13f1d28682726366f97a15aa1888c934d3ecec86c33918b53
              command: ["node", "/opt/platform-reports/snapshot.mjs"]
              env:
                - name: PROMETHEUS_URL
                  value: http://prometheus.__INTERNAL_DNS_ZONE__:9090
                - name: ELASTICSEARCH_URL
                  value: http://elasticsearch.__INTERNAL_DNS_ZONE__:9200
                - name: ELASTICSEARCH_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: logstash-elasticsearch-credentials
                      key: ELASTICSEARCH_USERNAME
                - name: ELASTICSEARCH_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: logstash-elasticsearch-credentials
                      key: ELASTICSEARCH_PASSWORD
              securityContext:
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
              volumeMounts:
                - name: script
                  mountPath: /opt/platform-reports
                  readOnly: true
          volumes:
            - name: script
              configMap:
                name: platform-reports-snapshot
