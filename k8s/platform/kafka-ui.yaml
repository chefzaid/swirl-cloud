apiVersion: v1
kind: Service
metadata:
  name: kafka-ui
  namespace: infra
  labels:
    app: kafka-ui
spec:
  type: ClusterIP
  selector:
    app: kafka-ui
  ports:
    - name: http
      port: 8080
      targetPort: http

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ui
  namespace: infra
  labels:
    app: kafka-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-ui
  template:
    metadata:
      labels:
        app: kafka-ui
    spec:
      priorityClassName: platform-background
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 10001
      containers:
        - name: kafka-ui
          image: ghcr.io/kafbat/kafka-ui:v1.5.0@sha256:7cda86a33344160309fdb65146332e4da65db81a945614f2fe32e210803f6fd1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: KAFKA_CLUSTERS_0_NAME
              value: swirl-cloud
            - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
              value: kafka.__INTERNAL_DNS_ZONE__:9092
            - name: KAFKA_CLUSTERS_0_READONLY
              value: "false"
            - name: AUTH_TYPE
              value: OAUTH2
            - name: AUTH_OAUTH2_CLIENT_KEYCLOAK_CLIENTID
              value: kafka-ui
            - name: AUTH_OAUTH2_CLIENT_KEYCLOAK_CLIENTSECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-sso-credentials
                  key: KAFKA_UI_CLIENT_SECRET
            - name: AUTH_OAUTH2_CLIENT_KEYCLOAK_SCOPE
              value: openid,profile,email,groups
            - name: AUTH_OAUTH2_CLIENT_KEYCLOAK_ISSUERURI
              value: https://keycloak.__PUBLIC_DOMAIN__/auth/realms/__KEYCLOAK_REALM__
            - name: AUTH_OAUTH2_CLIENT_KEYCLOAK_USERNAMEATTRIBUTE
              value: preferred_username
            - name: AUTH_OAUTH2_CLIENT_KEYCLOAK_CLIENTNAME
              value: Keycloak
            - name: AUTH_OAUTH2_CLIENT_KEYCLOAK_PROVIDER
              value: keycloak
            - name: AUTH_OAUTH2_CLIENT_KEYCLOAK_REDIRECTURI
              value: https://kafka.__PUBLIC_DOMAIN__/login/oauth2/code/keycloak
            - name: AUTH_OAUTH2_CLIENT_KEYCLOAK_AUTHORIZATIONGRANTTYPE
              value: authorization_code
            # "oauth" makes Kafbat read roles from the token's groups claim; with
            # any other type it maps no role (OauthAuthorityExtractor).
            - name: AUTH_OAUTH2_CLIENT_KEYCLOAK_CUSTOMPARAMS_TYPE
              value: oauth
            - name: AUTH_OAUTH2_CLIENT_KEYCLOAK_CUSTOMPARAMS_ROLESFIELD
              value: groups
            # Administrators only (ADR 0031): one role for platform-admins and no
            # default role, so any other signed-in account gets no access at all.
            - name: RBAC_ROLES_0_NAME
              value: platform-admins
            - name: RBAC_ROLES_0_CLUSTERS_0
              value: swirl-cloud
            - name: RBAC_ROLES_0_SUBJECTS_0_PROVIDER
              value: oauth
            - name: RBAC_ROLES_0_SUBJECTS_0_TYPE
              value: role
            - name: RBAC_ROLES_0_SUBJECTS_0_VALUE
              value: platform-admins
            - name: RBAC_ROLES_0_PERMISSIONS_0_RESOURCE
              value: applicationconfig
            - name: RBAC_ROLES_0_PERMISSIONS_0_ACTIONS_0
              value: all
            - name: RBAC_ROLES_0_PERMISSIONS_1_RESOURCE
              value: clusterconfig
            - name: RBAC_ROLES_0_PERMISSIONS_1_ACTIONS_0
              value: all
            - name: RBAC_ROLES_0_PERMISSIONS_2_RESOURCE
              value: topic
            - name: RBAC_ROLES_0_PERMISSIONS_2_VALUE
              value: ".*"
            - name: RBAC_ROLES_0_PERMISSIONS_2_ACTIONS_0
              value: all
            - name: RBAC_ROLES_0_PERMISSIONS_3_RESOURCE
              value: consumer
            - name: RBAC_ROLES_0_PERMISSIONS_3_VALUE
              value: ".*"
            - name: RBAC_ROLES_0_PERMISSIONS_3_ACTIONS_0
              value: all
            - name: RBAC_ROLES_0_PERMISSIONS_4_RESOURCE
              value: schema
            - name: RBAC_ROLES_0_PERMISSIONS_4_VALUE
              value: ".*"
            - name: RBAC_ROLES_0_PERMISSIONS_4_ACTIONS_0
              value: all
            - name: RBAC_ROLES_0_PERMISSIONS_5_RESOURCE
              value: acl
            - name: RBAC_ROLES_0_PERMISSIONS_5_ACTIONS_0
              value: all
            - name: RBAC_ROLES_0_PERMISSIONS_6_RESOURCE
              value: audit
            - name: RBAC_ROLES_0_PERMISSIONS_6_ACTIONS_0
              value: all
            - name: SERVER_FORWARD_HEADERS_STRATEGY
              value: framework
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          volumeMounts:
          - name: tmp
            mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 256Mi
