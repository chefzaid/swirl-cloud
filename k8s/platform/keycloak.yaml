apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: infra
  labels:
    app: keycloak
spec:
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  selector:
    app: keycloak
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: infra
  labels:
    app: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /auth/metrics
        prometheus.io/port: "9000"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 0
        fsGroup: 0
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: keycloak
        image: quay.io/keycloak/keycloak:26.7.5@sha256:37dbaf6f0722c9ec246335f36e1ef8b2e6cb960f7c27e0d8c615121a3d475a85
        # The vendor image applies build-time configuration during startup.
        # Log successful logins and admin actions too (default: errors only);
        # the logging agent keeps these events in identity-audit-* indices.
        args: ["start", "--import-realm", "--spi-events-listener--jboss-logging--success-level=info"]
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop: ["ALL"]
        env:
        - name: KC_BOOTSTRAP_ADMIN_USERNAME
          valueFrom:
            secretKeyRef:
              name: keycloak-admin-secret
              key: KC_BOOTSTRAP_ADMIN_USERNAME
        - name: KC_BOOTSTRAP_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: keycloak-admin-secret
              key: KC_BOOTSTRAP_ADMIN_PASSWORD
        - name: KC_PROXY_HEADERS
          value: "xforwarded"
        - name: KC_HTTP_ENABLED
          value: "true"
        - name: KC_DB
          value: "postgres"
        - name: KC_DB_URL
          value: "jdbc:postgresql://postgres:5432/keycloak"
        - name: KC_DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_USER
        - name: KC_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
        - name: KC_HOSTNAME
          value: "https://keycloak.__PUBLIC_DOMAIN__/auth"
        - name: KC_HOSTNAME_ADMIN
          value: "https://keycloak.__PUBLIC_DOMAIN__/auth"
        - name: KC_HTTP_RELATIVE_PATH
          value: "/auth"
        - name: KC_HEALTH_ENABLED
          value: "true"
        - name: KC_METRICS_ENABLED
          value: "true"
        ports:
        - name: http
          containerPort: 8080
        - name: management
          containerPort: 9000
        startupProbe:
          httpGet:
            path: /auth/health/started
            port: management
          periodSeconds: 5
          failureThreshold: 36
        readinessProbe:
          httpGet:
            path: /auth/health/ready
            port: management
          periodSeconds: 10
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /auth/health/live
            port: management
          periodSeconds: 30
          timeoutSeconds: 5
        resources:
          requests:
            cpu: 100m
            memory: 384Mi
          limits:
            cpu: "1"
            memory: 1Gi
        volumeMounts:
        - name: runtime-data
          mountPath: /opt/keycloak/data
        - name: tmp
          mountPath: /tmp
        - name: realm-config
          mountPath: /opt/keycloak/data/import
          readOnly: true
      volumes:
      - name: runtime-data
        emptyDir:
          sizeLimit: 128Mi
      - name: tmp
        emptyDir:
          sizeLimit: 128Mi
      - name: realm-config
        secret:
          secretName: keycloak-realm-config
