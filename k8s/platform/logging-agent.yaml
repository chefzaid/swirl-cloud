apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluent-bit
  namespace: host-agents

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fluent-bit
rules:
  - apiGroups: [""]
    resources: ["namespaces", "pods"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fluent-bit
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fluent-bit
subjects:
  - kind: ServiceAccount
    name: fluent-bit
    namespace: host-agents

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: host-agents
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush                     1
        Daemon                    Off
        Log_Level                 info
        Parsers_File              /fluent-bit/etc/parsers.conf
        HTTP_Server               On
        HTTP_Listen               0.0.0.0
        HTTP_Port                 2020
        Health_Check              On
        storage.path              /var/lib/fluent-bit/storage
        storage.sync              normal
        storage.checksum          off
        storage.max_chunks_up     128

    [INPUT]
        Name                      tail
        Alias                     kubernetes_containers
        Path                      /var/log/containers/*.log
        # Trivy scan pods print compressed reports the operator already stores as
        # resources, and are deleted before their metadata can be read.
        Exclude_Path              /var/log/containers/scan-vulnerabilityreport-*_infra_*.log
        multiline.parser          cri, docker
        Tag                       kube.*
        DB                        /var/lib/fluent-bit/tail-containers.db
        DB.Sync                   Normal
        Mem_Buf_Limit             20MB
        Skip_Long_Lines           On
        Refresh_Interval          10
        Rotate_Wait               30
        storage.type              filesystem

    # Host journal (Lynis LOGG-2154). Starts at the tail so enabling it never
    # replays the local journal history, which journald keeps for months.
    [INPUT]
        Name                      systemd
        Alias                     host_journal
        Path                      /var/log/journal
        Tag                       host.journal
        DB                        /var/lib/fluent-bit/systemd.db
        DB.Sync                   Normal
        Read_From_Tail            On
        Strip_Underscores         On
        Lowercase                 On
        Mem_Buf_Limit             10MB
        storage.type              filesystem

    # Kubernetes API audit log, written only on control planes by
    # scripts/configure-k3s-audit.sh (metadata only, no request bodies).
    [INPUT]
        Name                      tail
        Alias                     kubernetes_audit
        Path                      /var/log/kubernetes/audit/audit.log
        Parser                    json
        Tag                       k8s.audit
        DB                        /var/lib/fluent-bit/tail-audit.db
        DB.Sync                   Normal
        Mem_Buf_Limit             10MB
        Skip_Long_Lines           On
        Refresh_Interval          10
        Rotate_Wait               30
        storage.type              filesystem

    [FILTER]
        Name                      modify
        Match                     host.journal
        Add                       log_source host-journal

    [FILTER]
        Name                      modify
        Match                     k8s.audit
        Add                       log_source kubernetes-audit
        Add                       node ${NODE_NAME}

    [FILTER]
        Name                      kubernetes
        Match                     kube.*
        Kube_URL                  https://kubernetes.default.svc:443
        Kube_CA_File              /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File           /var/run/secrets/kubernetes.io/serviceaccount/token
        Kube_Tag_Prefix           kube.var.log.containers.
        Merge_Log                 On
        Keep_Log                  On
        K8S-Logging.Parser        On
        K8S-Logging.Exclude       On
        Labels                    On
        Annotations               Off
        Namespace_Labels          On
        Kube_Meta_Namespace_Cache_TTL 60s
        # CI job pods carry large specs; the 32 KB default dropped their metadata.
        Buffer_Size               256KB

    [FILTER]
        Name                      lua
        Match                     kube.*
        script                    /fluent-bit/etc/enrich-kubernetes.lua
        call                      enrich_kubernetes

    # Keycloak login and admin events (marked by the Lua filter above) move to
    # the long-retention identity-audit-* indices instead of the general logs.
    [FILTER]
        Name                      rewrite_tag
        Match                     kube.*
        Rule                      $log_source ^identity-audit$ identity.keycloak false
        Emitter_Name              identity_audit_emitter
        Emitter_Storage.type      filesystem
        Emitter_Mem_Buf_Limit     10MB

    # swirl-cloud:soc-forwarding-pipeline

    [OUTPUT]
        Name                      es
        Match                     kube.*
        Host                      elasticsearch.__INTERNAL_DNS_ZONE__
        Port                      9200
        HTTP_User                 ${ELASTICSEARCH_USERNAME}
        HTTP_Passwd               ${ELASTICSEARCH_PASSWORD}
        Logstash_Format           On
        Logstash_Prefix           kubernetes-logs-v2
        Logstash_DateFormat       %Y.%m.%d
        Suppress_Type_Name        On
        Generate_ID               On
        Write_Operation           index
        Replace_Dots              On
        Buffer_Size               5M
        Retry_Limit               False
        Trace_Error               On

    [OUTPUT]
        Name                      es
        Match                     host.journal
        Host                      elasticsearch.__INTERNAL_DNS_ZONE__
        Port                      9200
        HTTP_User                 ${ELASTICSEARCH_USERNAME}
        HTTP_Passwd               ${ELASTICSEARCH_PASSWORD}
        Logstash_Format           On
        Logstash_Prefix           kubernetes-logs-host
        Logstash_DateFormat       %Y.%m.%d
        Suppress_Type_Name        On
        Generate_ID               On
        Write_Operation           index
        Replace_Dots              On
        Buffer_Size               5M
        Retry_Limit               False
        Trace_Error               On

    [OUTPUT]
        Name                      es
        Match                     k8s.audit
        Host                      elasticsearch.__INTERNAL_DNS_ZONE__
        Port                      9200
        HTTP_User                 ${ELASTICSEARCH_USERNAME}
        HTTP_Passwd               ${ELASTICSEARCH_PASSWORD}
        Logstash_Format           On
        Logstash_Prefix           kubernetes-audit
        Logstash_DateFormat       %Y.%m.%d
        Suppress_Type_Name        On
        Generate_ID               On
        Write_Operation           index
        Replace_Dots              On
        Buffer_Size               5M
        Retry_Limit               False
        Trace_Error               On

    [OUTPUT]
        Name                      es
        Alias                     identity_audit
        Match                     identity.*
        Host                      elasticsearch.__INTERNAL_DNS_ZONE__
        Port                      9200
        HTTP_User                 ${ELASTICSEARCH_USERNAME}
        HTTP_Passwd               ${ELASTICSEARCH_PASSWORD}
        Logstash_Format           On
        Logstash_Prefix           identity-audit
        Logstash_DateFormat       %Y.%m
        Suppress_Type_Name        On
        Generate_ID               On
        Write_Operation           index
        Replace_Dots              On
        Buffer_Size               5M
        Retry_Limit               False
        Trace_Error               On

  index-template.json: |
    {
      "order": 100,
      "index_patterns": ["kubernetes-logs-v2-*"],
      "settings": {
        "number_of_shards": 1,
        "number_of_replicas": 0,
        "index.refresh_interval": "5s",
        "index.mapping.total_fields.limit": 200,
        "index.mapping.ignore_malformed": true,
        "index.lifecycle.name": "swirl-cloud-logs"
      },
      "mappings": {
        "dynamic": false,
        "properties": {
          "@timestamp": {"type": "date"},
          "app": {"type": "keyword"},
          "observability_scope": {"type": "keyword"},
          "level": {"type": "keyword"},
          "logger_name": {"type": "keyword"},
          "thread_name": {"type": "keyword"},
          "stream": {"type": "keyword"},
          "message": {"type": "text"},
          "log": {"type": "text"},
          "timestamp": {"type": "date"},
          "context": {"type": "keyword"},
          "trace": {"type": "text"},
          "stack_trace": {"type": "text"},
          "requestId": {"type": "keyword"},
          "method": {"type": "keyword"},
          "path": {"type": "keyword"},
          "statusCode": {"type": "integer"},
          "durationMs": {"type": "float"},
          "kubernetes": {
            "dynamic": false,
            "properties": {
              "namespace_name": {"type": "keyword"},
              "pod_name": {"type": "keyword"},
              "container_name": {"type": "keyword"},
              "docker_id": {"type": "keyword"},
              "container_hash": {"type": "keyword"},
              "container_image": {"type": "keyword"},
              "host": {"type": "keyword"}
            }
          }
        }
      }
    }
  host-journal-template.json: |
    {
      "order": 100,
      "index_patterns": ["kubernetes-logs-host-*"],
      "settings": {
        "number_of_shards": 1,
        "number_of_replicas": 0,
        "index.refresh_interval": "5s",
        "index.mapping.total_fields.limit": 100,
        "index.mapping.ignore_malformed": true,
        "index.lifecycle.name": "swirl-cloud-logs"
      },
      "mappings": {
        "dynamic": false,
        "properties": {
          "@timestamp": {"type": "date"},
          "log_source": {"type": "keyword"},
          "hostname": {"type": "keyword"},
          "systemd_unit": {"type": "keyword"},
          "syslog_identifier": {"type": "keyword"},
          "priority": {"type": "keyword"},
          "transport": {"type": "keyword"},
          "pid": {"type": "keyword"},
          "uid": {"type": "keyword"},
          "comm": {"type": "keyword"},
          "exe": {"type": "keyword"},
          "message": {"type": "text"}
        }
      }
    }
  enrich-kubernetes.lua: |
    function enrich_kubernetes(tag, timestamp, record)
      local kubernetes = record["kubernetes"]
      if kubernetes == nil then
        return 0, timestamp, record
      end

      local namespace = record["kubernetes_namespace"] or {}
      local namespace_labels = namespace["labels"] or {}
      if kubernetes["namespace_name"] == "apps" or
          namespace_labels["swirl-cloud.io/application-workloads"] == "true" then
        record["observability_scope"] = "application"
      end

      local labels = kubernetes["labels"]
      if labels ~= nil and labels["app"] ~= nil then
        record["app"] = labels["app"]
      end

      if record["message"] ~= nil and type(record["message"]) ~= "string" then
        record["message"] = nil
      end

      -- Keycloak's jboss-logging event listener writes one key="value" line
      -- per login or admin event. Only the platform Keycloak container may
      -- produce identity audit records.
      local line = record["log"]
      if kubernetes["namespace_name"] == "infra" and
          kubernetes["container_name"] == "keycloak" and type(line) == "string" then
        local level, payload = string.match(line, "^%S+ %S+ (%u+)%s+%[org%.keycloak%.events%] %b() (.*)$")
        if payload ~= nil then
          local event = {}
          for key, value in string.gmatch(payload, '([%w_]+)="([^"]*)"') do
            event[key] = value
          end
          record["log_source"] = "identity-audit"
          record["level"] = level
          record["event_category"] = event["operationType"] ~= nil and "admin" or "user"
          record["keycloak"] = event
        end
      end

      return 2, timestamp, record
    end
  audit-template.json: |
    {
      "order": 100,
      "index_patterns": ["kubernetes-audit-*"],
      "settings": {
        "number_of_shards": 1,
        "number_of_replicas": 0,
        "index.refresh_interval": "10s",
        "index.lifecycle.name": "swirl-cloud-audit-30d"
      },
      "mappings": {
        "dynamic": false,
        "properties": {
          "@timestamp": {"type": "date"},
          "requestReceivedTimestamp": {"type": "date"},
          "stageTimestamp": {"type": "date"},
          "log_source": {"type": "keyword"},
          "node": {"type": "keyword"},
          "auditID": {"type": "keyword"},
          "level": {"type": "keyword"},
          "stage": {"type": "keyword"},
          "verb": {"type": "keyword"},
          "requestURI": {"type": "keyword", "ignore_above": 1024},
          "sourceIPs": {"type": "keyword"},
          "userAgent": {"type": "keyword", "ignore_above": 512},
          "user": {"properties": {"username": {"type": "keyword"}, "groups": {"type": "keyword"}}},
          "impersonatedUser": {"properties": {"username": {"type": "keyword"}}},
          "objectRef": {"properties": {
            "resource": {"type": "keyword"}, "subresource": {"type": "keyword"}, "namespace": {"type": "keyword"},
            "name": {"type": "keyword"}, "apiGroup": {"type": "keyword"}, "apiVersion": {"type": "keyword"}}},
          "responseStatus": {"properties": {"code": {"type": "integer"}, "reason": {"type": "keyword"}}}
        }
      }
    }
  audit-ilm-policy.json: |
    {
      "policy": {
        "phases": {
          "hot": {"min_age": "0ms", "actions": {"set_priority": {"priority": 50}}},
          "delete": {"min_age": "30d", "actions": {"delete": {}}}
        }
      }
    }
  identity-audit-template.json: |
    {
      "order": 100,
      "index_patterns": ["identity-audit-*"],
      "settings": {
        "number_of_shards": 1,
        "number_of_replicas": 0,
        "index.refresh_interval": "10s",
        "index.lifecycle.name": "swirl-cloud-identity-audit"
      },
      "mappings": {
        "dynamic": false,
        "properties": {
          "@timestamp": {"type": "date"},
          "log_source": {"type": "keyword"},
          "level": {"type": "keyword"},
          "event_category": {"type": "keyword"},
          "log": {"type": "text"},
          "keycloak": {"properties": {
            "type": {"type": "keyword"}, "operationType": {"type": "keyword"},
            "realmName": {"type": "keyword"}, "realmId": {"type": "keyword"},
            "clientId": {"type": "keyword"}, "userId": {"type": "keyword"},
            "username": {"type": "keyword"}, "sessionId": {"type": "keyword"},
            "ipAddress": {"type": "keyword"}, "error": {"type": "keyword"},
            "auth_method": {"type": "keyword"}, "grant_type": {"type": "keyword"},
            "identity_provider": {"type": "keyword"}, "redirect_uri": {"type": "keyword", "ignore_above": 1024},
            "resourceType": {"type": "keyword"}, "resourcePath": {"type": "keyword", "ignore_above": 1024}}},
          "kubernetes": {"properties": {"pod_name": {"type": "keyword"}, "host": {"type": "keyword"}}}
        }
      }
    }
  identity-audit-ilm-policy.json: |
    {
      "policy": {
        "phases": {
          "hot": {"min_age": "0ms", "actions": {"set_priority": {"priority": 50}}},
          "delete": {"min_age": "396d", "actions": {"delete": {}}}
        }
      }
    }
  ilm-policy.json: |
    {
      "policy": {
        "phases": {
          "hot": {
            "min_age": "0ms",
            "actions": {
              "set_priority": {"priority": 100}
            }
          },
          "delete": {
            "min_age": "1d",
            "actions": {
              "delete": {}
            }
          }
        }
      }
    }
  # swirl-cloud:soc-forwarding-files

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  namespace: host-agents
  labels:
    app: fluent-bit
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  selector:
    matchLabels:
      app: fluent-bit
  template:
    metadata:
      labels:
        app: fluent-bit
      annotations:
        swirl-cloud.io/logging-agent: pending
        swirl-cloud.__PUBLIC_DOMAIN__/config-version: "9"
        prometheus.io/scrape: "true"
        prometheus.io/path: /api/v2/metrics/prometheus
        prometheus.io/port: "2020"
    spec:
      serviceAccountName: fluent-bit
      automountServiceAccountToken: true
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      tolerations:
        - operator: Exists
      initContainers:
        - name: configure-index-template
          image: docker.io/curlimages/curl:8.23.0@sha256:11e64e28c5f58c8d93ee95fcf22ac055f48b0bc440e0ce7d8013bbb5ad6aa8ac
          envFrom:
            - secretRef:
                name: fluent-bit-elasticsearch-credentials
          command:
            - sh
            - -c
            - |
              until curl -fsS --user "${ELASTICSEARCH_USERNAME}:${ELASTICSEARCH_PASSWORD}" \
                http://elasticsearch.__INTERNAL_DNS_ZONE__:9200 >/dev/null; do sleep 5; done
              # The templates and indices below use this policy; stop if it is missing.
              curl -fsS --user "${ELASTICSEARCH_USERNAME}:${ELASTICSEARCH_PASSWORD}" -X PUT \
                -H 'Content-Type: application/json' \
                --data-binary @/config/ilm-policy.json \
                http://elasticsearch.__INTERNAL_DNS_ZONE__:9200/_ilm/policy/swirl-cloud-logs >/dev/null || exit 1
              curl -fsS --user "${ELASTICSEARCH_USERNAME}:${ELASTICSEARCH_PASSWORD}" -X PUT \
                -H 'Content-Type: application/json' \
                --data-binary @/config/index-template.json \
                http://elasticsearch.__INTERNAL_DNS_ZONE__:9200/_template/kubernetes-logs-v2 >/dev/null
              curl -fsS --user "${ELASTICSEARCH_USERNAME}:${ELASTICSEARCH_PASSWORD}" -X PUT \
                -H 'Content-Type: application/json' \
                --data-binary @/config/host-journal-template.json \
                http://elasticsearch.__INTERNAL_DNS_ZONE__:9200/_template/kubernetes-logs-host >/dev/null
              curl -fsS --user "${ELASTICSEARCH_USERNAME}:${ELASTICSEARCH_PASSWORD}" -X PUT \
                -H 'Content-Type: application/json' \
                --data-binary @/config/audit-ilm-policy.json \
                http://elasticsearch.__INTERNAL_DNS_ZONE__:9200/_ilm/policy/swirl-cloud-audit-30d >/dev/null
              curl -fsS --user "${ELASTICSEARCH_USERNAME}:${ELASTICSEARCH_PASSWORD}" -X PUT \
                -H 'Content-Type: application/json' \
                --data-binary @/config/audit-template.json \
                http://elasticsearch.__INTERNAL_DNS_ZONE__:9200/_template/kubernetes-audit >/dev/null
              curl -fsS --user "${ELASTICSEARCH_USERNAME}:${ELASTICSEARCH_PASSWORD}" -X PUT \
                -H 'Content-Type: application/json' \
                --data-binary @/config/identity-audit-ilm-policy.json \
                http://elasticsearch.__INTERNAL_DNS_ZONE__:9200/_ilm/policy/swirl-cloud-identity-audit >/dev/null
              curl -fsS --user "${ELASTICSEARCH_USERNAME}:${ELASTICSEARCH_PASSWORD}" -X PUT \
                -H 'Content-Type: application/json' \
                --data-binary @/config/identity-audit-template.json \
                http://elasticsearch.__INTERNAL_DNS_ZONE__:9200/_template/identity-audit >/dev/null
              # Also moves indices off the renamed swirl-cloud-logs-7d policy
              # (docs/operations.md#storage-and-retention).
              curl -fsS --user "${ELASTICSEARCH_USERNAME}:${ELASTICSEARCH_PASSWORD}" -X PUT \
                -H 'Content-Type: application/json' \
                --data-binary '{"index.lifecycle.name":"swirl-cloud-logs"}' \
                'http://elasticsearch.__INTERNAL_DNS_ZONE__:9200/kubernetes-logs-*,app-logs-*/_settings?allow_no_indices=true&ignore_unavailable=true' >/dev/null
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
      containers:
        - name: fluent-bit
          image: cr.fluentbit.io/fluent/fluent-bit:5.1.2@sha256:d792375ca8e53be72fc25716c28f291f32c6fc6f4f31d12d0d14bc78cefe9226
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          envFrom:
            - secretRef:
                name: fluent-bit-elasticsearch-credentials
          ports:
            - name: metrics
              containerPort: 2020
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: metrics
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /fluent-bit/etc/fluent-bit.conf
              subPath: fluent-bit.conf
              readOnly: true
            - name: config
              mountPath: /fluent-bit/etc/enrich-kubernetes.lua
              subPath: enrich-kubernetes.lua
              readOnly: true
            # swirl-cloud:soc-forwarding-mounts
            - name: varlogcontainers
              mountPath: /var/log/containers
              readOnly: true
            - name: varlogpods
              mountPath: /var/log/pods
              readOnly: true
            - name: journal
              mountPath: /var/log/journal
              readOnly: true
            - name: kubernetes-audit
              mountPath: /var/log/kubernetes/audit
              readOnly: true
            - name: state
              mountPath: /var/lib/fluent-bit
      terminationGracePeriodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: fluent-bit-config
        - name: varlogcontainers
          hostPath:
            path: /var/log/containers
        - name: varlogpods
          hostPath:
            path: /var/log/pods
        - name: journal
          hostPath:
            path: /var/log/journal
            type: Directory
        - name: kubernetes-audit
          hostPath:
            path: /var/log/kubernetes/audit
            type: DirectoryOrCreate
        - name: state
          hostPath:
            path: /var/lib/fluent-bit
            type: DirectoryOrCreate

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: filebeat-lynis-config
  namespace: host-agents
data:
  filebeat.yml: |
    filebeat.inputs:
      - type: filestream
        id: lynis-report
        enabled: true
        paths:
          - /hostfs/var/log/lynis-report.dat
        exclude_lines: ['^[[:space:]]*(#|$)']
        prospector.scanner.check_interval: 10s
        file_identity.fingerprint: ~
        fields_under_root: true
        fields:
          event:
            dataset: lynis.audit
            module: lynis
          host:
            name: ${NODE_NAME}
          service:
            type: lynis

    output.logstash:
      hosts: ["logstash.__INTERNAL_DNS_ZONE__:5044"]
      worker: 1
      compression_level: 3
      backoff.init: 1s
      backoff.max: 60s

    setup.ilm.enabled: false
    setup.template.enabled: false

    queue.mem:
      events: 512
      flush.min_events: 1
      flush.timeout: 1s

    http.enabled: true
    http.host: 0.0.0.0
    http.port: 5066
    logging.level: info
    logging.to_files: false
    logging.metrics.enabled: false

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: filebeat-lynis
  namespace: host-agents
  labels:
    app: filebeat-lynis
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  selector:
    matchLabels:
      app: filebeat-lynis
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: filebeat-lynis
      annotations:
        swirl-cloud.__PUBLIC_DOMAIN__/config-version: "1"
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: filebeat
          # The standard image requires x86-64-v3; Wolfi supports this node.
          image: docker.elastic.co/beats/filebeat-wolfi:9.5.4@sha256:119f38ac1c161f660669e5b1a37de9f831920636a4bbe7181e7795f54d622e91
          args:
            - -e
            - -c
            - /etc/filebeat/filebeat.yml
            - --strict.perms=false
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: http
              containerPort: 5066
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
