---
apiVersion: batch/v1
kind: Job
metadata:
  name: kibana-applications-namespace-bootstrap
  namespace: infra
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app: kibana-applications-namespace-bootstrap
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: import-saved-objects
          image: docker.io/curlimages/curl:8.23.0@sha256:11e64e28c5f58c8d93ee95fcf22ac055f48b0bc440e0ce7d8013bbb5ad6aa8ac
          envFrom:
            - secretRef:
                name: kibana-bootstrap-credentials
          command:
            - sh
            - -c
            - |
              until curl -fsS --user "${KIBANA_BOOTSTRAP_USERNAME}:${KIBANA_BOOTSTRAP_PASSWORD}" \
                http://kibana.__INTERNAL_DNS_ZONE__:5601/api/status >/dev/null; do sleep 5; done
              response="$(curl -fsS --user "${KIBANA_BOOTSTRAP_USERNAME}:${KIBANA_BOOTSTRAP_PASSWORD}" -X POST \
                -H 'kbn-xsrf: namespace-observability-bootstrap' \
                -F file=@/saved-objects/applications-namespace.ndjson \
                'http://kibana.__INTERNAL_DNS_ZONE__:5601/api/saved_objects/_import?overwrite=true')"
              echo "$response"
              echo "$response" | grep -q '"success":true'
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: saved-objects
              mountPath: /saved-objects
              readOnly: true
      volumes:
        - name: saved-objects
          configMap:
            name: kibana-applications-namespace-saved-objects

