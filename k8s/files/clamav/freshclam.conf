DatabaseDirectory /var/lib/clamav
DatabaseMirror database.clamav.net
Foreground yes
LogTime yes
# Hourly, the most often the mirror allows. Each check asks DNS first and
# downloads only the differences since the pod's last update.
Checks 24
# Testing a download loads every signature, more than freshclam's 512 MiB:
# each kill retried the download until the mirror refused this address for
# hours. Downloads are still checked against their signatures.
TestDatabases no
