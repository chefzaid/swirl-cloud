DatabaseDirectory /var/lib/clamav
TemporaryDirectory /tmp
TCPSocket 3310
TCPAddr 0.0.0.0
# In the foreground clamd logs to stdout; it refuses LogFile /dev/stdout,
# since it opens its log without following symbolic links.
Foreground yes
LogTime yes
# One line per scan, clean ones included: Fluent Bit keeps them in the
# malware-scans-* indices for the reports and the malware alert.
LogClean yes
LogVerbose no
# Applications send files of 50 MB at most; a longer stream is refused.
StreamMaxLength 52M
# Limits inside a file (archives, documents). A file past one is refused
# (AlertExceedsMax below). A scan ends within a minute, so an application's
# answer stays inside Cloudflare's 100-second request limit.
MaxFileSize 100M
MaxScanSize 400M
MaxScanTime 60000
MaxThreads 8
# New signatures load beside the current ones, so scans never wait for a
# reload; the container's memory holds two sets.
ConcurrentDatabaseReload yes
SelfCheck 600
# A scan that runs out of memory stops clamd, and Kubernetes restarts it,
# rather than clamd answering from a damaged state.
ExitOnOOM yes

# What is refused beyond the signatures. Each answers "<name> FOUND", like a
# signature (docs/guides/application-onboarding.md#malware-scanning).
DetectPUA yes
HeuristicAlerts yes
# An archive or document past a scan limit (size, file count, nesting or
# time) is refused, not passed unchecked.
AlertExceedsMax yes
# Content that cannot be read cannot be checked: password-protected archives
# and documents.
AlertEncryptedArchive yes
AlertEncryptedDoc yes
AlertBrokenExecutables yes
# Office documents with VBA macros.
AlertOLE2Macros yes
AlertPartitionIntersection yes
