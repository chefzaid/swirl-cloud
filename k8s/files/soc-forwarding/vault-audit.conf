# Copies of Vault container lines for the SOC; soc_record keeps only audit entries.
[FILTER]
    Name                      rewrite_tag
    Match                     kube.*
    Rule                      $kubernetes['container_name'] ^vault$ soc.vault-audit true
    Emitter_Name              soc_vault_audit_emitter
    Emitter_Storage.type      filesystem
    Emitter_Mem_Buf_Limit     10MB
