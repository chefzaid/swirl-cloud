# Copies of Kubernetes API audit events for the SOC.
[FILTER]
    Name                      rewrite_tag
    Match                     k8s.audit
    Rule                      $log_source ^kubernetes-audit$ soc.kubernetes-audit true
    Emitter_Name              soc_kubernetes_audit_emitter
    Emitter_Storage.type      filesystem
    Emitter_Mem_Buf_Limit     10MB
