# Copies of security detection job lines for the SOC; soc_record keeps only findings.
[FILTER]
    Name                      rewrite_tag
    Match                     kube.*
    Rule                      $kubernetes['container_name'] ^detect$ soc.detection true
    Emitter_Name              soc_detection_emitter
    Emitter_Storage.type      filesystem
    Emitter_Mem_Buf_Limit     10MB
