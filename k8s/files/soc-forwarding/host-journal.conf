# Copies of every host journal line for the SOC.
[FILTER]
    Name                      rewrite_tag
    Match                     host.journal
    Rule                      $log_source ^host-journal$ soc.host-journal true
    Emitter_Name              soc_host_journal_emitter
    Emitter_Storage.type      filesystem
    Emitter_Mem_Buf_Limit     10MB
