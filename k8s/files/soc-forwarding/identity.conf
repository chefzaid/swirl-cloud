# Copies of Keycloak login and admin events for the SOC.
[FILTER]
    Name                      rewrite_tag
    Match                     identity.*
    Rule                      $log_source ^identity-audit$ soc.identity true
    Emitter_Name              soc_identity_emitter
    Emitter_Storage.type      filesystem
    Emitter_Mem_Buf_Limit     10MB
