# RFC 5424 over TLS, one JSON event per message (docs/guides/soc-forwarding.md).
# Records stay buffered on disk while the SOC is unreachable, up to 512 MB.
[FILTER]
    Name                      lua
    Match                     soc.*
    script                    /fluent-bit/etc/soc-forwarding.lua
    call                      soc_record

[OUTPUT]
    Name                      syslog
    Alias                     soc_syslog
    Match                     soc.*
    Host                      __SOC_SYSLOG_HOST__
    Port                      __SOC_SYSLOG_PORT__
    Mode                      tls
    tls.verify                On
    tls.verify_hostname       On
    Syslog_Format             rfc5424
    Syslog_Maxsize            65536
    Syslog_Facility_Preset    13
    Syslog_Severity_Key       soc_severity
    Syslog_Hostname_Key       soc_hostname
    Syslog_Appname_Key        soc_appname
    Syslog_Msgid_Key          soc_msgid
    Syslog_Message_Key        soc_message
    Retry_Limit               20
    storage.total_limit_size  512M
