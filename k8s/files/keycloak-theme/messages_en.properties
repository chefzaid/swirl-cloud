termsTitle=IT charter
termsText=<p>Your account gives you access to the company's applications and data. By continuing you agree to:</p><ul><li>use them for your work, and keep what you see confidential;</li><li>keep your password to yourself, never reuse it elsewhere, and turn on a second factor when asked;</li><li>report a lost device, a suspicious email or anything unusual to IT support straight away;</li><li>leave security settings, logs and other people's data alone.</li></ul><p>Sign-ins and changes are recorded for security and audits.</p>
