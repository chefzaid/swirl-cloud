termsTitle=Charte informatique
termsText=<p>Votre compte vous donne accès aux applications et aux données de l''entreprise. En continuant, vous vous engagez à :</p><ul><li>les utiliser pour votre travail et garder confidentiel ce que vous y voyez ;</li><li>garder votre mot de passe pour vous, ne jamais le réutiliser ailleurs et activer un second facteur lorsqu''il est demandé ;</li><li>signaler sans attendre au support informatique un appareil perdu, un e-mail suspect ou tout fait inhabituel ;</li><li>ne pas modifier les réglages de sécurité, les journaux ni les données des autres.</li></ul><p>Les connexions et les modifications sont enregistrées pour la sécurité et les audits.</p>
