# Swirl login theme: Keycloak's keycloak.v2 theme in swirlit.dev's colours.
parent=keycloak.v2
import=common/keycloak
styles=css/styles.css css/swirl.css
favicons=img/swirl-mark.svg
# Always dark, like swirlit.dev: the dark class is on <html> from the start and
# the switch that follows the system preference is off.
darkMode=false
kcHtmlClass=login-pf pf-v5-theme-dark
