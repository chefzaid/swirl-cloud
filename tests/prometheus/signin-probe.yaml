# promtool unit test for the sign-in probe alerts, run by validate-manifests.py
# against each rendered profile's rules (it replaces rule_files).
rule_files: [rules.yaml]
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      # OAuth2 Proxy fails once at 10 m and recovers at the next run; Vault fails from 10 m.
      - series: 'swirl_signin_probe_success{job="signin-probe",target="oauth2-proxy"}'
        values: '1x9 0x4 1x20'
      - series: 'swirl_signin_probe_success{job="signin-probe",target="vault"}'
        values: '1x9 0x25'
      - series: 'swirl_signin_probe_unexpected_access{job="signin-probe",target="vault"}'
        values: '0x29 1x5'
      - series: 'up{job="signin-probe"}'
        values: '1x35'
      - series: 'swirl_signin_probe_last_run_timestamp_seconds{job="signin-probe",target="vault"}'
        values: '0+60x35'
    promql_expr_test:
      # One failed run raises nothing; two in a row fire.
      - expr: ALERTS{alertname="SignInProbeFailing", alertstate="firing"}
        eval_time: 15m
        exp_samples: []
      - expr: ALERTS{alertname="SignInProbeFailing", alertstate="firing"}
        eval_time: 17m
        exp_samples:
          - labels: 'ALERTS{alertname="SignInProbeFailing",alertstate="firing",severity="critical",owner="platform",job="signin-probe",target="vault"}'
            value: 1
      - expr: ALERTS{alertname="SignInProbeUnexpectedAccess", alertstate="firing"}
        eval_time: 31m
        exp_samples:
          - labels: 'ALERTS{alertname="SignInProbeUnexpectedAccess",alertstate="firing",severity="critical",owner="platform",job="signin-probe",target="vault"}'
            value: 1
      - expr: ALERTS{alertname="SignInProbeStale"}
        eval_time: 30m
        exp_samples: []
  - interval: 1m
    input_series:
      # The probe stops: its target goes down.
      - series: 'up{job="signin-probe"}'
        values: '1x4 0x20'
    promql_expr_test:
      - expr: ALERTS{alertname="SignInProbeStale", alertstate="firing"}
        eval_time: 16m
        exp_samples:
          - labels: 'ALERTS{alertname="SignInProbeStale",alertstate="firing",severity="warning",owner="platform"}'
            value: 1
