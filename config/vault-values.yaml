# Audit logs use a dedicated volume and an in-pod rotator. The process namespace
# is shared only so the unprivileged sidecar can send Vault SIGHUP after rotating.
server:
  image:
    repository: docker.io/hashicorp/vault
    tag: 2.1.1@sha256:47f14a6acb98f48d798a07df7c83f23a6e636e1cf724c5f8ff165cb32667a1e2
  shareProcessNamespace: true
  statefulSet:
    securityContext:
      container:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
  volumes:
    - name: audit
      persistentVolumeClaim:
        claimName: vault-audit
    # The Helm entrypoint prepares /tmp/storageconfig.hcl before starting Vault.
    # Keep it writable and bounded without making the image filesystem writable.
    - name: vault-tmp
      emptyDir:
        medium: Memory
        sizeLimit: 32Mi
  volumeMounts:
    - name: audit
      mountPath: /vault/audit
    - name: vault-tmp
      mountPath: /tmp
  extraContainers:
    - name: audit-log-rotate
      image: docker.io/library/busybox:1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
      command: ["/bin/sh", "-ceu"]
      args:
        - |
          umask 077
          audit_file=/vault/audit/vault-audit.log
          max_bytes="${AUDIT_MAX_BYTES:-268435456}"
          keep_files="${AUDIT_KEEP_FILES:-8}"
          interval="${AUDIT_ROTATION_INTERVAL_SECONDS:-300}"

          rotate_audit_log() {
            stamp="$(date -u +%Y%m%dT%H%M%SZ)"
            rotated_file="$audit_file.$stamp"
            mv "$audit_file" "$rotated_file"

            vault_pid="$(pidof vault | awk '{print $1}')"
            if [ -z "$vault_pid" ] || ! kill -HUP "$vault_pid"; then
              echo "Unable to signal Vault; restoring the active audit filename" >&2
              mv "$rotated_file" "$audit_file"
              return 1
            fi

            attempts=0
            while [ ! -f "$audit_file" ] && [ "$attempts" -lt 30 ]; do
              attempts=$((attempts + 1))
              sleep 1
            done
            if [ ! -f "$audit_file" ]; then
              echo "Vault did not reopen the audit file after SIGHUP" >&2
              [ -e "$audit_file" ] || mv "$rotated_file" "$audit_file"
              return 1
            fi

            gzip "$rotated_file"
            archive_count=0
            for archive in $(ls -1t "$audit_file".*.gz 2>/dev/null || true); do
              archive_count=$((archive_count + 1))
              [ "$archive_count" -le "$keep_files" ] || rm -f -- "$archive"
            done
            echo "Rotated Vault audit log to $rotated_file.gz"
          }

          while true; do
            sleep "$interval"
            [ -f "$audit_file" ] || continue
            audit_size="$(wc -c < "$audit_file")"
            if [ "$audit_size" -ge "$max_bytes" ]; then
              rotate_audit_log || true
            fi
          done
      env:
        - name: AUDIT_MAX_BYTES
          value: "268435456"
        - name: AUDIT_KEEP_FILES
          value: "8"
        - name: AUDIT_ROTATION_INTERVAL_SECONDS
          value: "300"
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 1000
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
      resources:
        requests:
          cpu: 5m
          memory: 8Mi
        limits:
          cpu: 100m
          memory: 32Mi
      volumeMounts:
        - name: audit
          mountPath: /vault/audit
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: '1'
      memory: 512Mi
  # Chart's single-server Raft config plus Prometheus telemetry (vault-ha-values.yaml
  # replaces it). Unauthenticated metrics let standbys answer. Read at startup only.
  ha:
    raft:
      config: |
        ui = true
        listener "tcp" {
          tls_disable = 1
          address = "[::]:8200"
          cluster_address = "[::]:8201"
          telemetry {
            unauthenticated_metrics_access = true
          }
        }
        storage "raft" {
          path = "/vault/data"
        }
        service_registration "kubernetes" {}
        telemetry {
          prometheus_retention_time = "30s"
          disable_hostname = true
        }
