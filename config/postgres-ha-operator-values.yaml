# CloudNativePG chart 0.29.2 / operator 1.30.2. Install separately before its CRs.
replicaCount: 3
priorityClassName: platform-critical
image:
  tag: "1.30.2@sha256:f96f6be3d81ec93819b443c665c575c609342fca840df90d4d87dae314a5b913"
config:
  data:
    WATCH_NAMESPACE: infra
additionalEnv:
  - name: GOMEMLIMIT
    value: 384MiB
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi
affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: cloudnative-pg
        topologyKey: kubernetes.io/hostname
# The chart defaults already enforce non-root, read-only root, drop ALL and
# RuntimeDefault seccomp for the operator. Keep these explicit for review.
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsUser: 10001
  runAsGroup: 10001
  seccompProfile:
    type: RuntimeDefault
  capabilities:
    drop: [ALL]
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
