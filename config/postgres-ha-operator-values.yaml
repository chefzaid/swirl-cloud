# CloudNativePG chart 0.29.1 / operator 1.30.1. Install separately before its CRs.
replicaCount: 3
image:
  tag: "1.30.1@sha256:923c267ec29636db3bee20f993d0ec4973fa22998e1adad37da79e4d32b5bc07"
config:
  data:
    WATCH_NAMESPACE: infra
additionalEnv:
  - name: GOMEMLIMIT
    value: 384MiB
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi
affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: cloudnative-pg
        topologyKey: kubernetes.io/hostname
# The chart defaults already enforce non-root, read-only root, drop ALL and
# RuntimeDefault seccomp for the operator. Keep these explicit for review.
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsUser: 10001
  runAsGroup: 10001
  seccompProfile:
    type: RuntimeDefault
  capabilities:
    drop: [ALL]
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
