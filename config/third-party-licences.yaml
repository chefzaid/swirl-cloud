# Licence register: one record for every image, chart and tool in the release
# SBOM (python3 scripts/release.py sbom), checked by scripts/validate-repository.sh
# and turned into THIRD_PARTY_NOTICES in each release bundle (docs/guides/releases.md).
# licence is an SPDX expression; LicenseRef-RSALv2 is the Redis Source Available
# License v2. customer_use says whether redistributing the component and operating
# it for customers is allowed under that licence ("allowed"), or waits for the
# owner's decision in the licensing ADR ("decision-needed", TODO.md Needs Input).
# Licences were read from each source repository on 2026-10-27; they describe the
# component's own code: container images also carry their base distribution's
# packages under those packages' licences.
components:
  - name: cr.fluentbit.io/fluent/fluent-bit
    licence: Apache-2.0
    source: https://github.com/fluent/fluent-bit
    customer_use: allowed
    obligations: Keep the licence text and any NOTICE file in copies.
  - name: docker.elastic.co/beats/filebeat-wolfi
    licence: Elastic-2.0
    source: https://github.com/elastic/beats
    customer_use: decision-needed
    obligations: No hosted or managed service to third parties that exposes a substantial set of its features;
      do not bypass licence keys; keep notices.
    notes: Elastic's default (non-oss) binaries are under the Elastic License; the Apache-2.0 alternative
      is the filebeat-oss image.
  - name: docker.elastic.co/elasticsearch/elasticsearch-wolfi
    licence: Elastic-2.0
    source: https://github.com/elastic/elasticsearch
    customer_use: decision-needed
    obligations: No hosted or managed service to third parties that exposes a substantial set of its features;
      do not bypass licence keys; keep notices.
    notes: Source is AGPL-3.0-only OR SSPL-1.0 OR Elastic-2.0 (x-pack Elastic-2.0 only); whether the pinned
      binary image is also offered under AGPL-3.0 is unverified, so the most restrictive licence is recorded.
