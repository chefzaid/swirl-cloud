# A loaded node answers slowly: restart or withdraw only on a real failure
# (the probe policy in scripts/validate-manifests.py).
server:
  service:
    type: ClusterIP
  livenessProbe:
    timeoutSeconds: 5
    failureThreshold: 6
  readinessProbe:
    timeoutSeconds: 3

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: '1'
      memory: 512Mi
redis:
  enabled: true

# Argo CD authenticates directly against Keycloak through oidc.config below.
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: '1'
      memory: 256Mi
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  image:
    repository: docker.io/library/redis
    tag: 8.10.2-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
dex:
  enabled: false

configs:
  params:
    server.insecure: true
  cm:
    resource.respectRBAC: normal
    url: https://argocd.__PUBLIC_DOMAIN__
    admin.enabled: false
    oidc.config: |
      name: Keycloak
      issuer: https://keycloak.__PUBLIC_DOMAIN__/auth/realms/__KEYCLOAK_REALM__
      clientID: argocd
      enablePKCEAuthentication: true
      requestedScopes:
        - openid
        - profile
        - email
        - groups
        - offline_access
  rbac:
    policy.default: role:readonly
    policy.csv: |
      g, platform-admins, role:admin
    scopes: '[groups]'
global:
  securityContext: &id001
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
controller:
  readinessProbe:
    timeoutSeconds: 3
  # Collect garbage before the 2Gi container limit; retain headroom for
  # non-Go allocations and reconciliation subprocesses. Rebuilding the cluster
  # cache after a restart passed 1Gi. See docs/deployment.md.
  env:
    - name: GOMEMLIMIT
      value: 1536MiB
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: '1'
      memory: 2Gi
repoServer:
  livenessProbe:
    timeoutSeconds: 5
    failureThreshold: 6
  readinessProbe:
    timeoutSeconds: 3
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: '1'
      memory: 768Mi
  copyutil:
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 100m
        memory: 64Mi
applicationSet:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: '1'
      memory: 256Mi
notifications:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: '1'
      memory: 128Mi
redisSecretInit:
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: '1'
      memory: 64Mi
  securityContext: *id001
