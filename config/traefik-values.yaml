# Native Kubernetes Ingress keeps routing and discovery owned by each repository.
fullnameOverride: traefik
# No version checks or usage statistics leave the installation.
global:
  checkNewVersion: false
  sendAnonymousUsage: false
image:
  registry: docker.io
  repository: library/traefik
  tag: v3.7.13
  digest: sha256:f86a2cab1b5c649070c49f883c743dd32d8485a56e3368c5f93b9e91f1e91259
deployment:
  replicas: 1
ingressClass:
  name: traefik
  isDefaultClass: true
providers:
  kubernetesIngress:
    ingressClass: traefik
    strictPrefixMatching: true
    # Longhorn's UI has an explicit platform-owned ExternalName Service.
    allowExternalNameServices: true
  kubernetesCRD:
    allowCrossNamespace: false
api:
  dashboard: false
ingressRoute:
  dashboard:
    enabled: false
ports:
  traefik:
    port: 9000
    expose: {default: false}
  web:
    asDefault: true
    port: 8080
    exposedPort: 80
    http:
      redirections:
        entryPoint: {to: websecure, scheme: https, permanent: true}
  websecure:
    asDefault: true
    port: 8444
    exposedPort: 443
    http:
      tls: {enabled: true}
      # Drop visitor-supplied routing headers the edge passes on (its client-address
      # chain stays), then repeat the edge's response header policy.
      middlewares: [infra-forwarded-headers@kubernetescrd, infra-security-headers@kubernetescrd]
    transport:
      respondingTimeouts:
        readTimeout: 900s
        writeTimeout: 900s
        idleTimeout: 900s
# JSON access logs on stdout reach Elasticsearch through Fluent Bit. Request
# headers and query strings are dropped (cookies, Authorization, OAuth codes);
# only the client identity Cloudflare forwards and the user agent are kept.
accessLog:
  enabled: true
  format: json
  fields:
    defaultMode: keep
    headers:
      defaultMode: drop
      names:
        User-Agent: keep
        Cf-Connecting-Ip: keep
        Cf-Ray: keep
    queryParameters:
      defaultMode: drop
additionalArguments:
  - --serversTransport.forwardingTimeouts.responseHeaderTimeout=900s
service:
  spec:
    type: LoadBalancer
    externalTrafficPolicy: Local
nodeSelector:
  kubernetes.io/os: linux
  node-role.kubernetes.io/control-plane: "true"
  svccontroller.k3s.cattle.io/enablelb: "true"
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: {drop: [ALL]}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile: {type: RuntimeDefault}
# A loaded node answers slowly: restart or withdraw only on a real failure
# (the probe policy in scripts/validate-manifests.py).
readinessProbe:
  timeoutSeconds: 3
  failureThreshold: 3
livenessProbe:
  timeoutSeconds: 5
  failureThreshold: 6
resources:
  requests: {cpu: 100m, memory: 90Mi}
  limits: {cpu: "1", memory: 512Mi}
tlsStore:
  default:
    defaultCertificate:
      secretName: __TLS_SECRET_NAME__
tlsOptions:
  default:
    minVersion: VersionTLS12
extraObjects:
  # GitLab/Rack also reads the forwarded chain; it shares this edge list
  # instead of keeping a second hard-coded Cloudflare list.
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: ingress-proxy-trust
      namespace: infra
    data:
      trustedIPs: '{{ join "," .Values.ports.websecure.forwardedHeaders.trustedIPs }}'
  - apiVersion: traefik.io/v1alpha1
    kind: Middleware
    metadata:
      name: forwarded-headers
      namespace: infra
    spec:
      headers:
        customRequestHeaders:
          Forwarded: ""
          X-Real-IP: ""
          X-Forwarded-Host: ""
          X-Forwarded-Port: ""
          X-Forwarded-Proto: https
          X-Forwarded-Uri: ""
          X-Forwarded-Prefix: ""
          X-Forwarded-Method: ""
  # Repeats the zone's Cloudflare header policy (configure-cloudflare.sh): HSTS
  # with subdomains, no preload, and nosniff. configure-ingress.sh sets max-age, or
  # 0 (no header) when CLOUDFLARE_ENABLE_HSTS=false. Apps own framing and CSP.
  - apiVersion: traefik.io/v1alpha1
    kind: Middleware
    metadata:
      name: security-headers
      namespace: infra
    spec:
      headers:
        stsSeconds: __HSTS_MAX_AGE__
        stsIncludeSubdomains: true
        stsPreload: false
        contentTypeNosniff: true
