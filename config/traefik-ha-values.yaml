# One ingress and outbound connector per control plane; HTTPS stays pod-local.
deployment:
  kind: DaemonSet
  additionalContainers:
    - name: cloudflared
      image: docker.io/cloudflare/cloudflared:2026.9.3@sha256:072c067d25ccbe61d46e18f0d0723255f2bb5304f7317caa95b27031520ff92c
      args: [tunnel, --no-autoupdate, --metrics, "0.0.0.0:2000", run, --token-file, /etc/cloudflared/token]
      # Named so Prometheus finds the connector's metrics (job cloudflared).
      ports:
        - {name: tunnel-metrics, containerPort: 2000, protocol: TCP}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: [ALL]}
        seccompProfile: {type: RuntimeDefault}
      resources:
        requests: {cpu: 100m, memory: 64Mi}
        limits: {cpu: "1", memory: 256Mi}
      readinessProbe:
        httpGet: {path: /ready, port: 2000}
        periodSeconds: 5
        timeoutSeconds: 3
      # A connector withdraws if its co-located ingress stops answering for a minute.
      livenessProbe:
        httpGet: {path: /ping, port: 9000}
        initialDelaySeconds: 30
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 6
      volumeMounts:
        - name: cloudflare-tunnel
          mountPath: /etc/cloudflared
          readOnly: true
  additionalVolumes:
    - name: cloudflare-tunnel
      secret:
        secretName: cloudflare-tunnel
        defaultMode: 0444
nodeSelector:
  svccontroller.k3s.cattle.io/enablelb: null
service:
  spec:
    type: ClusterIP
    externalTrafficPolicy: null
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1
    maxSurge: 0
ports:
  web:
    forwardedHeaders:
      trustedIPs: [127.0.0.1/32, "::1/128"]
  websecure:
    forwardedHeaders:
      trustedIPs: [127.0.0.1/32, "::1/128"]
