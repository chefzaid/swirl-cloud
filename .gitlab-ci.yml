workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

stages:
  - validate
  - verify

default:
  tags:
    - swirl-cloud
  interruptible: true

variables:
  # apk-tools 3 resolves a relative cache directory against the filesystem root.
  APK_CACHE_DIR: $CI_PROJECT_DIR/.cache/apk

validate:repository:
  stage: validate
  image: "docker.io/library/alpine:3.24.2@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6"
  cache:
    key: swirl-cloud-alpine-tools-v2
    paths:
      - .cache/apk/
    policy: pull-push
  before_script:
    - mkdir -p "$APK_CACHE_DIR"
    - apk add --cache-dir "$APK_CACHE_DIR" ansible-core bash coreutils findutils git grep helm jq nodejs openssl py3-yaml python3 shellcheck sqlite tzdata util-linux
  script:
    - bash scripts/validate-repository.sh

verify:gitops:
  stage: verify
  image: "docker.io/library/alpine:3.24.2@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6"
  cache:
    key: swirl-cloud-alpine-tools-v2
    paths:
      - .cache/apk/
    policy: pull
  before_script:
    - mkdir -p "$APK_CACHE_DIR"
    - apk add --cache-dir "$APK_CACHE_DIR" jq kubectl
  script:
    - |
      deadline=$(( $(date +%s) + 900 ))
      while [ "$(date +%s)" -lt "$deadline" ]; do
        application="$(kubectl get application swirl-cloud -n infra -o json 2>/dev/null || true)"
        revision="$(printf '%s' "$application" | jq -r '.status.sync.revision // empty')"
        sync="$(printf '%s' "$application" | jq -r '.status.sync.status // empty')"
        health="$(printf '%s' "$application" | jq -r '.status.health.status // empty')"
        if [[ "$revision" == "$CI_COMMIT_SHA" && "$sync" == "Synced" && "$health" == "Healthy" ]]; then
          printf 'Argo CD reconciled swirl-cloud at %s\n' "$revision"
          exit 0
        fi
        sleep 10
      done
      printf 'Argo CD did not reconcile %s before the timeout\n' "$CI_COMMIT_SHA" >&2
      kubectl get application swirl-cloud -n infra -o yaml >&2 || true
      exit 1
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

verify:delivery-platform:
  stage: verify
  needs:
    - job: verify:gitops
      artifacts: false
  image: "docker.io/library/alpine:3.24.2@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6"
  cache:
    key: swirl-cloud-alpine-tools-v2
    paths:
      - .cache/apk/
    policy: pull
  before_script:
    - mkdir -p "$APK_CACHE_DIR"
    - apk add --cache-dir "$APK_CACHE_DIR" curl jq kubectl
  script:
    - test -n "$ELASTICSEARCH_CI_USERNAME" && test -n "$ELASTICSEARCH_CI_PASSWORD"
    - curl --fail --silent --show-error http://gitlab.infra.svc.cluster.local/-/readiness >/dev/null
    - curl --fail --silent --show-error http://prometheus.infra.svc.cluster.local:9090/-/ready >/dev/null
    - curl --fail --silent --show-error http://grafana.infra.svc.cluster.local:3000/api/health | jq -e '.database == "ok"' >/dev/null
    - kubectl rollout status deployment/trivy-operator -n infra --timeout=300s
    - kubectl rollout status statefulset/trivy-server -n infra --timeout=300s
    - kubectl get crd vulnerabilityreports.aquasecurity.github.io configauditreports.aquasecurity.github.io exposedsecretreports.aquasecurity.github.io >/dev/null
    - kubectl get configmap grafana-trivy-security-dashboard -n infra >/dev/null
    - curl --fail --silent --show-error http://trivy-operator.infra.svc.cluster.local/metrics | grep '^trivy_' >/dev/null
    - curl --fail --silent --show-error --user "$ELASTICSEARCH_CI_USERNAME:$ELASTICSEARCH_CI_PASSWORD" http://elasticsearch.infra.svc.cluster.local:9200/_cluster/health | jq -e '.status == "green" or .status == "yellow"' >/dev/null
    - test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://gitlab-registry.infra.svc.cluster.local:5050/v2/)" = "401"
    - kubectl get configmap grafana-gitlab-delivery-dashboard -n infra >/dev/null
    - |
      curl --get --fail --silent --show-error \
        --data-urlencode 'query=max(up{namespace="infra",app="gitlab"})' \
        http://prometheus.infra.svc.cluster.local:9090/api/v1/query |
        jq -e '.status == "success" and (.data.result[0].value[1] | tonumber) == 1' >/dev/null
    - |
      curl --get --fail --silent --show-error \
        --data-urlencode 'query=max(up{namespace="infra",pod=~"trivy-operator.*"})' \
        http://prometheus.infra.svc.cluster.local:9090/api/v1/query |
        jq -e '.status == "success" and (.data.result[0].value[1] | tonumber) == 1' >/dev/null
    - |
      curl --get --fail --silent --show-error \
        --user "$ELASTICSEARCH_CI_USERNAME:$ELASTICSEARCH_CI_PASSWORD" \
        --data-urlencode 'q=kubernetes.pod_name:gitlab*' \
        http://elasticsearch.infra.svc.cluster.local:9200/kubernetes-logs-*/_count |
        jq -e '.count > 0' >/dev/null
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

verify:registry-write:
  stage: verify
  image: "docker.io/library/alpine:3.24.2@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6"
  cache:
    key: swirl-cloud-alpine-tools-v2
    paths:
      - .cache/apk/
    policy: pull
  before_script:
    - mkdir -p "$APK_CACHE_DIR"
    - apk add --cache-dir "$APK_CACHE_DIR" curl jq
  script:
    - |
      registry_url=http://gitlab-registry.infra.svc.cluster.local:5050
      repository="$CI_PROJECT_PATH/ci-smoke"
      registry_token="$(
        curl --fail --silent --show-error \
          --user "$CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD" \
          --get \
          --data-urlencode service=container_registry \
          --data-urlencode "scope=repository:$repository:pull,push" \
          http://gitlab.infra.svc.cluster.local/jwt/auth |
          jq -er '.token'
      )"
      config='{"architecture":"amd64","os":"linux","rootfs":{"type":"layers","diff_ids":[]},"config":{}}'
      config_digest="sha256:$(printf '%s' "$config" | sha256sum | cut -d' ' -f1)"
      config_size="$(printf '%s' "$config" | wc -c | tr -d ' ')"
      upload_location="$(
        curl --dump-header - --output /dev/null --request POST \
          --header "Authorization: Bearer $registry_token" \
          "$registry_url/v2/$repository/blobs/uploads/" |
          awk 'BEGIN { IGNORECASE=1 } /^location:/ { sub(/^[^:]+:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit }'
      )"
      upload_path="$(printf '%s' "$upload_location" | sed -E 's#^https?://[^/]+##')"
      case "$upload_path" in
        *\?*) upload_path="$upload_path&digest=$config_digest" ;;
        *) upload_path="$upload_path?digest=$config_digest" ;;
      esac
      printf '%s' "$config" |
        curl --fail --silent --show-error --request PUT \
          --header "Authorization: Bearer $registry_token" \
          --header 'Content-Type: application/octet-stream' \
          --data-binary @- "$registry_url$upload_path" >/dev/null
      manifest="$(
        jq -cn \
          --arg digest "$config_digest" \
          --argjson size "$config_size" \
          '{schemaVersion:2,mediaType:"application/vnd.oci.image.manifest.v1+json",config:{mediaType:"application/vnd.oci.image.config.v1+json",digest:$digest,size:$size},layers:[]}'
      )"
      printf '%s' "$manifest" |
        curl --fail --silent --show-error --request PUT \
          --header "Authorization: Bearer $registry_token" \
          --header 'Content-Type: application/vnd.oci.image.manifest.v1+json' \
          --data-binary @- "$registry_url/v2/$repository/manifests/ci-smoke" >/dev/null
      curl --fail --silent --show-error \
        --header "Authorization: Bearer $registry_token" \
        --header 'Accept: application/vnd.oci.image.manifest.v1+json' \
        "$registry_url/v2/$repository/manifests/ci-smoke" |
        jq -e --arg digest "$config_digest" '.config.digest == $digest and (.layers | length) == 0' >/dev/null
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# Non-blocking supply-chain report for artifacts the platform ships besides its
# running images: vendored chart archives (embedded misconfiguration checks, no
# download) and the CI image, scanned through the in-cluster Trivy server.
report:platform-artifacts:
  stage: verify
  needs: []
  allow_failure: true
  image:
    name: "docker.io/aquasec/trivy:0.74.0@sha256:ee940acbf1f58ebadb42d01434ce4609530bf1b52536afbd1eee66cd7123c5c9"
    entrypoint: [""]
  variables:
    TRIVY_CACHE_DIR: $CI_PROJECT_DIR/.cache/trivy
    TRIVY_DISABLE_VEX_NOTICE: "true"
  script:
    - mkdir -p reports
    - trivy config --skip-check-update --exit-code 0 --severity CRITICAL,HIGH --output reports/vendored-charts.txt k8s/charts
    - trivy image --server http://trivy-service.infra:4954 --scanners vuln --exit-code 0 --severity CRITICAL,HIGH --output reports/ci-image.txt "docker.io/library/alpine:3.24.2@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6"
    - cat reports/vendored-charts.txt reports/ci-image.txt
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - reports/
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
